<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>防災モニター v4.0</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:#fff;
  font-family:Meiryo,sans-serif;
}

h1{
  margin-top:0;
}

#status{
  background:#222;
  padding:10px;
  margin-bottom:20px;
  border-radius:5px;
}

#events{
  background:#1a1a1a;
  min-height:300px;
  padding:10px;
  border-radius:5px;
  overflow-y:auto;
}

.event{
  white-space: pre-wrap;
  padding:8px;
  border-bottom:1px solid #333;
}

/* =====================
   EEW
===================== */

#eew-overlay,
#tsunami-overlay{
  display:none;
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:99999;
  color:#fff;
  text-align:center;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#eew-title,
#tsunami-title{
  font-size:90px;
  font-weight:bold;
  margin-bottom:40px;
}

#eew-message,
#tsunami-message{
  font-size:48px;
  padding:20px;
  max-width:90%;
}

#eew-help,
#tsunami-help{
  margin-top:40px;
  font-size:24px;
}

/* =====================
   EEW 警報
===================== */

#eew-overlay.warning{
  background:#c00000;
  animation:eewWarningFlash .5s infinite;
}

@keyframes eewWarningFlash{
  0%{background:#700000;}
  50%{background:#ff0000;}
  100%{background:#700000;}
}

/* =====================
   EEW 予報
===================== */

#eew-overlay.forecast{
  background:#a07000;
  animation:eewForecastFlash 1s infinite;
}

@keyframes eewForecastFlash{
  0%{background:#8b7500;}
  50%{
    background:#ffd700;
    color:#000;
  }
  100%{background:#8b7500;}
}

/* =====================
   津波警報
===================== */

#tsunami-overlay.warning{
  background:#4b0082;
  animation:tsunamiFlash 1s infinite;
}

@keyframes tsunamiFlash{
  0%{
    background:#2f0050;
  }

  50%{
    background:#8000ff;
  }

  100%{
    background:#2f0050;
  }
}
</style>
</head>

<body>

<h1>防災モニター v4.0</h1>

<div id="status">
接続待機中…
</div>

<h2>受信情報</h2>

<div id="events"></div>

<!-- =====================
     緊急地震速報
===================== -->

<div id="eew-overlay">

  <div id="eew-title">
    緊急地震速報
  </div>

  <div id="eew-message">
    地震情報を受信しました
  </div>

  <div id="eew-help">
    画面をクリックすると閉じます
  </div>

</div>

<!-- =====================
     津波警報
===================== -->

<div id="tsunami-overlay">

  <div id="tsunami-title">
    津波警報
  </div>

  <div id="tsunami-message">
    津波警報が発表されました
  </div>

  <div id="tsunami-help">
    画面をクリックすると閉じます
  </div>

</div>

<audio
  id="alert-sound"
  src="alert.mp3"
  preload="auto">
</audio>

<audio
  id="tsunami-sound"
  src="tsunami.mp3"
  preload="auto">
</audio>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const status =
  document.getElementById("status");

const events =
  document.getElementById("events");

const overlay =
  document.getElementById(
    "eew-overlay"
  );

const eewMessage =
  document.getElementById(
    "eew-message"
  );

const alarm =
  document.getElementById(
    "alert-sound"
  );

const tsunamiOverlay =
  document.getElementById(
    "tsunami-overlay"
  );

const tsunamiMessage =
  document.getElementById(
    "tsunami-message"
  );

const tsunamiSound =
  document.getElementById(
    "tsunami-sound"
  );

/* =====================
   音声読み上げ
===================== */

function speak(text){

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }

  speechSynthesis.cancel();

  const utter =
    new SpeechSynthesisUtterance(
      text
    );

  utter.lang = "ja-JP";
  utter.rate = 1.0;

  speechSynthesis.speak(
    utter
  );
}

/* =====================
   システム
===================== */

socket.on("system", msg => {
  status.textContent =
    msg.message;
});

/* =====================
   一覧表示
===================== */

function addMessage(type, msg) {
  const div = document.createElement("div");
  div.className = "event";

  div.textContent =
`${new Date().toLocaleTimeString()}
${type} : ${msg.title}

${msg.detail || ""}`;

  document
    .getElementById("events")
    .prepend(div);
}
/* =====================
   EEW
===================== */

socket.on("eew", msg => {

  addMessage(
    "EEW",
    msg
  );

  eewMessage.textContent =
    msg.title;

  overlay.style.display =
    "flex";

  overlay.classList.remove(
    "warning",
    "forecast"
  );

  if (
    msg.title.includes("警報")
  ) {

    overlay.classList.add(
      "warning"
    );

    alarm.currentTime = 0;

    alarm.play().catch(
      err => console.log(err)
    );

    speak(
      "緊急地震速報です。強い揺れに警戒してください。"
    );

  } else {

    overlay.classList.add(
      "forecast"
    );
  }
});

/* =====================
   津波
===================== */

socket.on("tsunami", msg => {

  addMessage(
    "津波",
    msg
  );

  tsunamiMessage.textContent =
    msg.title;

  tsunamiOverlay.style.display =
    "flex";

  tsunamiOverlay.classList.add(
    "warning"
  );

  tsunamiSound.currentTime = 0;

  tsunamiSound.play().catch(
    err => console.log(err)
  );

  let speech =
    "津波警報が発表されました。直ちに高台へ避難してください。";

  if (
    msg.title.includes(
      "大津波"
    )
  ) {
    speech =
      "大津波警報が発表されました。直ちに高い場所へ避難してください。";
  }

  speak(
    speech
  );
});

/* =====================
   気象警報
===================== */

socket.on("warning", msg => {
  addMessage(
    "警報",
    msg
  );
});

/* =====================
   閉じる
===================== */

overlay.onclick = () => {

  overlay.style.display =
    "none";

  overlay.classList.remove(
    "warning",
    "forecast"
  );

  alarm.pause();
  alarm.currentTime = 0;

  speechSynthesis.cancel();
};

tsunamiOverlay.onclick =
  () => {

    tsunamiOverlay.style.display =
      "none";

    tsunamiOverlay.classList.remove(
      "warning"
    );

    tsunamiSound.pause();
    tsunamiSound.currentTime = 0;

    speechSynthesis.cancel();
};
</script>

</body>
</html>
