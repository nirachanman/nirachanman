<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHK ニュースモニター（クール・ミニマル版）</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        :root { 
            --bg-color: #0b0f14;        /* 深海のような深いネイビー */
            --accent-color: #00bcd4;    /* ヘッダー線：鮮やかなシアン */
            --card-bg: #161c24;         /* 落ち着いたネイビーグレー */
            
            /* タイトルと概要文のカラー定義 */
            --text-gray-title: #90caf9; /* 奇数タイトル：眩しさを抑えたライトブルー */
            --text-gray-desc: #b0bec5;  /* 奇数概要：透明感のあるブルーグレー */
            
            --text-mint-title: #80cbc4; /* 偶数タイトル：やわらかなペールアクア */
            --text-mint-desc: #b0bec5;  /* 偶数概要：共通のブルーグレー */
        }
        
        body { font-family: sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; margin-bottom: 10px; flex-shrink: 0; }
        .header-top { display: flex; align-items: center; gap: 15px; overflow: hidden; }
        .header-link { text-decoration: none; display: flex; align-items: center; }
        h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; color: #fff; }
        
        .marquee-container { flex-grow: 1; overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: scroll-x 15s linear infinite; font-size: 1.1rem; color: #fff; }
        @keyframes scroll-x { 0% { transform: translate(100%, 0); } 100% { transform: translate(-100%, 0); } }

        #news-container { 
            flex-grow: 1; 
            overflow-y: auto;          
            scroll-behavior: smooth; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            -webkit-overflow-scrolling: touch; 
        }
        
        #news-container::-webkit-scrollbar {
            display: none;
        }
        
        .news-item { 
            display: flex; 
            flex-direction: column; 
            text-decoration: none; 
            background-color: var(--card-bg); 
            padding: 12px; 
            border-radius: 4px; 
            border-left: 4px solid #37474f; /* 変更：背景に馴染む青みがかった左線 */
            gap: 8px;
        }
        
        .news-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .news-title { 
            font-size: 1.3rem; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            font-weight: 400; 
        }
        
        .news-time { 
            font-size: 1.1rem; 
            color: #607d8b; /* 変更：少し青みを持たせた時間表示 */
            white-space: nowrap;
            flex-shrink: 0;
        }

        .news-desc {
            font-size: 1.1rem;
            line-height: 1.5;
            white-space: normal;       
            word-wrap: break-word;     
            text-overflow: clip;       
            overflow: visible;         
        }

        .news-item:nth-child(odd) .news-title { color: var(--text-gray-title); }
        .news-item:nth-child(odd) .news-desc { color: var(--text-gray-desc); }

        .news-item:nth-child(even) .news-title { color: var(--text-mint-title); }
        .news-item:nth-child(even) .news-desc { color: var(--text-mint-desc); }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="https://news.web.nhk/newsweb/pl/news-nwa-latest-nationwide" target="_blank" rel="noopener noreferrer" class="header-link">
                <h1>NHK 全国新着ニュース</h1>
            </a>
            <div class="marquee-container" id="marquee"></div>
        </div>
    </header>
    <main id="news-container"></main>

    <script>
        const RSS_URLS = [
            'https://news.web.nhk/n-data/conf/na/rss/cat0.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat1.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat2.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat3.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat4.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat5.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat6.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat7.xml'
        ];

        let isPaused = false;
        let wakeLock = null;
        let resumeTimeout = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function updateNews() {
            let allItems = [];
            for (const url of RSS_URLS) {
                try {
                    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    for (let item of xml.getElementsByTagName('item')) {
                        const descEl = item.getElementsByTagName('description')[0];
                        const description = descEl ? descEl.textContent : '';

                        allItems.push({
                            title: item.getElementsByTagName('title')[0].textContent,
                            link: item.getElementsByTagName('link')[0].textContent,
                            description: description,
                            pubDate: new Date(item.getElementsByTagName('pubDate')[0].textContent)
                        });
                    }
                } catch (e) {}
            }
            if (allItems.length === 0) return;

            allItems.sort((a, b) => b.pubDate - a.pubDate);
            const unique = Array.from(new Map(allItems.map(i => [i.title, i])).values());

            document.getElementById('marquee').innerHTML = `<a href="${unique[0].link}" target="_blank" style="text-decoration:none;"><span class="marquee-text">${unique[0].title}</span></a>`;
            
            document.getElementById('news-container').innerHTML = unique.slice(1, 51).map(item => `
                <a href="${item.link}" target="_blank" class="news-item">
                    <div class="news-header-row">
                        <div class="news-title">${item.title}</div>
                        <div class="news-time">${item.pubDate.getMonth()+1}/${item.pubDate.getDate()} ${String(item.pubDate.getHours()).padStart(2,'0')}:${String(item.pubDate.getMinutes()).padStart(2,'0')}</div>
                    </div>
                    <div class="news-desc">${item.description}</div>
                </a>
            `).join('');
            
            document.getElementById('news-container').scrollTop = 0;
        }

        const container = document.getElementById('news-container');

        function pauseAutoScroll() {
            isPaused = true;
            clearTimeout(resumeTimeout);
            resumeTimeout = setTimeout(() => {
                isPaused = false;
            }, 5000);
        }

        container.addEventListener('touchstart', pauseAutoScroll);
        container.addEventListener('touchmove', pauseAutoScroll);
        container.addEventListener('scroll', pauseAutoScroll);
        container.addEventListener('mousedown', () => isPaused = true);
        container.addEventListener('mouseup', () => { isPaused = false; });

        async function autoScroll() {
            if (isPaused) return;

            const firstItem = container.querySelector('.news-item');
            const itemHeight = firstItem ? firstItem.offsetHeight + 6 : 100;

            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 20) {
                location.reload();
            } else {
                container.scrollTop += (itemHeight * 3); 
            }
        }

        async function init() {
            await updateNews();
            await requestWakeLock();
        }

        init();
        
        setInterval(autoScroll, 30000); 

        setTimeout(() => {
            location.reload();
        }, 270000);

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
