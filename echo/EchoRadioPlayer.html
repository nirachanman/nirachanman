<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Radio Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #282a2d;
            --accent-color: #013c82; 
            --text-color: #e0e0a4; 
            --off-white: #8e9297;
            --error-color: #cf6679;
            --timer-color: #7da87b; 
            
            /* 停止ボタン用の落ち着いたカラー */
            --stop-bg: #454950;
            --stop-border: #5c616a;
            --stop-text: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 12px;
            box-sizing: border-box;
            text-align: center;
        }

        /* --- 【更新】ステータスパネル全体を青い枠で囲む --- */
        .status-panel {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid var(--accent-color); /* 4辺すべてを青枠で囲む */
            display: flex;
            flex-direction: column;
            gap: 10px;
            
            position: sticky;
            top: 10px; 
            z-index: 100; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); 
        }

        /* 年月日・現在時刻の表示行 */
        .datetime-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 4px 6px 4px;
            border-bottom: 1px solid #3a3c40;
            font-variant-numeric: tabular-nums;
        }

        #date-display {
            font-size: 0.95rem;
            color: var(--off-white);
            font-weight: bold;
        }

        #time-display {
            font-size: 1.35rem;
            color: var(--text-color);
            font-weight: bold;
            letter-spacing: 0.04em;
        }

        .panel-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .top-row #status-label,
        .top-row .stop-btn {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        /* ステータス表示（停止ボタンと揃えた四角いデザイン） */
        #status-label {
            padding: 10px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 2px solid #555;
            background-color: transparent;
            color: var(--off-white);
            cursor: default;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        #status-label.active {
            border-color: var(--timer-color);
            color: var(--timer-color);
        }

        /* 放送局名表示兼ポップアップトリガーボタン */
        #current-station-btn {
            font-size: 1.15rem;
            font-weight: bold;
            margin: 2px 0;
            width: 100%;
            height: 2.4rem;
            padding: 0 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid #3a3c40;
            border-radius: 10px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        #current-station-btn:active {
            background: rgba(0, 0, 0, 0.4);
            border-color: var(--accent-color);
        }

        #current-station-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            text-align: center;
        }

        .dropdown-arrow {
            font-size: 0.8rem;
            color: var(--off-white);
            margin-left: 8px;
        }

        /* ボリュームコントロール領域 */
        .volume-row {
            padding: 2px 5px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: rgba(0, 0, 0, 0.15);
            padding: 6px 12px;
            border-radius: 30px;
            box-sizing: border-box;
        }

        .volume-icon {
            font-size: 0.9rem;
            color: var(--off-white);
            user-select: none;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #444;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--timer-color);
            transition: transform 0.1s;
        }
        .volume-slider::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: var(--timer-color);
            transition: transform 0.1s;
        }
        .volume-slider::-moz-range-thumb:active {
            transform: scale(1.2);
        }

        .bottom-row {
            justify-content: space-between;
            border-top: 1px solid #3a3c40;
            padding-top: 10px;
        }

        .timer-select-wrapper {
            flex: 1;
            max-width: 140px;
            text-align: left;
        }

        .timer-select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            background-color: #3a3c40;
            color: #bbb;
            border: 1px solid #555;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23bbb' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 24px;
        }

        .timer-select.active {
            border-color: var(--timer-color);
            color: var(--timer-color);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%237da87b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
        }

        #timer-display {
            font-size: 1.05rem;
            color: var(--timer-color);
            font-weight: bold;
            text-align: right;
            flex: 1;
            padding-left: 10px;
        }

        /* --- ポップアップリスト（モーダル） --- */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .popup-overlay.open {
            display: flex;
        }

        .popup-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            max-height: 75vh;
            border-radius: 16px;
            border: 1px solid #3a3c40;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid #3a3c40;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .popup-close-btn {
            background: transparent;
            border: none;
            color: var(--off-white);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }

        .popup-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .popup-item {
            background: transparent;
            border: none;
            border-bottom: 1px solid #333538;
            color: var(--off-white);
            padding: 14px 16px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .popup-item:last-child {
            border-bottom: none;
        }

        .popup-item:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .popup-item.playing {
            background: var(--accent-color);
            color: #e0e0e0;
            font-weight: bold;
        }

        /* --- グリッド（放送局ボタン） --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        .station-btn {
            background: var(--card-bg);
            border: 2px solid #3a3c40;
            color: var(--off-white);
            padding: 6px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 58px; 
            box-sizing: border-box;
            line-height: 1.25;
            word-break: break-all;
        }

        .station-btn:active, .station-btn.playing {
            background: var(--accent-color);
            color: #e0e0e0;
            transform: scale(0.97);
            border-color: var(--accent-color);
        }

        /* --- コントロールボタン群（四角いデザイン＆配色） --- */
        button.control-btn {
            padding: 10px 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            box-sizing: border-box;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .stop-btn { 
            background-color: var(--stop-bg); 
            color: var(--stop-text);
            border: 2px solid var(--stop-border);
        }

        .stop-btn:active {
            background-color: #36393f;
            transform: scale(0.98);
        }

        @media (max-width: 350px) {
            .grid { grid-template-columns: 1fr; }
            #current-station-btn { font-size: 1rem; }
            .station-btn { height: auto; min-height: 50px; }
            #date-display { font-size: 0.85rem; }
            #time-display { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-panel">
        <!-- 年月日と現在時刻の表示行 -->
        <div class="datetime-row">
            <span id="date-display">----年--月--日(-)</span>
            <span id="time-display">--:--:--</span>
        </div>

        <div class="panel-row top-row">
            <div id="status-label">再生停止中</div>
            <button class="control-btn stop-btn" onclick="stopAudio()">停止 (OFF)</button>
        </div>

        <!-- タップでポップアップリストを開く放送局表示ボタン -->
        <button id="current-station-btn" onclick="openStationPopup()" aria-label="放送局リストを開く">
            <span id="current-station-text">放送局を選択してください</span>
            <span class="dropdown-arrow">▼</span>
        </button>

        <!-- ボリュームスライダー（iOS判定で自動非表示） -->
        <div class="panel-row volume-row">
            <div class="volume-container">
                <span class="volume-icon">🔈</span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1" oninput="changeVolume(this.value)">
                <span class="volume-icon">🔊</span>
            </div>
        </div>

        <div class="panel-row bottom-row">
            <div class="timer-select-wrapper">
                <select id="sleep-timer-select" class="timer-select" onchange="handleTimerChange(this.value)">
                    <option value="0">OFFタイマー</option>
                    <option value="30">30分</option>
                    <option value="60">60分</option>
                    <option value="90">90分</option>
                    <option value="120">120分</option>
                </select>
            </div>
            <div id="timer-display"></div>
        </div>
    </div>

    <div class="grid" id="station-grid"></div>
</div>

<!-- 放送局選択ポップアップリスト -->
<div class="popup-overlay" id="station-popup" onclick="closeStationPopupOnOverlay(event)">
    <div class="popup-content">
        <div class="popup-header">
            <span>放送局一覧</span>
            <button class="popup-close-btn" onclick="closeStationPopup()" aria-label="閉じる">✕</button>
        </div>
        <div class="popup-list" id="popup-station-list"></div>
    </div>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
    const stations = [
        { name: "NHK AM（仙台）", url: "https://simul2.drdi.st.nhk/live/8/joined/master.m3u8" },
        { name: "NHK FM（仙台）", url: "https://simul2.drdi.st.nhk/live/9/joined/master.m3u8" },
        { name: "NHK AM（東京）", url: "https://simul2.drdi.st.nhk/live/3/joined/master.m3u8" },
        { name: "NHK FM（東京）", url: "https://simul2.drdi.st.nhk/live/5/joined/master.m3u8" },
        { name: "smoothjazz.com.pl", url: "https://bcast.vigormultimedia.com:48888/sjcompl192aac" },        
        { name: "101 Smooth Jazz", url: "https://jking.cdnstream1.com/b22139_128mp3" },
        { name: "smooth-jazz-247", url: "https://ais-edge89-dal02.cdnstream.com/2124_128.mp3" },
        { name: "SMOOTH JAZZ DELUXE", url: "https://cast1.torontocast.com:4490/;" },
        { name: "SmoothJazz.com Global Radio", url: "https://smoothjazz.cdnstream1.com/2585_128.mp3" },
        { name: "J-Pop Sakura 懐かしい", url: "https://quincy.torontocast.com:2070/stream.mp3" },
        { name: "J1 GOLD 昭和", url: "https://jenny.torontocast.com:2000/stream/J1GOLD" },
        { name: "Shonan BeachFM", url: "https://shonanbeachfm.out.airtime.pro:8000/shonanbeachfm_a" },
        { name: "Gold Instrumental", url: "https://centova2.svdns.com.br:20038/stream" },
        { name: "Gold web radio", url: "https://centova2.svdns.com.br:20056/stream" },
        { name: "Solo Piano Radio", url: "https://pianosolo.streamguys1.com/live" },
        { name: "NATURE RADIO SLEEP(自然音)", url: "https://az1.mediacp.eu/listen/natureradiosleep/radio.mp3" }
    ];

    const audio = document.getElementById('audio-player');
    const stationGrid = document.getElementById('station-grid');
    const popupStationList = document.getElementById('popup-station-list');
    const stationPopup = document.getElementById('station-popup');
    const currentStationText = document.getElementById('current-station-text');
    const statusLabel = document.getElementById('status-label');
    const timerDisplay = document.getElementById('timer-display');
    const timerSelect = document.getElementById('sleep-timer-select');
    const volumeSlider = document.getElementById('volume-slider');
    const dateDisplay = document.getElementById('date-display');
    const timeDisplay = document.getElementById('time-display');
    
    let hls = null;
    let timerId = null;
    let countdownIntervalId = null;
    let fadeTimerId = null;
    let remainingSeconds = 0;

    // 年月日と現在時刻の更新処理
    function updateDateTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const dayStr = days[now.getDay()];

        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        dateDisplay.innerText = `${year}年${month}月${date}日(${dayStr})`;
        timeDisplay.innerText = `${hours}:${minutes}:${seconds}`;
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);

    // iOS環境（iPhone / iPad / iPod）判定
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isIOS) {
        const volumeRow = document.querySelector('.volume-row');
        if (volumeRow) {
            volumeRow.style.display = 'none';
        }
    }

    // グリッドボタンとポップアップリストの両方を生成
    stations.forEach(station => {
        const btn = document.createElement('button');
        btn.className = 'station-btn';
        btn.innerText = station.name;
        btn.onclick = () => playAudio(station);
        stationGrid.appendChild(btn);

        const listItem = document.createElement('button');
        listItem.className = 'popup-item';
        listItem.innerText = station.name;
        listItem.onclick = () => {
            playAudio(station);
            closeStationPopup();
        };
        popupStationList.appendChild(listItem);
    });

    function openStationPopup() {
        stationPopup.classList.add('open');
    }

    function closeStationPopup() {
        stationPopup.classList.remove('open');
    }

    function closeStationPopupOnOverlay(event) {
        if (event.target === stationPopup) {
            closeStationPopup();
        }
    }

    function updateStatus(text, isActive = false) {
        statusLabel.innerText = text;
        if (isActive) {
            statusLabel.classList.add('active');
        } else {
            statusLabel.classList.remove('active');
        }
    }

    function changeVolume(val) {
        audio.volume = parseFloat(val);
    }

    function playAudio(station) {
        resetAudioSystem();
        currentStationText.innerText = station.name;
        updateStatus("接続中...", true);
        
        document.querySelectorAll('.station-btn, .popup-item').forEach(el => {
            el.classList.toggle('playing', el.innerText === station.name);
        });

        const secureUrl = station.url.replace("http://", "https://");
        const isHls = secureUrl.includes('.m3u8');

        const currentVol = parseFloat(volumeSlider.value);

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(secureUrl);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { audio.volume = currentVol; audio.play(); });
                hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) updateStatus("再生エラー"); });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = secureUrl;
                audio.volume = currentVol;
                audio.play();
            }
        } else {
            audio.src = secureUrl;
            audio.volume = currentVol;
            audio.play().catch(() => { updateStatus("再生エラー"); });
        }

        audio.onplaying = () => { updateStatus("再生中", true); };
        audio.onwaiting = () => { updateStatus("読込中...", true); };
    }

    function resetAudioSystem() {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (hls) {
            hls.stopLoad();
            hls.destroy();
            hls = null;
        }
        updateStatus("再生停止中");
    }

    function stopAudio() {
        resetAudioSystem();
        clearTimers();
        currentStationText.innerText = "放送局を選択してください";
        document.querySelectorAll('.station-btn, .popup-item').forEach(el => el.classList.remove('playing'));
    }

    function clearTimers() {
        clearTimeout(timerId);
        clearTimeout(fadeTimerId);
        clearInterval(countdownIntervalId);
        timerId = null;
        fadeTimerId = null;
        countdownIntervalId = null;
        remainingSeconds = 0;
        timerDisplay.innerText = "";
        timerSelect.value = "0";
        timerSelect.classList.remove('active');
        
        audio.volume = parseFloat(volumeSlider.value);
    }

    function handleTimerChange(minutes) {
        const min = parseInt(minutes, 10);
        if (min === 0) {
            clearTimers();
        } else {
            setTimer(min);
        }
    }

    function setTimer(minutes) {
        clearTimeout(timerId);
        clearTimeout(fadeTimerId);
        clearInterval(countdownIntervalId);
        
        timerSelect.classList.add('active');

        remainingSeconds = minutes * 60;
        updateTimerDisplay();

        countdownIntervalId = setInterval(() => {
            remainingSeconds--;
            if (remainingSeconds <= 0) {
                clearInterval(countdownIntervalId);
                updateTimerDisplay();
            } else {
                updateTimerDisplay();
            }
        }, 1000);

        timerId = setTimeout(() => {
            stopAudio();
        }, remainingSeconds * 1000);

        fadeTimerId = setTimeout(() => {
            fadeOut();
        }, Math.max(0, (remainingSeconds - 10) * 1000));
    }

    function updateTimerDisplay() {
        if (remainingSeconds <= 0) {
            timerDisplay.innerText = "";
            return;
        }
        const m = Math.floor(remainingSeconds / 60);
        const s = remainingSeconds % 60;
        timerDisplay.innerText = `残り ${m}:${s.toString().padStart(2, '0')}`;
    }

    function fadeOut() {
        if (audio.volume > 0.05) {
            audio.volume = Math.max(0, audio.volume - 0.1);
            setTimeout(fadeOut, 1000);
        }
    }
</script>

</body>
</html>
