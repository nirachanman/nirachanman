<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Radio Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #282a2d;
            --accent-color: #013c82; 
            --text-color: #e0e0a4; 
            --off-white: #8e9297;
            --error-color: #cf6679;
            --timer-color: #7da87b; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px; /* スマホ・タブレットで見やすい幅に調整 */
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        /* --- ステータスパネル（スマホ対応強化） --- */
        .status-panel {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 横並びのレイアウトベース */
        .panel-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        /* ステータスと停止ボタンを50%ずつ綺麗に分ける */
        .top-row #status-label,
        .top-row .stop-btn {
            flex: 1;
            min-width: 0; /* 文字溢れ防止 */
            text-align: center;
        }

        #status-label {
            padding: 12px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 2px solid var(--error-color);
            background-color: transparent;
            color: var(--error-color);
            cursor: default;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        #status-label.active {
            border-color: var(--timer-color);
            color: var(--timer-color);
        }

        #current-station {
            font-size: 1.3rem; /* スマホ用に少しだけコンパクトに */
            font-weight: bold;
            margin: 5px 0;
            width: 100%;
            word-break: break-all; /* 長い名前の局でも折り返す */
        }

        /* 下段：タイマーと残り時間 */
        .bottom-row {
            justify-content: space-between; /* 両端に配置 */
            border-top: 1px solid #3a3c40;
            padding-top: 12px;
        }

        /* タイマーボタンを2×2のコンパクトなグリッドに */
        .timer-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            flex: 1;
            max-width: 180px; /* 大きくなりすぎないよう制限 */
        }

        #timer-display {
            font-size: 1.1rem;
            color: var(--timer-color);
            font-weight: bold;
            text-align: right;
            flex: 1;
            padding-left: 10px;
        }

        /* --- グリッド（放送局ボタン） --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* スマホは基本2列 */
            gap: 10px;
            width: 100%;
        }

        .station-btn {
            background: var(--card-bg);
            border: 2px solid #3a3c40;
            color: var(--off-white);
            padding: 15px 8px;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px; /* スマホで押しやすく、かつ高すぎない絶妙なサイズ */
            box-sizing: border-box;
        }

        .station-btn:active, .station-btn.playing {
            background: var(--accent-color);
            color: #e0e0e0;
            transform: scale(0.96);
            border-color: var(--accent-color);
        }

        /* --- コントロールボタン群 --- */
        button.control-btn {
            padding: 12px 10px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .stop-btn { 
            background-color: var(--error-color); 
            color: #1a1c1e;
            border: 2px solid var(--error-color);
        }
        
        .timer-btn { 
            background-color: #3a3c40; 
            color: #bbb; 
            padding: 6px 10px;
            border-radius: 8px; /* タイマーは四角形に近い角丸でコンパクトに */
            font-size: 0.85rem;
        }
        .timer-btn.active { background-color: var(--timer-color); color: #1a1c1e; }

        /* 超小型スマホ（画面幅350px以下）用微調整 */
        @media (max-width: 350px) {
            .grid { grid-template-columns: 1fr; } /* 1列にする */
            #current-station { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-panel">
        <div class="panel-row top-row">
            <div id="status-label">再生停止中</div>
            <button class="control-btn stop-btn" onclick="stopAudio()">停止 (OFF)</button>
        </div>

        <div id="current-station">- 放送局を選択してください -</div>

        <div class="panel-row bottom-row">
            <div class="timer-group">
                <button id="timer-30" class="control-btn timer-btn" onclick="setTimer(30)">30分</button>
                <button id="timer-60" class="control-btn timer-btn" onclick="setTimer(60)">60分</button>
                <button id="timer-90" class="control-btn timer-btn" onclick="setTimer(90)">90分</button>
                <button id="timer-120" class="control-btn timer-btn" onclick="setTimer(120)">120分</button>
            </div>
            <div id="timer-display"></div>
        </div>
    </div>

    <div class="grid" id="station-grid"></div>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
    const stations = [
        { name: "NHK AM（仙台）", url: "https://simul.drdi.st.nhk/live/8/joined/master.m3u8" },
        { name: "NHK AM（東京）", url: "https://simul.drdi.st.nhk/live/3/joined/master.m3u8" },
        { name: "NHK FM（東京）", url: "https://simul.drdi.st.nhk/live/9/joined/master.m3u8" },
        { name: "smoothjazz.com.pl", url: "https://bcast.vigormultimedia.com:48888/sjcompl192aac" },        
        { name: "101 Smooth Jazz", url: "https://jking.cdnstream1.com/b22139_128mp3" },
        { name: "smooth-jazz-247", url: "https://ais-edge89-dal02.cdnstream.com/2124_128.mp3" },
        { name: "SMOOTH JAZZ DELUXE", url: "https://cast1.torontocast.com:4490/;" },
        { name: "SmoothJazz.com Global Radio", url: "https://smoothjazz.cdnstream1.com/2585_128.mp3" },
        { name: "J-Pop Sakura 懐かしい", url: "https://quincy.torontocast.com:2070/stream.mp3" },
        { name: "J1 GOLD 昭和", url: "https://jenny.torontocast.com:2000/stream/J1GOLD" },
        { name: "Shonan BeachFM", url: "https://shonanbeachfm.out.airtime.pro:8000/shonanbeachfm_a" },
        { name: "Gold Instrumental", url: "https://centova.svdns.com.br:19373/stream.mp3" },
        { name: "Gold web radio", url: "https://centova.svdns.com.br:19418/stream" },
        { name: "Solo Piano (ソロピアノ)", url: "https://streams.calmradio.com/api/161/128/stream" },
        { name: "NATURE RADIO SLEEP(自然音)", url: "https://az1.mediacp.eu/listen/natureradiosleep/radio.mp3" }
    ];

    const audio = document.getElementById('audio-player');
    const stationGrid = document.getElementById('station-grid');
    const currentStationLabel = document.getElementById('current-station');
    const statusLabel = document.getElementById('status-label');
    const timerDisplay = document.getElementById('timer-display');
    
    let hls = null;
    let timerId = null;
    let countdownIntervalId = null;
    let fadeTimerId = null;
    let remainingSeconds = 0;

    stations.forEach(station => {
        const btn = document.createElement('button');
        btn.className = 'station-btn';
        btn.innerText = station.name;
        btn.onclick = () => playAudio(station);
        stationGrid.appendChild(btn);
    });

    function updateStatus(text, isActive = false) {
        statusLabel.innerText = text;
        if (isActive) {
            statusLabel.classList.add('active');
        } else {
            statusLabel.classList.remove('active');
        }
    }

    function playAudio(station) {
        resetAudioSystem();
        currentStationLabel.innerText = station.name;
        updateStatus("接続中...", true);
        
        document.querySelectorAll('.station-btn').forEach(b => {
            b.classList.toggle('playing', b.innerText === station.name);
        });

        const secureUrl = station.url.replace("http://", "https://");
        const isHls = secureUrl.includes('.m3u8');

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(secureUrl);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { audio.volume = 1.0; audio.play(); });
                hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) updateStatus("再生エラー"); });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = secureUrl;
                audio.play();
            }
        } else {
            audio.src = secureUrl;
            audio.volume = 1.0;
            audio.play().catch(() => { updateStatus("再生エラー"); });
        }

        audio.onplaying = () => { updateStatus("再生中", true); };
        audio.onwaiting = () => { updateStatus("読込中...", true); };
    }

    function resetAudioSystem() {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (hls) {
            hls.stopLoad();
            hls.destroy();
            hls = null;
        }
        updateStatus("再生停止中");
    }

    function stopAudio() {
        resetAudioSystem();
        clearTimers();
        currentStationLabel.innerText = "- 放送局を選択してください -";
        document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('playing'));
    }

    function clearTimers() {
        clearTimeout(timerId);
        clearTimeout(fadeTimerId);
        clearInterval(countdownIntervalId);
        timerId = null;
        fadeTimerId = null;
        countdownIntervalId = null;
        remainingSeconds = 0;
        timerDisplay.innerText = "";
        document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('active'));
    }

    function setTimer(minutes) {
        clearTimers();
        const btn = document.getElementById(`timer-${minutes}`);
        if(btn) btn.classList.add('active');

        remainingSeconds = minutes * 60;
        updateTimerDisplay();

        countdownIntervalId = setInterval(() => {
            remainingSeconds--;
            if (remainingSeconds <= 0) {
                clearInterval(countdownIntervalId);
                updateTimerDisplay();
            } else {
                updateTimerDisplay();
            }
        }, 1000);

        timerId = setTimeout(() => {
            stopAudio();
        }, remainingSeconds * 1000);

        fadeTimerId = setTimeout(() => {
            fadeOut();
        }, Math.max(0, (remainingSeconds - 10) * 1000));
    }

    function updateTimerDisplay() {
        if (remainingSeconds <= 0) {
            timerDisplay.innerText = "";
            return;
        }
        const m = Math.floor(remainingSeconds / 60);
        const s = remainingSeconds % 60;
        timerDisplay.innerText = `残り ${m}:${s.toString().padStart(2, '0')}`;
    }

    function fadeOut() {
        if (audio.volume > 0.05) {
            audio.volume = Math.max(0, audio.volume - 0.1);
            setTimeout(fadeOut, 1000);
        }
    }
</script>

</body>
</html>
