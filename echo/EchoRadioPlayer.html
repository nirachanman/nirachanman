<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Radio Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #282a2d;
            --accent-color: #013c82; 
            --text-color: #e0e0a4; 
            --off-white: #8e9297;
            --error-color: #cf6679;
            --timer-color: #7da87b; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 120px; /* 下部固定パネルと被らないように余白を確保 */
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 12px;
            box-sizing: border-box;
            text-align: center;
        }

        /* --- ポップアップ（フローティング）ステータスパネル --- */
        .status-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-top: 3px solid var(--accent-color);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
        }

        /* 常に表示される簡易ヘッダーバー */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        #status-label {
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.75rem;
            border: 1.5px solid var(--error-color);
            background-color: transparent;
            color: var(--error-color);
            cursor: default;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        #status-label.active {
            border-color: var(--timer-color);
            color: var(--timer-color);
        }

        #current-station {
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            flex: 1;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--off-white);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
            margin-left: 8px;
            transition: transform 0.3s ease;
        }

        /* 開閉スライド領域 */
        .panel-body {
            max-height: 0;
            opacity: 0;
            padding: 0 16px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* パネル展開時の表示スタイル */
        .status-panel.open .panel-body {
            max-height: 200px;
            opacity: 1;
            padding: 12px 16px 16px 16px;
        }

        .status-panel.open .toggle-btn {
            transform: rotate(180deg);
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        /* ボリュームコントロール領域 */
        .volume-row {
            padding: 0;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 30px;
            box-sizing: border-box;
        }

        .volume-icon {
            font-size: 0.9rem;
            color: var(--off-white);
            user-select: none;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #444;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--timer-color);
        }

        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: var(--timer-color);
        }

        .bottom-row {
            border-top: 1px solid #3a3c40;
            padding-top: 10px;
        }

        .timer-select-wrapper {
            flex: 1;
            max-width: 140px;
            text-align: left;
        }

        .timer-select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            background-color: #3a3c40;
            color: #bbb;
            border: 1px solid #555;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            box-sizing: border-box;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23bbb' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 24px;
        }

        .timer-select.active {
            border-color: var(--timer-color);
            color: var(--timer-color);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%237da87b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
        }

        #timer-display {
            font-size: 1rem;
            color: var(--timer-color);
            font-weight: bold;
            text-align: right;
            flex: 1;
        }

        /* --- コントロールボタン群 --- */
        button.control-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .stop-btn { 
            background-color: var(--error-color); 
            color: #1a1c1e;
            border: 2px solid var(--error-color);
        }

        /* --- グリッド（放送局ボタン） --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .station-btn {
            background: var(--card-bg);
            border: 2px solid #3a3c40;
            color: var(--off-white);
            padding: 6px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 58px; 
            box-sizing: border-box;
            line-height: 1.25;
            word-break: break-all;
        }

        .station-btn:active, .station-btn.playing {
            background: var(--accent-color);
            color: #e0e0e0;
            transform: scale(0.97);
            border-color: var(--accent-color);
        }

        @media (max-width: 350px) {
            .grid { grid-template-columns: 1fr; }
            .station-btn { height: auto; min-height: 50px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="grid" id="station-grid"></div>
</div>

<!-- ポップアッププレイヤー領域 -->
<div class="status-panel" id="status-panel">
    <!-- 常時表示ヘッダー -->
    <div class="panel-header" onclick="togglePanel()">
        <div class="header-info">
            <div id="status-label">再生停止中</div>
            <div id="current-station">放送局を選択してください</div>
        </div>
        <button class="toggle-btn" id="toggle-btn" aria-label="パネル開閉">▲</button>
    </div>

    <!-- スライド展開領域 -->
    <div class="panel-body">
        <div class="panel-row">
            <button class="control-btn stop-btn" onclick="stopAudio()">停止 (OFF)</button>
        </div>

        <!-- ボリュームスライダー（iOS判定で自動非表示） -->
        <div class="panel-row volume-row">
            <div class="volume-container">
                <span class="volume-icon">🔈</span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1" oninput="changeVolume(this.value)">
                <span class="volume-icon">🔊</span>
            </div>
        </div>

        <div class="panel-row bottom-row">
            <div class="timer-select-wrapper">
                <select id="sleep-timer-select" class="timer-select" onchange="handleTimerChange(this.value)">
                    <option value="0">OFFタイマー</option>
                    <option value="30">30分</option>
                    <option value="60">60分</option>
                    <option value="90">90分</option>
                    <option value="120">120分</option>
                </select>
            </div>
            <div id="timer-display"></div>
        </div>
    </div>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
    const stations = [
        { name: "NHK AM（仙台）", url: "https://simul2.drdi.st.nhk/live/8/joined/master.m3u8" },
        { name: "NHK FM（仙台）", url: "https://simul2.drdi.st.nhk/live/9/joined/master.m3u8" },
        { name: "NHK AM（東京）", url: "https://simul2.drdi.st.nhk/live/3/joined/master.m3u8" },
        { name: "NHK FM（東京）", url: "https://simul2.drdi.st.nhk/live/5/joined/master.m3u8" },
        { name: "smoothjazz.com.pl", url: "https://bcast.vigormultimedia.com:48888/sjcompl192aac" },        
        { name: "101 Smooth Jazz", url: "https://jking.cdnstream1.com/b22139_128mp3" },
        { name: "smooth-jazz-247", url: "https://ais-edge89-dal02.cdnstream.com/2124_128.mp3" },
        { name: "SMOOTH JAZZ DELUXE", url: "https://cast1.torontocast.com:4490/;" },
        { name: "SmoothJazz.com Global Radio", url: "https://smoothjazz.cdnstream1.com/2585_128.mp3" },
        { name: "J-Pop Sakura 懐かしい", url: "https://quincy.torontocast.com:2070/stream.mp3" },
        { name: "J1 GOLD 昭和", url: "https://jenny.torontocast.com:2000/stream/J1GOLD" },
        { name: "Shonan BeachFM", url: "https://shonanbeachfm.out.airtime.pro:8000/shonanbeachfm_a" },
        { name: "Gold Instrumental", url: "https://centova.svdns.com.br:19373/stream.mp3" },
        { name: "Gold web radio", url: "https://centova.svdns.com.br:19418/stream" },
        { name: "Solo Piano (ソロピアノ)", url: "https://streams.calmradio.com/api/161/128/stream" },
        { name: "NATURE RADIO SLEEP(自然音)", url: "https://az1.mediacp.eu/listen/natureradiosleep/radio.mp3" }
    ];

    const audio = document.getElementById('audio-player');
    const stationGrid = document.getElementById('station-grid');
    const currentStationLabel = document.getElementById('current-station');
    const statusLabel = document.getElementById('status-label');
    const timerDisplay = document.getElementById('timer-display');
    const timerSelect = document.getElementById('sleep-timer-select');
    const volumeSlider = document.getElementById('volume-slider');
    const statusPanel = document.getElementById('status-panel');
    
    let hls = null;
    let timerId = null;
    let countdownIntervalId = null;
    let fadeTimerId = null;
    let remainingSeconds = 0;

    // パネル開閉トグル
    function togglePanel() {
        statusPanel.classList.toggle('open');
    }

    // iOS環境（iPhone / iPad / iPod）判定
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isIOS) {
        const volumeRow = document.querySelector('.volume-row');
        if (volumeRow) {
            volumeRow.style.display = 'none';
        }
    }

    stations.forEach(station => {
        const btn = document.createElement('button');
        btn.className = 'station-btn';
        btn.innerText = station.name;
        btn.onclick = () => playAudio(station);
        stationGrid.appendChild(btn);
    });

    function updateStatus(text, isActive = false) {
        statusLabel.innerText = text;
        if (isActive) {
            statusLabel.classList.add('active');
        } else {
            statusLabel.classList.remove('active');
        }
    }

    function changeVolume(val) {
        audio.volume = parseFloat(val);
    }

    function playAudio(station) {
        resetAudioSystem();
        currentStationLabel.innerText = station.name;
        updateStatus("接続中...", true);
        
        // 再生時はパネルを自動で開く
        statusPanel.classList.add('open');

        document.querySelectorAll('.station-btn').forEach(b => {
            b.classList.toggle('playing', b.innerText === station.name);
        });

        const secureUrl = station.url.replace("http://", "https://");
        const isHls = secureUrl.includes('.m3u8');

        const currentVol = parseFloat(volumeSlider.value);

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(secureUrl);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { audio.volume = currentVol; audio.play(); });
                hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) updateStatus("再生エラー"); });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = secureUrl;
                audio.volume = currentVol;
                audio.play();
            }
        } else {
            audio.src = secureUrl;
            audio.volume = currentVol;
            audio.play().catch(() => { updateStatus("再生エラー"); });
        }

        audio.onplaying = () => { updateStatus("再生中", true); };
        audio.onwaiting = () => { updateStatus("読込中...", true); };
    }

    function resetAudioSystem() {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (hls) {
            hls.stopLoad();
            hls.destroy();
            hls = null;
        }
        updateStatus("再生停止中");
    }

    function stopAudio() {
        resetAudioSystem();
        clearTimers();
        currentStationLabel.innerText = "放送局を選択してください";
        document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('playing'));
    }

    function clearTimers() {
        clearTimeout(timerId);
        clearTimeout(fadeTimerId);
        clearInterval(countdownIntervalId);
        timerId = null;
        fadeTimerId = null;
        countdownIntervalId = null;
        remainingSeconds = 0;
        timerDisplay.innerText = "";
        timerSelect.value = "0";
        timerSelect.classList.remove('active');
        
        audio.volume = parseFloat(volumeSlider.value);
    }

    function handleTimerChange(minutes) {
        const min = parseInt(minutes, 10);
        if (min === 0) {
            clearTimers();
        } else {
            setTimer(min);
        }
    }

    function setTimer(minutes) {
        clearTimeout(timerId);
        clearTimeout(fadeTimerId);
        clearInterval(countdownIntervalId);
        
        timerSelect.classList.add('active');

        remainingSeconds = minutes * 60;
        updateTimerDisplay();

        countdownIntervalId = setInterval(() => {
            remainingSeconds--;
            if (remainingSeconds <= 0) {
                clearInterval(countdownIntervalId);
                updateTimerDisplay();
            } else {
                updateTimerDisplay();
            }
        }, 1000);

        timerId = setTimeout(() => {
            stopAudio();
        }, remainingSeconds * 1000);

        fadeTimerId = setTimeout(() => {
            fadeOut();
        }, Math.max(0, (remainingSeconds - 10) * 1000));
    }

    function updateTimerDisplay() {
        if (remainingSeconds <= 0) {
            timerDisplay.innerText = "";
            return;
        }
        const m = Math.floor(remainingSeconds / 60);
        const s = remainingSeconds % 60;
        timerDisplay.innerText = `残り ${m}:${s.toString().padStart(2, '0')}`;
    }

    function fadeOut() {
        if (audio.volume > 0.05) {
            audio.volume = Math.max(0, audio.volume - 0.1);
            setTimeout(fadeOut, 1000);
        }
    }
</script>

</body>
</html>
