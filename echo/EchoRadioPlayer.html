<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Radio Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>

:root {
            --bg-color: #1a1c1e;
            --card-bg: #282a2d;
            --accent-color: #013c82; 
            
            /* 基本の文字色（ステータス表示など） */
            --text-color: #e0e0a4; 
            
            /* 【更新】ボタン内の文字色をさらに暗く (オフグレー) */
            --off-white: #8e9297;
            
            --error-color: #cf6679;
            --timer-color: #7da87b; 
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .status-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--accent-color);
        }

        #current-station {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        #timer-display {
            font-size: 1.2rem;
            color: var(--timer-color);
            font-weight: bold;
            margin-top: 5px;
            height: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
        }

.station-btn {
            background: var(--card-bg);
            border: 2px solid #3a3c40;
            /* 文字色をオフホワイトに変更 */
            color: var(--off-white);
            padding: 20px 10px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 85px;
        }

        .station-btn:active, .station-btn.playing {
            background: var(--accent-color);
            /* 再生中の文字色も、眩しすぎない白に設定 */
            color: #e0e0e0;
            transform: scale(0.95);
            border-color: var(--accent-color);
        }

        .controls {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .timer-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        button.control-btn {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            min-width: 80px;
        }

        .stop-btn { background-color: var(--error-color); color: white; width: 100%; max-width: 250px; }
        .timer-btn { background-color: #555; color: white; }
        .timer-btn.active { background-color: var(--timer-color); }

        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr 1fr; }
            #current-station { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-panel">
        <div id="status-label">再生停止中</div>
        <div id="current-station">- 放送局を選択してください -</div>
        <div id="timer-display"></div>
    </div>

    <div class="grid" id="station-grid"></div>

    <div class="controls">
        <button class="control-btn stop-btn" onclick="stopAudio()">停止 (OFF)</button>
        <div class="timer-group">
            <button id="timer-30" class="control-btn timer-btn" onclick="setTimer(30)">30分</button>
            <button id="timer-60" class="control-btn timer-btn" onclick="setTimer(60)">60分</button>
            <button id="timer-90" class="control-btn timer-btn" onclick="setTimer(90)">90分</button>
            <button id="timer-120" class="control-btn timer-btn" onclick="setTimer(120)">120分</button>
        </div>
    </div>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
    /**
     * 放送局リスト
     * 非表示にしたい局の行の先頭に「//」を付けると、画面から消えます。
     */
    const stations = [
        // NHKは安定しているので残します
        { name: "NHK AM（仙台）", url: "https://simul.drdi.st.nhk/live/8/joined/master.m3u8" },
        { name: "NHK AM（東京）", url: "https://simul.drdi.st.nhk/live/3/joined/master.m3u8" },
        { name: "NHK FM（東京）", url: "https://simul.drdi.st.nhk/live/9/joined/master.m3u8" },

        // HLS系（CORSエラー等で再生できない場合は // でコメントアウトしてください）
        // { name: "ラヂオもりおか", url: "https://mtist.as.smartstream.ne.jp/30017/livestream/chunklist.m3u8" },
        // { name: "カシオペアFM", url: "https://mtist.as.smartstream.ne.jp/30050/livestream/chunklist.m3u8" },
        // { name: "BeFM（八戸）", url: "https://mtist.as.smartstream.ne.jp/30079/livestream/playlist.m3u8" },
        // { name: "鹿角きりたんぽFM", url: "https://mtist.as.smartstream.ne.jp/30089/livestream/playlist.m3u8" },

        // 直接再生可能なストリーム（安定しています）
        { name: "smoothjazz.com.pl", url: "https://bcast.vigormultimedia.com:48888/sjcompl192aac" },        
        { name: "101 Smooth Jazz", url: "https://jking.cdnstream1.com/b22139_128mp3" },
        { name: "101 Smooth Jazz Mellow Mix", url: "http://streaming.live365.com/b48071_128mp3" },
        { name: "smooth-jazz-247", url: "https://ais-edge89-dal02.cdnstream.com/2124_128.mp3" },
        { name: "SMOOTH JAZZ DELUXE", url: "https://cast1.torontocast.com:4490/;" },
        { name: "SmoothJazz.com Global Radio", url: "https://smoothjazz.cdnstream1.com/2585_128.mp3" },
        { name: "J-Pop Sakura 懐かしい", url: "https://quincy.torontocast.com:2070/stream.mp3" },
        { name: "J1 GOLD 昭和", url: "https://jenny.torontocast.com:2000/stream/J1GOLD" },
        { name: "Shonan BeachFM", url: "https://shonanbeachfm.out.airtime.pro:8000/shonanbeachfm_a" },
        { name: "Gold Instrumental", url: "https://centova.svdns.com.br:19373/stream.mp3" },
        { name: "Gold web radio", url: "https://centova.svdns.com.br:19418/stream" },
        { name: "Calm Radio - Solo Piano", url: "https://streams.calmradio.com/api/161/128/stream" },
        { name: "NATURE RADIO SLEEP(自然音)", url: "https://az1.mediacp.eu/listen/natureradiosleep/radio.mp3" }

    ];

    const audio = document.getElementById('audio-player');
    const stationGrid = document.getElementById('station-grid');
    const currentStationLabel = document.getElementById('current-station');
    const statusLabel = document.getElementById('status-label');
    const timerDisplay = document.getElementById('timer-display');
    
    let hls = null;
    let timerId = null;
    let countdownIntervalId = null;
    let fadeTimerId = null;
    let remainingSeconds = 0;

    // ボタン生成ロジック
    stations.forEach(station => {
        const btn = document.createElement('button');
        btn.className = 'station-btn';
        btn.innerText = station.name;
        btn.onclick = () => playAudio(station);
        stationGrid.appendChild(btn);
    });

    function playAudio(station) {
        resetAudioSystem();
        currentStationLabel.innerText = station.name;
        statusLabel.innerText = "接続中...";
        
        document.querySelectorAll('.station-btn').forEach(b => {
            b.classList.toggle('playing', b.innerText === station.name);
        });

        const secureUrl = station.url.replace("http://", "https://");
        const isHls = secureUrl.includes('.m3u8');

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(secureUrl);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { audio.volume = 1.0; audio.play(); });
                hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) statusLabel.innerText = "再生エラー"; });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = secureUrl;
                audio.play();
            }
        } else {
            audio.src = secureUrl;
            audio.volume = 1.0;
            audio.play().catch(() => { statusLabel.innerText = "再生エラー"; });
        }

        audio.onplaying = () => { statusLabel.innerText = "再生中"; };
        audio.onwaiting = () => { statusLabel.innerText = "読込中..."; };
    }

    function resetAudioSystem() {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (hls) {
            hls.stopLoad();
            hls.destroy();
            hls = null;
        }
        statusLabel.innerText = "停止中";
    }

    function stopAudio() {
        resetAudioSystem();
        clearTimers();
        currentStationLabel.innerText = "- 放送局を選択してください -";
        document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('playing'));
    }

    function clearTimers() {
        clearTimeout(timerId);
        clearTimeout(fadeTimerId);
        clearInterval(countdownIntervalId);
        timerId = null;
        fadeTimerId = null;
        countdownIntervalId = null;
        remainingSeconds = 0;
        timerDisplay.innerText = "";
        document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('active'));
    }

    function setTimer(minutes) {
        clearTimers();
        const btn = document.getElementById(`timer-${minutes}`);
        if(btn) btn.classList.add('active');

        remainingSeconds = minutes * 60;
        updateTimerDisplay();

        countdownIntervalId = setInterval(() => {
            remainingSeconds--;
            if (remainingSeconds <= 0) {
                clearInterval(countdownIntervalId);
                updateTimerDisplay();
            } else {
                updateTimerDisplay();
            }
        }, 1000);

        timerId = setTimeout(() => {
            stopAudio();
        }, remainingSeconds * 1000);

        fadeTimerId = setTimeout(() => {
            fadeOut();
        }, Math.max(0, (remainingSeconds - 10) * 1000));
    }

    function updateTimerDisplay() {
        if (remainingSeconds <= 0) {
            timerDisplay.innerText = "";
            return;
        }
        const m = Math.floor(remainingSeconds / 60);
        const s = remainingSeconds % 60;
        timerDisplay.innerText = `残り ${m}:${s.toString().padStart(2, '0')}`;
    }

    function fadeOut() {
        if (audio.volume > 0.05) {
            audio.volume = Math.max(0, audio.volume - 0.1);
            setTimeout(fadeOut, 1000);
        }
    }
</script>

</body>
</html>
