<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Echo Radio Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #282a2d;
            --panel-bg: #172130;
            --accent-color: #013c82; 
            --text-color: #e0e0a4; 
            --off-white: #8e9297;
            --error-color: #cf6679;
            --timer-color: #7da87b; 
            
            /* 停止ボタン用：背景は透過・枠線と文字色のみ落ち着いた赤系 */
            --stop-bg: transparent;
            --stop-border: #cf6679;
            --stop-text: #cf6679;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 12px;
            box-sizing: border-box;
            text-align: center;
        }

        /* --- ステータスパネル全体を5pxの青い枠で囲む --- */
        .status-panel {
            background: var(--panel-bg);
            padding: 14px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 5px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            
            position: sticky;
            top: 10px; 
            z-index: 100; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55); 
            box-sizing: border-box;
        }

        /* 年月日・現在時刻の表示行 */
        .datetime-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 4px 6px 4px;
            border-bottom: 1px solid #2b3a4f;
            font-variant-numeric: tabular-nums;
        }

        #date-display {
            font-size: 0.95rem;
            color: var(--off-white);
            font-weight: bold;
        }

        #time-display {
            font-size: 1.35rem;
            color: var(--text-color);
            font-weight: bold;
            letter-spacing: 0.04em;
        }

        .panel-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .top-row #status-label,
        .top-row .stop-btn {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        /* ステータス表示（停止ボタンと揃えた四角いデザイン＋右端イコライザー配置用） */
        #status-label {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 26px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 2px solid #465870;
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--off-white);
            cursor: default;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        #status-label.active {
            border-color: var(--timer-color);
            color: var(--timer-color);
        }

        /* ステータス表示右端のイコライザーバー */
        .status-eq-bars {
            display: none;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            pointer-events: none;
        }

        #status-label.active .status-eq-bars {
            display: flex;
        }

        .status-eq-bars span {
            display: block;
            width: 2.5px;
            background-color: var(--timer-color);
            border-radius: 1px;
            animation: eqBounce 0.8s infinite ease-in-out;
        }

        .status-eq-bars span:nth-child(1) {
            height: 5px;
            animation-delay: 0s;
        }

        .status-eq-bars span:nth-child(2) {
            height: 11px;
            animation-delay: 0.2s;
        }

        .status-eq-bars span:nth-child(3) {
            height: 7px;
            animation-delay: 0.4s;
        }

        /* 放送局名表示兼ポップアップトリガーボタン */
        #current-station-btn {
            font-size: 1.15rem;
            font-weight: bold;
            margin: 2px 0;
            width: 100%;
            height: 2.4rem;
            padding: 0 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2b3a4f;
            border-radius: 10px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        #current-station-btn:active {
            background: rgba(0, 0, 0, 0.45);
            border-color: var(--accent-color);
        }

        #current-station-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            text-align: center;
        }

        .dropdown-arrow {
            font-size: 0.8rem;
            color: var(--off-white);
            margin-left: 8px;
        }

        /* --- ピル型メディアコントロールバー（再生/一時停止・時間・シーク・ミュート） --- */
        .media-bar-row {
            padding: 2px 0;
        }

        .media-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: #101722;
            border: 1px solid #2b3a4f;
            padding: 7px 14px;
            border-radius: 999px;
            box-sizing: border-box;
        }

        .media-icon-btn {
            background: transparent;
            border: none;
            color: #d8dadc;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
            flex-shrink: 0;
        }

        .media-icon-btn:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.92);
        }

        .media-icon-btn.muted {
            color: var(--error-color);
        }

        .media-icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            display: block;
        }

        .media-time-text {
            font-size: 0.82rem;
            color: #c8cacd;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            user-select: none;
            flex-shrink: 0;
        }

        .seek-slider {
            flex: 1;
            min-width: 40px;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #36475e;
            outline: none;
            cursor: pointer;
        }

        .seek-slider:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: transform 0.1s, background-color 0.15s;
        }
        .seek-slider:not(:disabled)::-webkit-slider-thumb:active {
            transform: scale(1.25);
            background: var(--timer-color);
        }

        .seek-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            background: #e0e0e0;
            transition: transform 0.1s, background-color 0.15s;
        }
        .seek-slider:not(:disabled)::-moz-range-thumb:active {
            transform: scale(1.25);
            background: var(--timer-color);
        }

        .bottom-row {
            justify-content: space-between;
            border-top: 1px solid #2b3a4f;
            padding-top: 10px;
        }

        .timer-select-wrapper {
            flex: 1;
            max-width: 140px;
            text-align: left;
        }

        .timer-select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            background-color: #212e42;
            color: #bbb;
            border: 1px solid #3c506e;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23bbb' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 24px;
        }

        .timer-select.active {
            border-color: var(--timer-color);
            color: var(--timer-color);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%237da87b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
        }

        #timer-display {
            font-size: 1.05rem;
            color: var(--timer-color);
            font-weight: bold;
            text-align: right;
            flex: 1;
            padding-left: 10px;
        }

        /* --- ポップアップリスト（モーダル） --- */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .popup-overlay.open {
            display: flex;
        }

        .popup-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            max-height: 75vh;
            border-radius: 16px;
            border: 1px solid #3a3c40;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid #3a3c40;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .popup-close-btn {
            background: transparent;
            border: none;
            color: var(--off-white);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }

        .popup-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .popup-item {
            background: transparent;
            border: none;
            border-bottom: 1px solid #333538;
            color: var(--off-white);
            padding: 14px 16px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .popup-item:last-child {
            border-bottom: none;
        }

        .popup-item:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .popup-item.playing {
            background: var(--timer-color);
            color: #1a1c1e;
            font-weight: bold;
        }

        /* --- グリッド（放送局ボタン） --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .station-btn {
            position: relative;
            background: var(--card-bg);
            border: 2px solid #3a3c40;
            color: var(--off-white);
            padding: 6px 22px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 58px; 
            box-sizing: border-box;
            line-height: 1.25;
            word-break: break-all;
        }

        .station-btn:active {
            transform: scale(0.97);
        }

        /* 選択中・再生中カードのハイライト＆パルス発光アニメーション */
        .station-btn.playing {
            background: var(--timer-color);
            color: #1a1c1e;
            font-weight: bold;
            border-color: var(--timer-color);
            animation: cardPulse 2.2s infinite ease-in-out;
        }

        /* 一時停止中は発光アニメーションを停止 */
        .station-btn.playing.paused {
            animation: none;
        }

        @keyframes cardPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(125, 168, 123, 0.5);
            }
            50% {
                box-shadow: 0 0 12px 2px rgba(125, 168, 123, 0.65);
            }
        }

        /* --- 再生中カード右端のイコライザー（音波）アニメーション --- */
        .eq-bars {
            display: none;
            position: absolute;
            right: 8px;
            bottom: 8px;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            pointer-events: none;
        }

        .station-btn.playing .eq-bars {
            display: flex;
        }

        .eq-bars span {
            display: block;
            width: 2.5px;
            background-color: #1a1c1e;
            border-radius: 1px;
            animation: eqBounce 0.8s infinite ease-in-out;
        }

        .eq-bars span:nth-child(1) {
            height: 5px;
            animation-delay: 0s;
        }

        .eq-bars span:nth-child(2) {
            height: 11px;
            animation-delay: 0.2s;
        }

        .eq-bars span:nth-child(3) {
            height: 7px;
            animation-delay: 0.4s;
        }

        /* 一時停止中はバーの高さを揃えて動きを止める */
        .station-btn.playing.paused .eq-bars span {
            animation-play-state: paused;
            height: 4px;
        }

        @keyframes eqBounce {
            0%, 100% {
                height: 3px;
            }
            50% {
                height: 12px;
            }
        }

        /* --- コントロールボタン群（枠線と文字色のみ赤系のアウトラインスタイル） --- */
        button.control-btn {
            padding: 10px 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            box-sizing: border-box;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .stop-btn { 
            background-color: rgba(0, 0, 0, 0.2); 
            color: var(--stop-text);
            border: 2px solid var(--stop-border);
        }

        .stop-btn:active {
            background-color: rgba(207, 102, 121, 0.18);
            transform: scale(0.98);
        }

        /* --- Echo Show 8（横画面・Silkメニューバー表示時でも1画面に完全フィット）左右2カラム分割 --- */
        @media (min-width: 768px) {
            body {
                height: 100vh;
                height: 100dvh;
                min-height: 0;
                overflow: hidden;
            }

            .container {
                max-width: 1280px;
                height: 100%;
                min-height: 0;
                padding: 6px 10px;
                display: flex;
                flex-direction: row;
                align-items: stretch;
                gap: 10px;
            }

            /* 左側：ステータスパネル（メニューバー表示時の低い高さでも収まるよう圧縮） */
            .status-panel {
                flex: 0 0 35%;
                min-width: 310px;
                max-width: 400px;
                height: 100%;
                min-height: 0;
                margin-bottom: 0;
                position: static;
                padding: 8px 12px;
                border-width: 4px;
                justify-content: space-between;
                gap: 4px;
            }

            .datetime-row {
                flex-direction: row;
                justify-content: space-between;
                align-items: baseline;
                padding: 0 2px 4px 2px;
            }

            #date-display {
                font-size: 0.88rem;
            }

            #time-display {
                font-size: 1.35rem;
                line-height: 1;
                color: #f2d36b !important;
            }

            #status-label,
            button.control-btn {
                padding: 6px 8px;
                font-size: 0.85rem;
            }

            #current-station-btn {
                height: 2.2rem;
                font-size: 1.05rem;
                padding: 0 10px;
                margin: 0;
            }

            .media-bar {
                padding: 5px 10px;
                gap: 8px;
            }

            .media-icon-btn {
                padding: 2px;
            }

            .media-icon-btn svg {
                width: 16px;
                height: 16px;
            }

            .media-time-text {
                font-size: 0.78rem;
            }

            .bottom-row {
                padding-top: 6px;
            }

            .timer-select {
                padding: 4px 22px 4px 8px;
                font-size: 0.82rem;
            }

            #timer-display {
                font-size: 0.95rem;
            }

            /* 右側：放送局カードエリア（3列×6行にすることでSilkメニューバー表示時でも16局が1画面に収まる） */
            .grid {
                flex: 1;
                min-width: 0;
                min-height: 0;
                height: 100%;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-auto-rows: minmax(36px, 1fr);
                gap: 5px;
                overflow-y: auto;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
                padding-right: 2px;
            }

            /* スクロール発生時の控えめなダークスクロールバー */
            .grid::-webkit-scrollbar {
                width: 5px;
            }
            .grid::-webkit-scrollbar-track {
                background: transparent;
            }
            .grid::-webkit-scrollbar-thumb {
                background: #3a3c40;
                border-radius: 3px;
            }

            .station-btn {
                height: 100%;
                min-height: 36px;
                font-size: 0.84rem;
                padding: 2px 18px;
                line-height: 1.15;
                border-radius: 8px;
            }

            .eq-bars {
                right: 5px;
                bottom: 5px;
                height: 10px;
            }
        }

        @media (max-width: 350px) {
            .grid { grid-template-columns: 1fr; }
            #current-station-btn { font-size: 1rem; }
            .station-btn { height: auto; min-height: 50px; }
            #date-display { font-size: 0.85rem; }
            #time-display { font-size: 1.15rem; }
            .media-bar { padding: 6px 10px; gap: 6px; }
            .media-time-text { font-size: 0.75rem; }
        }
    
        /* ===== 視認性・デスクトップ左右2カラム最適化 ===== */
        :root {
            --text-color: #f0f0d0;
            --off-white: #c1c6cc;
        }

        body {
            font-size: 17px;
            line-height: 1.5;
        }

        .container {
            max-width: 100%;
            padding: 16px;
            gap: 18px;
        }

        .status-panel {
            padding: 18px;
            gap: 14px;
        }

        #date-display { font-size: 1.05rem; }
        #time-display { font-size: 1.65rem; }
        #status-label { font-size: 1rem; padding: 12px 30px; }
        #current-station-btn { font-size: 1.25rem; min-height: 3rem; }
        .media-bar { padding: 10px 14px; gap: 12px; }
        .media-time-text { font-size: 0.95rem; }
        .timer-select { font-size: 1rem; padding-top: 9px; padding-bottom: 9px; }
        #timer-display { font-size: 1.15rem; }
        button.control-btn { font-size: 1rem; padding: 12px 14px; }

        .station-btn {
            font-size: 1.08rem;
            min-height: 76px;
            padding: 12px 28px 12px 14px;
            line-height: 1.4;
            border-radius: 12px;
        }

        .popup-content { max-width: 560px; }
        .popup-header { font-size: 1.1rem; padding: 16px 20px; }
        .popup-item { font-size: 1.08rem; padding: 17px 20px; }

        @media (min-width: 768px) {
            body {
                width: 100%;
                height: 100vh;
                height: 100dvh;
                min-height: 0;
                overflow: hidden;
                align-items: stretch;
            }

            .container {
                width: 100%;
                max-width: 1600px;
                height: 100%;
                min-height: 0;
                margin: 0 auto;
                padding: 18px;
                display: flex;
                flex-direction: row;
                align-items: stretch;
                gap: 20px;
                box-sizing: border-box;
            }

            /* 左側は固定。右側の局カードだけをスクロールさせる */
            .status-panel {
                flex: 0 0 36%;
                min-width: 340px;
                max-width: 470px;
                height: 100%;
                min-height: 0;
                margin: 0;
                position: relative;
                top: auto;
                padding: 20px;
                border-width: 4px;
                justify-content: flex-start;
                gap: 18px;
                overflow-y: auto;
                overscroll-behavior: contain;
                box-sizing: border-box;
            }

            .datetime-row {
                padding: 0 4px 12px;
                align-items: center;
            }

            #date-display { font-size: 1.08rem; }
            #time-display { font-size: 1.8rem; line-height: 1.2; }

            #status-label,
            button.control-btn {
                font-size: 1.02rem;
                padding: 12px 10px;
            }

            #current-station-btn {
                height: auto;
                min-height: 3.2rem;
                font-size: 1.25rem;
                padding: 8px 14px;
                margin: 0;
            }

            .media-bar {
                padding: 10px 12px;
                gap: 10px;
            }

            .media-icon-btn { padding: 6px; }
            .media-icon-btn svg { width: 21px; height: 21px; }
            .media-time-text { font-size: 0.92rem; }

            .seek-slider { height: 6px; }
            .seek-slider::-webkit-slider-thumb { width: 16px; height: 16px; }
            .seek-slider::-moz-range-thumb { width: 16px; height: 16px; }

            .bottom-row { padding-top: 14px; }
            .timer-select { font-size: 1rem; padding: 9px 28px 9px 10px; }
            #timer-display { font-size: 1.15rem; }

            .grid {
                flex: 1 1 0;
                width: 0;
                min-width: 0;
                min-height: 0;
                height: 100%;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-auto-rows: minmax(88px, max-content);
                align-content: start;
                gap: 14px;
                padding: 2px 8px 18px 0;
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior-y: contain;
                -webkit-overflow-scrolling: touch;
                scrollbar-gutter: stable;
            }

            .grid::-webkit-scrollbar { width: 9px; }
            .grid::-webkit-scrollbar-track { background: transparent; }
            .grid::-webkit-scrollbar-thumb {
                background: #59616b;
                border-radius: 8px;
                border: 2px solid var(--bg-color);
            }

            .station-btn {
                width: 100%;
                height: auto;
                min-height: 88px;
                font-size: 1.08rem;
                padding: 14px 30px 14px 14px;
                line-height: 1.4;
                border-radius: 12px;
                word-break: normal;
                overflow-wrap: anywhere;
            }

            .eq-bars { right: 9px; bottom: 9px; height: 13px; }
        }

        @media (max-width: 767px) {
            body { font-size: 16px; }
            .container { padding: 14px; }
            .status-panel { padding: 16px; gap: 12px; }
            .station-btn {
                min-height: 68px;
                height: auto;
                font-size: 1rem;
                padding: 12px 24px 12px 12px;
                line-height: 1.35;
            }
            #status-label { font-size: 0.98rem; }
            #current-station-btn { font-size: 1.12rem; }
            .media-time-text { font-size: 0.88rem; }
            .timer-select { font-size: 0.95rem; }
        }

        @media (max-width: 350px) {
            .grid { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }

            /* 再生状態を知らせるアニメーションは、視認性のため停止しない */
            .station-btn.playing:not(.paused) {
                animation: cardPulse 2.2s infinite ease-in-out !important;
            }

            .station-btn.playing:not(.paused) .eq-bars span,
            #status-label.active .status-eq-bars span {
                animation: eqBounce 0.8s infinite ease-in-out !important;
            }
        }

    
        /* 日付と現在時刻を2段表示にし、左右に振り分ける */
        .datetime-row {
            display: flex;
            flex-direction: column !important;
            align-items: stretch !important;
            justify-content: center;
            gap: 4px;
            padding: 4px 6px 10px;
        }

        #date-display {
            align-self: flex-start;
            text-align: left;
            font-size: 1.3rem !important;
            line-height: 1.35;
        }

        #time-display {
            align-self: flex-end;
            text-align: right;
            font-size: 2rem !important;
            line-height: 1.2;
            letter-spacing: 0.06em;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="status-panel">
        <!-- 年月日と現在時刻の表示行 -->
        <div class="datetime-row">
            <span id="date-display">----年--月--日(-)</span>
            <span id="time-display">--:--:--</span>
        </div>

        <div class="panel-row top-row">
            <div id="status-label">
                <span id="status-text">再生停止中</span>
                <span class="status-eq-bars" aria-hidden="true"><span></span><span></span><span></span></span>
            </div>
            <button class="control-btn stop-btn" onclick="stopAudio()">停止 (OFF)</button>
        </div>

        <!-- タップでポップアップリストを開く放送局表示ボタン -->
        <button id="current-station-btn" onclick="openStationPopup()" aria-label="放送局リストを開く">
            <span id="current-station-text">放送局を選択してください</span>
            <span class="dropdown-arrow">▼</span>
        </button>

        <!-- 再生/一時停止・時間・スライダー・ミュートをまとめたピル型バー -->
        <div class="panel-row media-bar-row">
            <div class="media-bar">
                <!-- 再生・一時停止ボタン -->
                <button id="play-pause-btn" class="media-icon-btn" onclick="togglePlayPause()" aria-label="再生 / 一時停止">
                    <svg id="play-pause-icon" viewBox="0 0 24 24">
                        <polygon points="6,4 20,12 6,20"></polygon>
                    </svg>
                </button>

                <!-- 経過時間 / 全体時間表示 -->
                <span id="media-time-display" class="media-time-text">00:00 / LIVE</span>

                <!-- 再生スライダー -->
                <input type="range" id="seek-slider" class="seek-slider" min="0" max="100" step="0.1" value="0" disabled
                       oninput="onSeekInput(this.value)" onchange="onSeekChange(this.value)">

                <!-- ミュート（消音）ボタン -->
                <button id="mute-btn" class="media-icon-btn" onclick="toggleMute()" aria-label="ミュート切替">
                    <svg id="mute-icon" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="panel-row bottom-row">
            <div class="timer-select-wrapper">
                <select id="sleep-timer-select" class="timer-select" onchange="handleTimerChange(this.value)">
                    <option value="0">OFFタイマー</option>
                    <option value="30">30分</option>
                    <option value="60">60分</option>
                    <option value="90">90分</option>
                    <option value="120">120分</option>
                </select>
            </div>
            <div id="timer-display"></div>
        </div>
    </div>

    <div class="grid" id="station-grid"></div>
</div>

<!-- 放送局選択ポップアップリスト -->
<div class="popup-overlay" id="station-popup" onclick="closeStationPopupOnOverlay(event)">
    <div class="popup-content">
        <div class="popup-header">
            <span>放送局一覧</span>
            <button class="popup-close-btn" onclick="closeStationPopup()" aria-label="閉じる">✕</button>
        </div>
        <div class="popup-list" id="popup-station-list"></div>
    </div>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
    const stations = [
        { name: "NHK AM（仙台）", url: "https://simul2.drdi.st.nhk/live/8/joined/master.m3u8" },
        { name: "NHK FM（仙台）", url: "https://simul2.drdi.st.nhk/live/9/joined/master.m3u8" },
        { name: "NHK AM（東京）", url: "https://simul2.drdi.st.nhk/live/3/joined/master.m3u8" },
        { name: "NHK FM（東京）", url: "https://simul2.drdi.st.nhk/live/5/joined/master.m3u8" },
        { name: "smoothjazz.com.pl", url: "https://bcast.vigormultimedia.com:48888/sjcompl192aac" },        
        { name: "101 Smooth Jazz", url: "https://jking.cdnstream1.com/b22139_128mp3" },
        { name: "smooth-jazz-247", url: "https://ais-edge89-dal02.cdnstream.com/2124_128.mp3" },
        { name: "SMOOTH JAZZ DELUXE", url: "https://cast1.torontocast.com:4490/;" },
        { name: "SmoothJazz.com Global Radio", url: "https://smoothjazz.cdnstream1.com/2585_128.mp3" },
        { name: "J-Pop Sakura 懐かしい", url: "https://quincy.torontocast.com:2070/stream.mp3" },
        { name: "J1 GOLD 昭和", url: "https://jenny.torontocast.com:2000/stream/J1GOLD" },
        { name: "Shonan BeachFM", url: "https://shonanbeachfm.out.airtime.pro:8000/shonanbeachfm_a" },
        { name: "Gold Instrumental", url: "https://centova2.svdns.com.br:20038/stream" },
        { name: "Gold web radio", url: "https://centova2.svdns.com.br:20056/stream" },
        { name: "Solo Piano Radio", url: "https://pianosolo.streamguys1.com/live" },
        { name: "NATURE RADIO SLEEP(自然音)", url: "https://az1.mediacp.eu/listen/natureradiosleep/radio.mp3" }
    ];

    const audio = document.getElementById('audio-player');
    const stationGrid = document.getElementById('station-grid');
    const popupStationList = document.getElementById('popup-station-list');
    const stationPopup = document.getElementById('station-popup');
    const currentStationText = document.getElementById('current-station-text');
    const statusLabel = document.getElementById('status-label');
    const statusText = document.getElementById('status-text');
    const timerDisplay = document.getElementById('timer-display');
    const timerSelect = document.getElementById('sleep-timer-select');
    const seekSlider = document.getElementById('seek-slider');
    const mediaTimeDisplay = document.getElementById('media-time-display');
    const playPauseIcon = document.getElementById('play-pause-icon');
    const muteBtn = document.getElementById('mute-btn');
    const muteIcon = document.getElementById('mute-icon');
    const dateDisplay = document.getElementById('date-display');
    const timeDisplay = document.getElementById('time-display');
    
    let hls = null;
    let timerId = null;
    let countdownIntervalId = null;
    let fadeTimerId = null;
    let remainingSeconds = 0;
    let isSeeking = false;
    let currentStation = null;

    // SVGアイコン定義
    const SVG_PLAY = '<polygon points="6,4 20,12 6,20"></polygon>';
    const SVG_PAUSE = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    const SVG_VOL_ON = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>';
    const SVG_VOL_MUTE = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path>';

    // 年月日と現在時刻の更新処理
    function updateDateTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const dayStr = days[now.getDay()];

        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        dateDisplay.innerText = `${year}年${month}月${date}日(${dayStr})`;
        timeDisplay.innerText = `${hours}:${minutes}:${seconds}`;
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);

    // 再生・一時停止ボタンとカードのアニメーション状態同期
    function updatePlayPauseUI(isPlaying) {
        playPauseIcon.innerHTML = isPlaying ? SVG_PAUSE : SVG_PLAY;
        document.querySelectorAll('.station-btn.playing').forEach(btn => {
            btn.classList.toggle('paused', !isPlaying);
        });
    }

    // 再生 / 一時停止トグル処理
    function togglePlayPause() {
        if (!currentStation) {
            if (stations.length > 0) {
                playAudio(stations[0]);
            }
            return;
        }

        if (audio.paused) {
            audio.play().catch(() => {
                playAudio(currentStation);
            });
        } else {
            audio.pause();
        }
    }

    // ミュート（消音）トグル処理
    function toggleMute() {
        audio.muted = !audio.muted;
        if (audio.muted) {
            muteBtn.classList.add('muted');
            muteIcon.innerHTML = SVG_VOL_MUTE;
        } else {
            muteBtn.classList.remove('muted');
            muteIcon.innerHTML = SVG_VOL_ON;
        }
    }

    // 秒数を MM:SS または HH:MM:SS にフォーマット
    function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return "00:00";
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        if (h > 0) {
            return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // 再生進行に合わせてシークバーと時間表示を更新
    audio.addEventListener('timeupdate', () => {
        if (isSeeking) return;
        const current = audio.currentTime || 0;
        const currentStr = formatTime(current);
        let durationStr = "LIVE";

        if (audio.seekable && audio.seekable.length > 0) {
            const start = audio.seekable.start(0);
            const end = audio.seekable.end(audio.seekable.length - 1);
            if (end > start) {
                seekSlider.disabled = false;
                seekSlider.min = start;
                seekSlider.max = end;
                seekSlider.value = current;
                if (isFinite(audio.duration) && audio.duration > 0) {
                    durationStr = formatTime(audio.duration);
                }
            }
        } else if (isFinite(audio.duration) && audio.duration > 0) {
            seekSlider.disabled = false;
            seekSlider.min = 0;
            seekSlider.max = audio.duration;
            seekSlider.value = current;
            durationStr = formatTime(audio.duration);
        } else {
            seekSlider.disabled = true;
            seekSlider.min = 0;
            seekSlider.max = Math.max(1, current);
            seekSlider.value = current;
        }

        mediaTimeDisplay.innerText = `${currentStr} / ${durationStr}`;
    });

    // スライダー操作中（ドラッグ中）の表示更新
    function onSeekInput(val) {
        isSeeking = true;
        const currentStr = formatTime(parseFloat(val));
        const durationStr = (isFinite(audio.duration) && audio.duration > 0) ? formatTime(audio.duration) : "LIVE";
        mediaTimeDisplay.innerText = `${currentStr} / ${durationStr}`;
    }

    // スライダーを離したときに再生位置を確定
    function onSeekChange(val) {
        const targetTime = parseFloat(val);
        if (isFinite(targetTime)) {
            audio.currentTime = targetTime;
        }
        isSeeking = false;
    }

    // グリッドボタンとポップアップリストの両方を生成
    stations.forEach(station => {
        const btn = document.createElement('button');
        btn.className = 'station-btn';
        btn.dataset.stationName = station.name;

        const nameSpan = document.createElement('span');
        nameSpan.innerText = station.name;
        btn.appendChild(nameSpan);

        // イコライザーアニメーション用バーを追加
        const eq = document.createElement('span');
        eq.className = 'eq-bars';
        eq.setAttribute('aria-hidden', 'true');
        eq.innerHTML = '<span></span><span></span><span></span>';
        btn.appendChild(eq);

        btn.onclick = () => playAudio(station);
        stationGrid.appendChild(btn);

        const listItem = document.createElement('button');
        listItem.className = 'popup-item';
        listItem.dataset.stationName = station.name;
        listItem.innerText = station.name;
        listItem.onclick = () => {
            playAudio(station);
            closeStationPopup();
        };
        popupStationList.appendChild(listItem);
    });

    function openStationPopup() {
        stationPopup.classList.add('open');
    }

    function closeStationPopup() {
        stationPopup.classList.remove('open');
    }

    function closeStationPopupOnOverlay(event) {
        if (event.target === stationPopup) {
            closeStationPopup();
        }
    }

    function updateStatus(text, isActive = false) {
        statusText.innerText = text;
        if (isActive) {
            statusLabel.classList.add('active');
        } else {
            statusLabel.classList.remove('active');
        }
    }

    function playAudio(station) {
        resetAudioSystem();
        currentStation = station;
        currentStationText.innerText = station.name;
        updateStatus("接続中...", true);
        
        document.querySelectorAll('.station-btn, .popup-item').forEach(el => {
            const isMatch = el.dataset.stationName === station.name;
            el.classList.toggle('playing', isMatch);
            el.classList.remove('paused');
        });
        updatePlayPauseUI(true);

        const secureUrl = station.url.replace("http://", "https://");
        const isHls = secureUrl.includes('.m3u8');

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(secureUrl);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { audio.volume = 1.0; audio.play(); });
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        updateStatus("再生エラー");
                        updatePlayPauseUI(false);
                    }
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = secureUrl;
                audio.volume = 1.0;
                audio.play();
            }
        } else {
            audio.src = secureUrl;
            audio.volume = 1.0;
            audio.play().catch(() => {
                updateStatus("再生エラー");
                updatePlayPauseUI(false);
            });
        }
    }

    // audio要素の再生・一時停止・待機イベント連動
    audio.onplaying = () => {
        updateStatus("再生中", true);
        updatePlayPauseUI(true);
    };

    audio.onpause = () => {
        if (currentStation) {
            updateStatus("一時停止中", false);
        }
        updatePlayPauseUI(false);
    };

    audio.onwaiting = () => {
        updateStatus("読込中...", true);
    };

    function resetAudioSystem() {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (hls) {
            hls.stopLoad();
            hls.destroy();
            hls = null;
        }
        // 再生スライダーとアイコンを初期状態にリセット
        isSeeking = false;
        seekSlider.disabled = true;
        seekSlider.min = 0;
        seekSlider.max = 100;
        seekSlider.value = 0;
        mediaTimeDisplay.innerText = "00:00 / LIVE";
        updatePlayPauseUI(false);

        updateStatus("再生停止中");
    }

    function stopAudio() {
        currentStation = null;
        resetAudioSystem();
        clearTimers();
        currentStationText.innerText = "放送局を選択してください";
        document.querySelectorAll('.station-btn, .popup-item').forEach(el => {
            el.classList.remove('playing');
            el.classList.remove('paused');
        });
    }

    function clearTimers() {
        clearTimeout(timerId);
        clearTimeout(fadeTimerId);
        clearInterval(countdownIntervalId);
        timerId = null;
        fadeTimerId = null;
        countdownIntervalId = null;
        remainingSeconds = 0;
        timerDisplay.innerText = "";
        timerSelect.value = "0";
        timerSelect.classList.remove('active');
        
        audio.volume = 1.0;
    }

    function handleTimerChange(minutes) {
        const min = parseInt(minutes, 10);
        if (min === 0) {
            clearTimers();
        } else {
            setTimer(min);
        }
    }

    function setTimer(minutes) {
        clearTimeout(timerId);
        clearTimeout(fadeTimerId);
        clearInterval(countdownIntervalId);
        
        timerSelect.classList.add('active');

        remainingSeconds = minutes * 60;
        updateTimerDisplay();

        countdownIntervalId = setInterval(() => {
            remainingSeconds--;
            if (remainingSeconds <= 0) {
                clearInterval(countdownIntervalId);
                updateTimerDisplay();
            } else {
                updateTimerDisplay();
            }
        }, 1000);

        timerId = setTimeout(() => {
            stopAudio();
        }, remainingSeconds * 1000);

        fadeTimerId = setTimeout(() => {
            fadeOut();
        }, Math.max(0, (remainingSeconds - 10) * 1000));
    }

    function updateTimerDisplay() {
        if (remainingSeconds <= 0) {
            timerDisplay.innerText = "";
            return;
        }
        const m = Math.floor(remainingSeconds / 60);
        const s = remainingSeconds % 60;
        timerDisplay.innerText = `残り ${m}:${s.toString().padStart(2, '0')}`;
    }

    function fadeOut() {
        if (audio.volume > 0.05) {
            audio.volume = Math.max(0, audio.volume - 0.1);
            setTimeout(fadeOut, 1000);
        }
    }
</script>

</body>
</html>
