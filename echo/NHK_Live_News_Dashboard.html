<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NHK Live News Dashboard</title>
<style>
:root{
--bg:#07111d;--bg2:#102840;--card:rgba(28,38,52,.92);--accent:#00bcd4;
}
*{box-sizing:border-box}
body{
margin:0;font-family:system-ui,sans-serif;
background:linear-gradient(135deg,var(--bg),#0d1b2a,var(--bg2),#0b0f14);
color:#fff;display:grid;grid-template-rows:auto 1fr;height:100vh;padding:14px;gap:12px}
header{
background:rgba(22,28,36,.75);backdrop-filter:blur(12px);
border-radius:18px;padding:14px 18px;border:1px solid rgba(255,255,255,.08)}
.top{display:flex;align-items:center;gap:16px}
h1{margin:0;font-size:1.6rem}
.marquee{flex:1;overflow:hidden;white-space:nowrap;background:rgba(255,255,255,.06);
padding:8px 16px;border-radius:999px}
.marquee span{display:inline-block;padding-left:100%;animation:m 80s linear infinite}
@keyframes m{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#news-container{overflow:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
#news-container::-webkit-scrollbar{display:none}
.news-item{text-decoration:none;color:inherit;background:linear-gradient(145deg,rgba(35,45,60,.95),rgba(20,25,35,.95));
border-radius:16px;padding:14px;box-shadow:0 5px 15px rgba(0,0,0,.35);transition:.2s}
.news-item:hover{transform:translateY(-2px)}
.row{display:flex;justify-content:space-between;gap:10px}
.title{font-size:1.2rem;font-weight:700}
.time{background:#263238;border-radius:999px;padding:4px 10px;font-size:.85rem;color:#cfd8dc}
.desc{margin-top:8px;color:#cfd8dc;line-height:1.7}
</style>
</head>
<body>
<header><div class="top"><h1>📰 NHK Live News Dashboard</h1><div class="marquee" id="marquee"><span>読み込み中…</span></div></div></header>
<main id="news-container"></main>
<script>
const RSS_URLS=[0,1,2,3,4,5,6,7].map(i=>`https://news.web.nhk/n-data/conf/na/rss/cat${i}.xml`);
async function updateNews(){
 let all=[]; const ts=Date.now();
 for(const u of RSS_URLS){
  try{
   const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(u+'?t='+ts));
   const xml=new DOMParser().parseFromString(await r.text(),'text/xml');
   for(const item of xml.querySelectorAll('item')){
    all.push({
      title:item.querySelector('title')?.textContent||"",
      link:item.querySelector('link')?.textContent||"#",
      description:item.querySelector('description')?.textContent||"",
      pubDate:new Date(item.querySelector('pubDate')?.textContent||0)
    });
   }
  }catch(e){}
 }
 all.sort((a,b)=>b.pubDate-a.pubDate);
 const uniq=[...new Map(all.map(x=>[x.title,x])).values()];
 document.getElementById('marquee').innerHTML='<span>'+uniq.slice(0,15).map(n=>`【${n.title}】`).join(' ／ ')+'</span>';
 document.getElementById('news-container').innerHTML=uniq.slice(0,50).map(n=>`
 <a class="news-item" href="${n.link}" target="_blank">
 <div class="row"><div class="title">${n.title}</div><div class="time">${n.pubDate.getMonth()+1}/${n.pubDate.getDate()} ${String(n.pubDate.getHours()).padStart(2,'0')}:${String(n.pubDate.getMinutes()).padStart(2,'0')}</div></div>
 <div class="desc">${n.description}</div></a>`).join('');
}
updateNews();
setInterval(updateNews,300000);
</script>
</body></html>
