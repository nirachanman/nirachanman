<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHK Live News Dashboard Pro</title>
<style>
:root{--a:#00bcd4}
*{box-sizing:border-box}
body{margin:0;height:100vh;padding:14px;font-family:system-ui,sans-serif;color:#fff;
background:linear-gradient(135deg,#081018,#0d1b2a,#102840,#0b0f14);
display:grid;grid-template-rows:auto auto 1fr;gap:12px}
header{background:rgba(20,28,40,.7);backdrop-filter:blur(12px);border-radius:18px;padding:16px}
.top{display:flex;gap:16px;align-items:center}
h1{margin:0}
#clock{margin-left:auto;font-weight:bold}
.marquee{background:rgba(255,255,255,.06);padding:8px 16px;border-radius:999px;overflow:hidden;white-space:nowrap}
.marquee span{display:inline-block;padding-left:100%;animation:m 90s linear infinite}
@keyframes m{to{transform:translateX(-100%)}}
#news{overflow:auto;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;scrollbar-width:none}
#news::-webkit-scrollbar{display:none}
.card{display:block;text-decoration:none;color:white;border-radius:18px;padding:16px;
background:linear-gradient(145deg,rgba(35,45,60,.96),rgba(20,25,35,.96));
box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transform:translateY(10px);animation:fade .5s forwards}
@keyframes fade{to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;gap:10px}
.t{font-size:1.25rem;font-weight:700}
.tm{background:#263238;border-radius:99px;padding:4px 10px}
.d{margin-top:10px;line-height:1.7;color:#d0d8dd}
</style>
</head>
<body>
<header>
<div class="top"><h1>📰 NHK Live News Dashboard Pro</h1><div id="clock"></div></div>
</header>
<div class="marquee" id="marquee"><span>Loading...</span></div>
<div id="news"></div>
<script>
const RSS=[0,1,2,3,4,5,6,7].map(i=>`https://news.web.nhk/n-data/conf/na/rss/cat${i}.xml`);
let paused=false,wake=null;
async function lock(){try{if("wakeLock" in navigator)wake=await navigator.wakeLock.request("screen")}catch(e){}}
async function load(){
 let arr=[],ts=Date.now();
 for(const u of RSS){
  try{
   const res=await fetch("https://corsproxy.io/?"+encodeURIComponent(u+"?t="+ts));
   const xml=new DOMParser().parseFromString(await res.text(),"text/xml");
   xml.querySelectorAll("item").forEach(it=>{
    arr.push({
      title:it.querySelector("title")?.textContent||"",
      link:it.querySelector("link")?.textContent||"#",
      desc:it.querySelector("description")?.textContent||"",
      date:new Date(it.querySelector("pubDate")?.textContent||0)
    });
   });
  }catch(e){}
 }
 arr.sort((a,b)=>b.date-a.date);
 arr=[...new Map(arr.map(v=>[v.title,v])).values()];
 marquee.innerHTML="<span>"+arr.slice(0,15).map(x=>`【${x.title}】`).join(" ／ ")+"</span>";
 news.innerHTML=arr.slice(0,50).map(x=>`<a class="card" href="${x.link}" target="_blank">
 <div class="row"><div class="t">${x.title}</div><div class="tm">${x.date.getMonth()+1}/${x.date.getDate()} ${String(x.date.getHours()).padStart(2,"0")}:${String(x.date.getMinutes()).padStart(2,"0")}</div></div>
 <div class="d">${x.desc}</div></a>`).join("");
}
function tick(){
 const d=new Date();
 clock.textContent=d.toLocaleString("ja-JP");
}
const news=document.getElementById("news"),marquee=document.getElementById("marquee"),clock=document.getElementById("clock");
news.addEventListener("pointerdown",()=>paused=true);
news.addEventListener("pointerup",()=>setTimeout(()=>paused=false,5000));
setInterval(()=>{
 if(paused)return;
 news.scrollBy({top:220,behavior:"smooth"});
 if(news.scrollTop+news.clientHeight>=news.scrollHeight-30){
   load().then(()=>news.scrollTop=0);
 }
},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")lock()});
setInterval(tick,1000);tick();load();lock();
</script>
</body></html>
