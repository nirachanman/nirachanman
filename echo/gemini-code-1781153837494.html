<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHK ニュース・ティッカー</title>
    <style>
        :root { --bg-color: #000; --text-color: #fff; --accent-color: #ff4d4d; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; overflow: hidden; height: 100vh; }
        
        /* ヘッダー */
        header { border-bottom: 2px solid var(--accent-color); padding: 10px; display: flex; align-items: center; }
        h1 { font-size: 1.5rem; margin: 0 20px 0 0; white-space: nowrap; color: var(--accent-color); }
        
        /* 全件スクロールエリア */
        .marquee-wrapper { flex-grow: 1; overflow: hidden; position: relative; height: 50px; display: flex; align-items: center; }
        .marquee-content { 
            position: absolute; 
            white-space: nowrap; 
            display: inline-block; 
            animation: ticker 300s linear infinite; /* 速度調整 */
            font-size: 1.5rem;
        }
        @keyframes ticker {
            0% { transform: translate(100%, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body>
    <header>
        <a href="https://news.web.nhk/newsweb/pl/news-nwa-latest-nationwide" target="_blank" rel="noopener noreferrer" class="header-link">
        <h1>NHK ニュース速報</h1>
        </a>
        <div class="marquee-wrapper">
            <div class="marquee-content" id="ticker">ニュースを取得しています...</div>
        </div>
    </header>

    <script>
        const RSS_URLS = [
            'https://news.web.nhk/n-data/conf/na/rss/cat0.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat1.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat2.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat3.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat4.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat5.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat6.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat7.xml'
        ];

        async function updateTicker() {
            let titles = [];
            for (const url of RSS_URLS) {
                try {
                    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    for (let item of xml.getElementsByTagName('item')) {
                        titles.push(" ● " + item.getElementsByTagName('title')[0].textContent);
                    }
                } catch (e) {}
            }
            // 重複削除して連結
            const uniqueTitles = [...new Set(titles)].join("  ");
            document.getElementById('ticker').textContent = uniqueTitles;
        }

        updateTicker();
        setInterval(updateTicker, 60000); // 1分ごとに更新
        setTimeout(() => { location.reload(); }, 300000);
    </script>
</body>
</html>
