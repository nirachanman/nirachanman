<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>防災モニター完成版</title>
<style>
:root{--bg:#0b0f14;--card:#161c24;--accent:#666}
body{margin:0;background:var(--bg);color:#fff;font-family:sans-serif}
header{padding:12px;border-bottom:4px solid var(--accent);position:sticky;top:0;background:#0b0f14}
#status{padding:8px;background:#111}
#offline{display:none;background:#8b0000;padding:10px;font-weight:bold}
#weatherPanel,#alerts,#news{padding:10px}
.card{background:var(--card);padding:10px;margin:8px 0;border-radius:4px}
.alert{background:#3a1010;border-left:6px solid #ff3333}
#eewOverlay{
 display:none;position:fixed;inset:0;z-index:999999;
 background:#a40000;color:#fff;justify-content:center;align-items:center;
 text-align:center;flex-direction:column;animation:flash .6s infinite;
}
#eewTitle{font-size:4rem;font-weight:bold}
#eewScale{font-size:7rem;font-weight:bold;color:#ff0}
#eewEpicenter,#eewTime{font-size:2rem}
@keyframes flash{
 0%,100%{background:#a40000}
 50%{background:#ff0000}
}
.marquee{white-space:nowrap;overflow:hidden}
.marquee span{display:inline-block;padding-left:100%;animation:scroll 45s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
</style>
</head>
<body>

<div id="eewOverlay">
 <div id="eewTitle">🚨 緊急地震速報 🚨</div>
 <div id="eewScale">---</div>
 <div id="eewEpicenter">震源地</div>
 <div id="eewTime"></div>
</div>

<header>
 <h2>防災モニター完成版</h2>
 <div class="marquee"><span id="ticker">防災情報監視中...</span></div>
</header>

<div id="offline">⚠ 通信が切断されています</div>
<div id="status">最終更新: <span id="lastUpdate">-</span></div>

<div id="weatherPanel"></div>
<div id="alerts"></div>
<div id="news"></div>

<script>
let lastEEW="";

function updateTime(){
 document.getElementById("lastUpdate").textContent=new Date().toLocaleString();
}

window.addEventListener("offline",()=>{
 document.getElementById("offline").style.display="block";
});
window.addEventListener("online",()=>{
 document.getElementById("offline").style.display="none";
});

function speak(text){
 try{
  speechSynthesis.cancel();
  for(let i=0;i<3;i++){
   const u=new SpeechSynthesisUtterance(text);
   u.lang="ja-JP";
   speechSynthesis.speak(u);
  }
 }catch(e){}
}

function showEEW(epicenter,scale){
 document.getElementById("eewScale").textContent=scale;
 document.getElementById("eewEpicenter").textContent="震源地: "+epicenter;
 document.getElementById("eewTime").textContent=new Date().toLocaleTimeString();
 document.getElementById("eewOverlay").style.display="flex";
 speak("緊急地震速報。強い揺れに警戒してください。");
 setTimeout(()=>{
   document.getElementById("eewOverlay").style.display="none";
 },180000);
}

async function checkEEW(){
 try{
  const r=await fetch("https://api.p2pquake.net/v2/jma/eeew?limit=1&t="+Date.now());
  const d=await r.json();
  if(!d || !d.length) return;
  const e=d[0];
  if(e.id!==lastEEW && !e.cancelled){
    lastEEW=e.id;
    const epicenter=e.earthquake?.hypocenter?.name || "不明";
    const scale=e.earthquake?.maxScaleString || "不明";
    saveHistory("EEW",epicenter+" "+scale);
    showEEW(epicenter,scale);
  }
 }catch(err){console.log(err)}
}

async function checkWarnings(){
 try{
  const r=await fetch("https://api.p2pquake.net/v2/jma/warning?limit=50&t="+Date.now());
  const d=await r.json();
  let html="";
  let ticker=[];
  d.forEach(rep=>{
    (rep.items||[]).forEach(item=>{
      (item.warnings||[]).forEach(w=>{
        if(w.status==="発表"){
          ticker.push(w.name);
        }
      });
    });
  });
  if(ticker.length){
    html='<div class="card alert">⚠ 発表中: '+[...new Set(ticker)].join(" / ")+'</div>';
    document.documentElement.style.setProperty("--accent","#ff3333");
  }else{
    document.documentElement.style.setProperty("--accent","#666");
  }
  document.getElementById("alerts").innerHTML=html;
  document.getElementById("ticker").textContent=ticker.join(" / ") || "防災情報監視中";
 }catch(e){}
}

async function loadNews(){
 try{
  const url='https://corsproxy.io/?'+encodeURIComponent('https://news.web.nhk/n-data/conf/na/rss/cat0.xml');
  const r=await fetch(url);
  const xml=new DOMParser().parseFromString(await r.text(),'text/xml');
  const items=[...xml.querySelectorAll("item")].slice(0,20);
  document.getElementById("news").innerHTML=items.map(x=>
   '<div class="card"><b>'+
   (x.querySelector("title")?.textContent||"") +
   '</b></div>').join("");
  updateTime();
 }catch(e){}
}

function saveHistory(type,msg){
 let h=JSON.parse(localStorage.getItem("history")||"[]");
 h.unshift({time:new Date().toISOString(),type,msg});
 h=h.slice(0,100);
 localStorage.setItem("history",JSON.stringify(h));
}

function heartbeat(){
 const now=Date.now();
 const last=Number(localStorage.getItem("heartbeat")||now);
 if(now-last>600000) location.reload();
 localStorage.setItem("heartbeat",now);
}

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

loadNews();
checkWarnings();
checkEEW();

setInterval(loadNews,300000);
setInterval(checkWarnings,60000);
setInterval(checkEEW,5000);
setInterval(heartbeat,60000);
</script>
</body>
</html>
