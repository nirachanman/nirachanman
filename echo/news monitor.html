<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHK 新着ニュースモニター</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #ff4d4d;
            --card-bg: #1e1e1e;
            --card-active: #2d2d2d;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .header-link { text-decoration: none; -webkit-tap-highlight-color: transparent; }
        h1 { font-size: 1.5rem; margin: 0; color: #fff; font-weight: bold; }
        #status { font-size: 1.0rem; color: #ccc; white-space: nowrap; padding-left: 10px; }

        /* スクロールエリア */
        .scroll-container {
            display: block;
            background-color: #331a1a;
            border-left: 5px solid var(--accent-color);
            padding: 12px 10px;
            border-radius: 4px;
            overflow: hidden;
            white-space: nowrap;
            text-decoration: none;
            color: #fff;
            margin-bottom: 12px;
        }
        .scroll-text {
            display: inline-block;
            padding-left: 100%;
            animation: scroll-left 20s linear infinite;
            font-size: 1.3rem;
            font-weight: bold;
        }
        @keyframes scroll-left {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        #news-container { display: flex; flex-direction: column; gap: 8px; }
        .news-item {
            display: block; text-decoration: none; color: inherit;
            background-color: var(--card-bg); border-left: 5px solid #555;
            padding: 10px 12px; border-radius: 4px;
            transition: background-color 0.1s;
        }
        .news-item:active { background-color: var(--card-active); }
        .news-title { font-size: 1.2rem; font-weight: bold; line-height: 1.3; margin-bottom: 4px; }
        .news-time { font-size: 1.0rem; color: #bbb; text-align: right; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="https://news.web.nhk/newsweb/pl/news-nwa-latest-nationwide" target="_blank" rel="noopener noreferrer" class="header-link">
            <h1>NHK 全国新着ニュース</h1>
        </a>
        <div id="status">接続中...</div>
    </header>

    <main id="news-container">
        <p style="text-align:center; color:#888;">取得中...</p>
    </main>

    <script>
        const RSS_URL = 'https://news.web.nhk/n-data/conf/na/rss/cat0.xml';
        const PROXY_URL = 'https://corsproxy.io/?' + encodeURIComponent(RSS_URL);
        const INTERVAL = 60000; 

        async function fetchNews() {
            const statusEl = document.getElementById('status');
            const container = document.getElementById('news-container');
            
            try {
                const response = await fetch(PROXY_URL);
                const text = await response.text();
                const items = new DOMParser().parseFromString(text, 'text/xml').getElementsByTagName('item');
                
                // 1. 最新ニュースのスクロール枠作成
                const latest = items[0];
                let htmlContent = `
                    <a href="${latest.getElementsByTagName('link')[0].textContent}" target="_blank" class="scroll-container">
                        <div class="scroll-text">【最新速報】${latest.getElementsByTagName('title')[0].textContent}</div>
                    </a>
                `;

                // 2. その他のニュース一覧（11件）
                for (let i = 1; i < Math.min(items.length, 12); i++) {
                    const title = items[i].getElementsByTagName('title')[0].textContent;
                    const link = items[i].getElementsByTagName('link')[0].textContent;
                    const pubDate = new Date(items[i].getElementsByTagName('pubDate')[0].textContent);
                    const timeStr = `${pubDate.getMonth()+1}/${pubDate.getDate()} ${String(pubDate.getHours()).padStart(2,'0')}:${String(pubDate.getMinutes()).padStart(2,'0')}`;

                    htmlContent += `
                        <a href="${link}" target="_blank" class="news-item">
                            <div class="news-title">${title}</div>
                            <div class="news-time">${timeStr}</div>
                        </a>
                    `;
                }
                container.innerHTML = htmlContent;
                statusEl.textContent = `${new Date().getHours().toString().padStart(2,'0')}:${new Date().getMinutes().toString().padStart(2,'0')} 更新`;
            } catch (e) { statusEl.textContent = 'エラー'; }
        }

        fetchNews();
        setInterval(fetchNews, INTERVAL);
        setTimeout(() => { location.reload(); }, 300000);
    </script>
</body>
</html>
