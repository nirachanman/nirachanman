<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NHK ニュースモニター（緊急地震速報・リロード版）</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        :root { 
            --bg-color: #0b0f14;        
            --accent-color: #696969;    
            --card-bg: #161c24;         
            
            --text-gray-title: #90caf9; 
            --text-gray-desc: #b0bec5;  
            
            --text-mint-title: #90caf9; 
            --text-mint-desc: #b0bec5;  
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        body {
            display: grid;
            grid-template-rows: auto 1fr; 
            padding: 10px;
            position: relative;
        }
        
        header { 
            border-bottom: 2px solid var(--accent-color); 
            padding-bottom: 8px; 
            margin-bottom: 10px;
            background-color: var(--bg-color);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .header-top { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .header-link { text-decoration: none; display: flex; align-items: center; flex-shrink: 0; }
        h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; color: #ffffff; }
        
        .marquee-container { 
            flex-grow: 1; 
            height: 1.5rem;      
            overflow: hidden; 
            white-space: nowrap; 
            position: relative;  
        }
        
        .marquee-text { 
            position: absolute;
            left: 0;
            top: 0;
            display: inline-block; 
            padding-left: 100%;                  
            animation: scroll-x 120s linear infinite; 
            font-size: 1.1rem; 
            color: #ffffff; 
        }
        @keyframes scroll-x { 
            0% { transform: translate(0, 0); } 
            100% { transform: translate(-100%, 0); } 
        }

        #news-container { 
            overflow-y: auto;          
            scroll-behavior: smooth; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            width: 100%;
            max-width: 100%;
            height: 100%; 
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch; 
        }
        
        #news-container::-webkit-scrollbar {
            display: none;
        }
        
        .news-item { 
            display: flex; 
            flex-direction: column; 
            text-decoration: none; 
            background-color: var(--card-bg); 
            padding: 12px; 
            border-radius: 4px; 
            border: 1px solid #2f4f4f;     
            border-left: 4px solid #2f4f4f; 
            gap: 8px;
            flex-shrink: 0; 
            box-sizing: border-box;         
            width: 100%; 
        }
        
        .news-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        
        .news-title { 
            font-size: 1.3rem; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            font-weight: 400; 
        }
        
        .news-time { 
            font-size: 1.1rem; 
            color: #607d8b; 
            white-space: nowrap;
            flex-shrink: 0;
        }

        .news-desc {
            font-size: 1.1rem;
            line-height: 1.5;
            white-space: normal;       
            word-wrap: break-word;     
            text-overflow: clip;       
            overflow: visible;         
        }

        .news-item:nth-child(odd) .news-title { color: var(--text-gray-title); }
        .news-item:nth-child(odd) .news-desc { color: var(--text-gray-desc); }

        .news-item:nth-child(even) .news-title { color: var(--text-mint-title); }
        .news-item:nth-child(even) .news-desc { color: var(--text-mint-desc); }

        /* 🚨 緊急地震速報（EEW）画面最前面ポップアップCSS */
        #eew-alert-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(186, 12, 47, 0.98); 
            z-index: 99999;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            box-sizing: border-box;
            padding: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .eew-flash {
            animation: blink 1s ease infinite;
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #fffb00; 
        }
        .eew-box {
            background-color: #000000;
            border: 4px solid #fffb00;
            border-radius: 12px;
            padding: 30px 60px;
            display: inline-block;
            max-width: 80%;
        }
        .eew-shindo {
            font-size: 5rem;
            font-weight: 900;
            color: #ff3333;
            margin: 15px 0;
        }
        .eew-info {
            font-size: 2rem;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div id="eew-alert-overlay">
        <div class="eew-flash">🚨 緊急地震速報 (EEW) 🚨</div>
        <div class="eew-box">
            <div id="eew-epicenter" class="eew-info" style="font-weight: bold; font-size: 2.5rem;">震源地: 解析中...</div>
            <div id="eew-max-shindo" class="eew-shindo">最大震度 --</div>
            <div id="eew-detail" class="eew-info">強い揺れに警戒してください。</div>
        </div>
    </div>

    <header>
        <div class="header-top">
            <a href="https://news.web.nhk/newsweb/pl/news-nwa-latest-nationwide" target="_blank" rel="noopener noreferrer" class="header-link">
                <h1>NHK 全国新着ニュース</h1>
            </a>
            <div class="marquee-container" id="marquee"></div>
        </div>
    </header>
    <main id="news-container"></main>

    <script>
        const RSS_URLS = [
            'https://news.web.nhk/n-data/conf/na/rss/cat0.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat1.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat2.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat3.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat4.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat5.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat6.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat7.xml'
        ];

        let isPaused = false;
        let wakeLock = null;
        let resumeTimeout = null;
        let currentItemIndex = 0; 
        let lastEewId = ""; // EEW重複検知防止用

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 🚨 リアルタイム緊急地震速報（EEW）監視関数（5秒おきに独立して動作）
        async function checkEmergencyEarthquakeAlert() {
            try {
                const response = await fetch('https://api.p2pquake.net/v2/jma/eeew?limit=1&t=' + Date.now());
                const data = await response.json();
                
                if (!data || data.length === 0) return;
                
                const alert = data[0];
                
                // 新しいIDであり、かつキャンセル報ではない有効な地震速報の場合のみ表示
                if (alert.id !== lastEewId && alert.earthquake && !alert.cancelled) {
                    lastEewId = alert.id;
                    
                    const epicenter = alert.earthquake.hypocenter.name || "調査中";
                    const maxShindo = alert.earthquake.maxScaleString || "不明";
                    
                    document.getElementById('eew-epicenter').innerText = `震源地: ${epicenter}`;
                    document.getElementById('eew-max-shindo').innerText = `最大震度 ${maxShindo}`;
                    
                    // 速報発生時は通常のオートスクロール・リロードを完全ロック
                    isPaused = true;
                    
                    const overlay = document.getElementById('eew-alert-overlay');
                    overlay.style.display = 'flex';
                    
                    // 180秒（3分）後にポップアップを自動クローズして復帰させるセーフティ
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        isPaused = false;
                    }, 180000);
                }
            } catch (e) {
                console.error("EEW監視エラー:", e);
            }
        }

        async function updateNews() {
            let allItems = [];
            for (const url of RSS_URLS) {
                try {
                    const targetUrl = 'https://corsproxy.io/?' + encodeURIComponent(url + '?t=' + Date.now());
                    const res = await fetch(targetUrl);
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    for (let item of xml.getElementsByTagName('item')) {
                        const descEl = item.getElementsByTagName('description')[0];
                        const description = descEl ? descEl.textContent : '';

                        allItems.push({
                            title: item.getElementsByTagName('title')[0].textContent,
                            link: item.getElementsByTagName('link')[0].textContent,
                            description: description,
                            pubDate: new Date(item.getElementsByTagName('pubDate')[0].textContent)
                        });
                    }
                } catch (e) {}
            }
            if (allItems.length === 0) return;

            allItems.sort((a, b) => b.pubDate - a.pubDate);
            const unique = Array.from(new Map(allItems.map(i => [i.title, i])).values());

            const marqueeCount = Math.min(unique.length, 15); 
            let marqueeHtml = '<span class="marquee-text">';
            for(let i = 0; i < marqueeCount; i++) {
                marqueeHtml += `<a href="${unique[i].link}" target="_blank" style="text-decoration:none; color:#ffffff;">【${i+1}】${unique[i].title}</a>`;
                if(i < marqueeCount - 1) {
                    marqueeHtml += ' &nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp; '; 
                }
            }
            marqueeHtml += '</span>';
            document.getElementById('marquee').innerHTML = marqueeHtml;
            
            document.getElementById('news-container').innerHTML = unique.slice(0, 50).map(item => `
                <a href="${item.link}" target="_blank" class="news-item">
                    <div class="news-header-row">
                        <div class="news-title">${item.title}</div>
                        <div class="news-time">${item.pubDate.getMonth()+1}/${item.pubDate.getDate()} ${String(item.pubDate.getHours()).padStart(2,'0')}:${String(item.pubDate.getMinutes()).padStart(2,'0')}</div>
                    </div>
                    <div class="news-desc">${item.description}</div>
                </a>
            `).join('');
            
            document.getElementById('news-container').scrollTop = 0;
            currentItemIndex = 0;
        }

        const container = document.getElementById('news-container');

        function syncAndPauseScroll() {
            // 🚨 EEW表示中はユーザー操作によるタイマースクロール復帰を防ぐ
            if(document.getElementById('eew-alert-overlay').style.display === 'flex') return;

            isPaused = true;
            clearTimeout(resumeTimeout);

            const items = container.querySelectorAll('.news-item');
            const containerTop = container.getBoundingClientRect().top;
            
            let closestIndex = 0;
            let minDistance = Infinity;

            items.forEach((item, index) => {
                const rect = item.getBoundingClientRect();
                const distance = Math.abs(rect.top - containerTop);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });
            currentItemIndex = closestIndex;

            resumeTimeout = setTimeout(() => {
                isPaused = false;
            }, 5000);
        }

        container.addEventListener('touchstart', syncAndPauseScroll, { passive: true });
        container.addEventListener('touchmove', syncAndPauseScroll, { passive: true });
        container.addEventListener('scroll', syncAndPauseScroll);
        container.addEventListener('mousedown', () => isPaused = true);
        container.addEventListener('mouseup', () => { if(document.getElementById('eew-alert-overlay').style.display !== 'flex') isPaused = false; });

        async function autoScroll() {
            if (isPaused) return;

            const items = container.querySelectorAll('.news-item');
            if (items.length === 0) return;

            // 🔄 ご希望の仕様：ニュースを読み切ったら画面全体を完全にリロード
            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 20 || currentItemIndex + 3 >= items.length) {
                location.reload();
                return;
            }

            currentItemIndex += 3;
            const targetItem = items[currentItemIndex];

            if (targetItem) {
                const containerTop = container.getBoundingClientRect().top;
                const targetTop = targetItem.getBoundingClientRect().top;
                
                container.scrollTo({
                    top: container.scrollTop + (targetTop - containerTop),
                    behavior: 'smooth'
                });
            }
        }

        async function init() {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }

            await updateNews();
            await checkEmergencyEarthquakeAlert(); // 初回起動時チェック
            await requestWakeLock();

            window.scrollTo(0, 0);
            if (container) {
                container.scrollTop = 0;
            }
        }

        init();
        
        setInterval(autoScroll, 30000); 
        
        // 🚨 5秒ごとに緊急地震速報APIをポーリング
        setInterval(checkEmergencyEarthquakeAlert, 5000);
        
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
