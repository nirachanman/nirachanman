<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHK ニュースモニター（ヘッダー固定版）</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --accent-color: #ff4d4d; --card-bg: #1e1e1e; }
        
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 10px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* ヘッダーを最上部に固定配置（スクロールしても残る設定） */
        header { 
            position: sticky;
            top: 0;
            background-color: var(--bg-color); /* 後ろのニュースが透けないように背景色を指定 */
            z-index: 1000; /* ニュースリストより手前に表示 */
            border-bottom: 2px solid var(--accent-color); 
            padding-bottom: 8px; 
            margin-bottom: 10px; 
            flex-shrink: 0; 
        }
        
        .header-top { display: flex; align-items: center; gap: 15px; overflow: hidden; }
        .header-link { text-decoration: none; display: flex; align-items: center; }
        h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; color: #fff; }
        
        .marquee-container { flex-grow: 1; overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: scroll-x 15s linear infinite; font-size: 1.1rem; }
        @keyframes scroll-x { 0% { transform: translate(100%, 0); } 100% { transform: translate(-100%, 0); } }

        #news-container { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        
        .news-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            text-decoration: none; 
            color: inherit; 
            background-color: var(--card-bg); 
            padding: 10px 12px; 
            border-radius: 4px; 
            border-left: 4px solid #555; 
            gap: 15px;
        }
        
        .news-title { 
            font-size: 1.3rem; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }
        
        .news-time { 
            font-size: 1.1rem; 
            color: #aaa; 
            white-space: nowrap;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="https://news.web.nhk/newsweb/pl/news-nwa-latest-nationwide" target="_blank" rel="noopener noreferrer" class="header-link">
                <h1>NHK 全国新着ニュース</h1>
            </a>
            <div class="marquee-container" id="marquee"></div>
        </div>
    </header>
    <main id="news-container"></main>

    <script>
        const RSS_URLS = [
            'https://news.web.nhk/n-data/conf/na/rss/cat0.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat1.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat2.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat3.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat4.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat5.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat6.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat7.xml'
        ];

        let isPaused = false;
        let wakeLock = null;
        let resumeTimeout = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function updateNews() {
            let allItems = [];
            for (const url of RSS_URLS) {
                try {
                    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    for (let item of xml.getElementsByTagName('item')) {
                        allItems.push({
                            title: item.getElementsByTagName('title')[0].textContent,
                            link: item.getElementsByTagName('link')[0].textContent,
                            pubDate: new Date(item.getElementsByTagName('pubDate')[0].textContent)
                        });
                    }
                } catch (e) {}
            }
            if (allItems.length === 0) return;

            allItems.sort((a, b) => b.pubDate - a.pubDate);
            const unique = Array.from(new Map(allItems.map(i => [i.title, i])).values());

            document.getElementById('marquee').innerHTML = `<a href="${unique[0].link}" target="_blank" style="text-decoration:none; color:#fff;"><span class="marquee-text">${unique[0].title}</span></a>`;
            document.getElementById('news-container').innerHTML = unique.slice(1, 51).map(item => `
                <a href="${item.link}" target="_blank" class="news-item">
                    <div class="news-title">${item.title}</div>
                    <div class="news-time">${item.pubDate.getMonth()+1}/${item.pubDate.getDate()} ${String(item.pubDate.getHours()).padStart(2,'0')}:${String(item.pubDate.getMinutes()).padStart(2,'0')}</div>
                </a>
            `).join('');
            
            window.scrollTo({ top: 0 });
        }

        function pauseAutoScroll() {
            isPaused = true;
            clearTimeout(resumeTimeout);
            resumeTimeout = setTimeout(() => {
                isPaused = false;
            }, 5000);
        }

        window.addEventListener('touchstart', pauseAutoScroll);
        window.addEventListener('touchmove', pauseAutoScroll);
        window.addEventListener('scroll', pauseAutoScroll);
        window.addEventListener('mousedown', () => isPaused = true);
        window.addEventListener('mouseup', () => { isPaused = false; });

        async function autoScroll() {
            if (isPaused) return;

            const container = document.getElementById('news-container');
            const firstItem = container.querySelector('.news-item');
            const itemHeight = firstItem ? firstItem.offsetHeight + 6 : 100;

            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 40) {
                location.reload();
            } else {
                window.scrollBy({
                    top: itemHeight * 7,
                    behavior: 'smooth'
                });
            }
        }

        async function init() {
            await updateNews();
            await requestWakeLock();
        }

        init();
        
        setInterval(autoScroll, 40000);

        setTimeout(() => {
            location.reload();
        }, 270000);

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
