<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHK 新着ニュースモニター</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #ff4d4d;
            --card-bg: #1e1e1e;
            --card-active: #2d2d2d;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .header-link {
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #fff;
            font-weight: bold;
        }
        /* 更新時刻 */
        #status {
            font-size: 1.0rem; 
            color: #ccc;
            white-space: nowrap;
            padding-left: 10px;
        }
        #news-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .news-item {
            display: block;
            text-decoration: none;
            color: inherit;
            background-color: var(--card-bg);
            border-left: 5px solid #555;
            padding: 10px 12px;
            border-radius: 4px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
            transition: background-color 0.1s ease;
        }
        .news-item:active {
            background-color: var(--card-active);
        }
        .news-title {
            font-size: 1.3rem; /* タイトル */
            font-weight: bold;
            line-height: 1.3;
            margin: 0 0 6px 0;
        }
        /* ニュースの日付・時刻を拡大 */
        .news-time {
            font-size: 1.0rem; 
            color: #bbb;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://news.web.nhk/newsweb/pl/news-nwa-latest-nationwide" target="_blank" rel="noopener noreferrer" class="header-link">
            <h1>NHK 全国新着ニュース</h1>
        </a>
        <div id="status">接続中...</div>
    </header>

    <main id="news-container">
        <p style="text-align:center; color:#888;">ニュースを取得しています...</p>
    </main>

    <script>
        const RSS_URL = 'https://news.web.nhk/n-data/conf/na/rss/cat0.xml';
        const PROXY_URL = 'https://corsproxy.io/?' + encodeURIComponent(RSS_URL);
        const INTERVAL = 60000; 

        async function fetchNews() {
            const statusEl = document.getElementById('status');
            const container = document.getElementById('news-container');
            
            try {
                statusEl.textContent = '更新中...';
                const response = await fetch(PROXY_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const text = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, 'text/xml');
                const items = xmlDoc.getElementsByTagName('item');
                
                if (items.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888;">ニュースがありません。</p>';
                    return;
                }

                let htmlContent = '';
                const maxItems = Math.min(items.length, 12);
                
                for (let i = 0; i < maxItems; i++) {
                    const title = items[i].getElementsByTagName('title')[0]?.textContent || '無題';
                    const link = items[i].getElementsByTagName('link')[0]?.textContent || '#';
                    const pubDateStr = items[i].getElementsByTagName('pubDate')[0]?.textContent || '';
                    
                    let displayTime = '';
                    if (pubDateStr) {
                        const date = new Date(pubDateStr);
                        if (!isNaN(date)) {
                            const month = date.getMonth() + 1;
                            const day = date.getDate();
                            const hours = String(date.getHours()).padStart(2, '0');
                            const minutes = String(date.getMinutes()).padStart(2, '0');
                            displayTime = `${month}/${day} ${hours}:${minutes}`;
                        }
                    }

                    htmlContent += `
                        <a href="${link}" target="_blank" rel="noopener noreferrer" class="news-item">
                            <div class="news-title">${title}</div>
                            <div class="news-time">${displayTime}</div>
                        </a>
                    `;
                }

                container.innerHTML = htmlContent;
                const now = new Date();
                statusEl.textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} 更新`;

            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = 'エラー';
            }
        }

        // スリープ防止
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        fetchNews();
        setInterval(fetchNews, INTERVAL);
        requestWakeLock();
        
        // 5分ごとの再読み込み
        setTimeout(() => { location.reload(); }, 300000);
    </script>
</body>
</html>
