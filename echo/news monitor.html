<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHK 全カテゴリニュースモニター</title>
    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --accent-color: #ff4d4d; --card-bg: #1e1e1e; --card-active: #2d2d2d; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; }
        header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; margin-bottom: 10px; }
        h1 { font-size: 1.5rem; margin: 0; color: #fff; }
        #status { font-size: 1.0rem; color: #aaa; }
        .news-item { display: block; text-decoration: none; color: inherit; background-color: var(--card-bg); border-left: 5px solid #555; padding: 10px 12px; margin-bottom: 8px; border-radius: 4px; transition: background-color 0.1s; }
        .news-item:active { background-color: var(--card-active); }
        .news-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
        .news-time { font-size: 1.0rem; color: #bbb; text-align: right; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>NHK ニュース全カテゴリ</h1>
        <div id="status">取得中...</div>
    </header>
    <main id="news-container"></main>

    <script>
        // cat0(主要) ～ cat7(科学・文化) の配列
        const RSS_URLS = [
            'https://news.web.nhk/n-data/conf/na/rss/cat0.xml', // 主要
            'https://news.web.nhk/n-data/conf/na/rss/cat1.xml', // 政治
            'https://news.web.nhk/n-data/conf/na/rss/cat2.xml', // 経済
            'https://news.web.nhk/n-data/conf/na/rss/cat3.xml', // 国際
            'https://news.web.nhk/n-data/conf/na/rss/cat4.xml', // 社会
            'https://news.web.nhk/n-data/conf/na/rss/cat5.xml', // スポーツ
            'https://news.web.nhk/n-data/conf/na/rss/cat6.xml', // 地域
            'https://news.web.nhk/n-data/conf/na/rss/cat7.xml'  // 科学・文化
        ];

        async function fetchAllNews() {
            const container = document.getElementById('news-container');
            let allItems = [];

            for (const url of RSS_URLS) {
                try {
                    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
                    const response = await fetch(proxyUrl);
                    const text = await response.text();
                    const xml = new DOMParser().parseFromString(text, 'text/xml');
                    const items = xml.getElementsByTagName('item');
                    
                    for (let item of items) {
                        allItems.push({
                            title: item.getElementsByTagName('title')[0].textContent,
                            link: item.getElementsByTagName('link')[0].textContent,
                            pubDate: new Date(item.getElementsByTagName('pubDate')[0].textContent)
                        });
                    }
                } catch (e) { console.error("Error:", e); }
            }

            // 新しい順にソートして重複を除去（タイトルで判断）
            allItems.sort((a, b) => b.pubDate - a.pubDate);
            const uniqueItems = Array.from(new Map(allItems.map(item => [item.title, item])).values());

            container.innerHTML = uniqueItems.slice(0, 20).map(item => `
                <a href="${item.link}" target="_blank" class="news-item">
                    <div class="news-title">${item.title}</div>
                    <div class="news-time">${item.pubDate.getMonth()+1}/${item.pubDate.getDate()} ${String(item.pubDate.getHours()).padStart(2,'0')}:${String(item.pubDate.getMinutes()).padStart(2,'0')}</div>
                </a>
            `).join('');
            
            document.getElementById('status').textContent = new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) + ' 更新';
        }

        fetchAllNews();
        setInterval(fetchAllNews, 60000);
        setTimeout(() => { location.reload(); }, 300000);
    </script>
</body>
</html>
