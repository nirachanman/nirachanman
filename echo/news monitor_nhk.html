<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NHK news monitor_nhk（岩手県防災・災害特化版）</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="data:,">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { 
            --bg-color: #0b0f14;        
            --accent-color: #696969;   
            --card-bg: #161c24;         
            
            --text-gray-title: #90caf9; 
            --text-gray-desc: #b0bec5;  
            
            --text-mint-title: #90caf9; 
            --text-mint-desc: #b0bec5;  
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        body {
            display: grid;
            grid-template-rows: auto auto 1fr; 
            padding: 10px;
            position: relative;
        }
        
        header { 
            border-bottom: 3px solid var(--accent-color); 
            padding-bottom: 8px; 
            margin-bottom: 10px;
            background-color: var(--bg-color);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
            transition: border-color 0.5s ease; 
        }
        
        .header-top { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 15px; 
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            overflow: hidden;
        }
        
        .header-link { text-decoration: none; display: flex; align-items: center; flex-shrink: 0; }
        h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; color: #ffffff; }
        
        .marquee-container { 
            flex-grow: 1; 
            height: 1.8rem;      
            overflow: hidden; 
            white-space: nowrap; 
            position: relative;  
        }
        
        .marquee-text { 
            position: absolute;
            left: 0;
            top: 0;
            display: inline-block; 
            padding-left: 100%;                  
            animation: scroll-x 120s linear infinite; 
            font-size: 1.4rem; 
            color: #ffffff; 
        }
        @keyframes scroll-x { 
            0% { transform: translate(0, 0); } 
            100% { transform: translate(-100%, 0); } 
        }

        .radio-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        /* プルダウンメニュー（select）のスタイル設定 */
        .radio-select {
            background-color: #263238;
            color: #b0bec5;
            border: 1px solid #455a64;
            padding: 6px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }
        
        /* 再生中（AM/FM選択時）のスタイル */
        .radio-select.playing {
            background-color: #00e676;
            color: #000000;
            border-color: #00e676;
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
        }

        #iwate-alert-container {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        #news-container { 
            overflow-y: auto;          
            scroll-behavior: smooth; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            width: 100%;
            max-width: 100%;
            height: 100%; 
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch; 
        }
        
        #news-container::-webkit-scrollbar {
            display: none;
        }
        
        .weather-alert-card {
            background-color: #2a1215;
            border: 2px solid #ff3333;
            border-left: 8px solid #ff3333;
            padding: 15px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.2rem;
            line-height: 1.6;
            box-sizing: border-box;
            width: 100%;
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: #ff3333; }
            50% { border-color: #ffaa00; }
        }
        .weather-alert-card.special {
            background-color: #24122a;
            border: 2px solid #da70d6;
            border-left: 8px solid #da70d6;
            animation: pulse-special 1.5s infinite;
        }
        @keyframes pulse-special {
            0%, 100% { border-color: #da70d6; }
            50% { border-color: #ffffff; }
        }
        .weather-alert-title {
            font-weight: bold;
            color: #ff5555;
            font-size: 1.4rem;
            margin-bottom: 6px;
        }
        .weather-alert-card.special .weather-alert-title {
            color: #ff77ff;
        }

        .news-item { 
            display: flex; 
            flex-direction: column; 
            text-decoration: none; 
            background-color: var(--card-bg); 
            padding: 12px; 
            border-radius: 4px; 
            border: 1px solid #2f4f4f;     
            border-left: 4px solid #2f4f4f; 
            gap: 8px;
            flex-shrink: 0; 
            box-sizing: border-box;         
            width: 100%; 
        }
        
        .news-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        
        .news-title { 
            font-size: 1.3rem; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            font-weight: 400; 
        }
        
        .news-time { 
            font-size: 1.3rem; 
            color: #ebd842; 
            white-space: nowrap;
            flex-shrink: 0;
        }

        .news-desc {
            font-size: 1.1rem;
            line-height: 1.5;
            white-space: normal;       
            word-wrap: break-word;     
            text-overflow: clip;       
            overflow: visible;         
        }

        .news-item:nth-child(odd) .news-title { color: var(--text-gray-title); }
        .news-item:nth-child(odd) .news-desc { color: var(--text-gray-desc); }

        .news-item:nth-child(even) .news-title { color: var(--text-mint-title); }
        .news-item:nth-child(even) .news-desc { color: var(--text-mint-desc); }

        #emergency-alert-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(186, 12, 47, 0.98); 
            z-index: 99999;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            box-sizing: border-box;
            padding: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .alert-flash {
            animation: blink 1s ease infinite;
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #fffb00; 
        }
        .alert-box {
            background-color: #000000;
            border: 4px solid #fffb00;
            border-radius: 12px;
            padding: 30px 60px;
            display: inline-block;
            max-width: 85%;
        }
        .alert-main-info {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ff3333;
            margin: 15px 0;
        }
        .alert-sub-info {
            font-size: 1.8rem;
            line-height: 1.8;
            margin-bottom: 10px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 10px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <div id="emergency-alert-overlay">
        <div id="alert-title" class="alert-flash">🚨 緊急速報 🚨</div>
        <div class="alert-box">
            <div id="alert-header" style="font-weight: bold; font-size: 2.5rem; color: #ffffff;">情報を解析中...</div>
            <div id="alert-main" class="alert-main-info">⚠️ 警戒してください</div>
            <div id="alert-detail" class="alert-sub-info">海岸や川の近くからすぐに離れてください。</div>
        </div>
    </div>

    <header>
        <div class="header-top">
            <div class="header-left">
                <a href="https://news.web.nhk/newsweb/pl/news-nwa-latest-nationwide" target="_blank" rel="noopener noreferrer" class="header-link">
                    <h1>NHK新着ニュース</h1>
                </a>
                <div class="marquee-container" id="marquee"></div>
            </div>
            <div class="radio-control">
                <!-- プルダウンメニュー -->
                <select id="radio-select" class="radio-select" onchange="changeRadio(this.value)">
                    <option value="off">📻 ラジオ OFF</option>
                    <option value="amt">📻 NHK-AM東京</option>
                    <option value="fmt">📻 NHK-FM東京</option>
                    <option value="ams">📻 NHK-AM仙台</option>
                    <option value="fms">📻 NHK-FM仙台</option>
                </select>
            </div>
        </div>
    </header>

    <div id="iwate-alert-container"></div>

    <main id="news-container"></main>

    <script>
        const RSS_URLS = [
            'https://news.web.nhk/n-data/conf/na/rss/cat0.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat1.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat2.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat3.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat4.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat5.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat6.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat7.xml'
        ];

        // 各局のURLマッピング
        const RADIO_STREAMS = {
            amt: 'https://simul2.drdi.st.nhk/live/3/joined/master.m3u8',
            fmt: 'https://simul2.drdi.st.nhk/live/5/joined/master.m3u8',
            ams: 'https://simul2.drdi.st.nhk/live/8/joined/master.m3u8',
            fms: 'https://simul2.drdi.st.nhk/live/9/joined/master.m3u8'
        };

        const radioAudio = new Audio();
        let hls = null;
        let currentRadioMode = 'off'; // 'off', 'am', 'fm'

        let isPaused = false;
        let currentItemIndex = 0; 
        
        let lastEewId = "";
        let lastTsunamiId = "";
        let isTsunamiActive = false;
        
        let iwateAlertLevel = 0; 
        let iwateActiveAlertsText = ""; 
        let iwateKikikuText = ""; 

        let lastRenderedMarquee = "";
        let lastRenderedIwateKikiku = "";
        let lastRenderedNewsLength = 0;
        let currentNewsUniqueItems = [];

        function changeRadio(selectedMode) {
            const selectEl = document.getElementById('radio-select');
            currentRadioMode = selectedMode;

            if (selectedMode === 'off') {
                // OFFの場合
                radioAudio.pause();
                if (hls) hls.stopLoad();
                selectEl.classList.remove('playing');
            } else {
                // AM または FM の場合
                loadAndPlayStream(RADIO_STREAMS[selectedMode], selectEl);
            }
        }

        function loadAndPlayStream(url, selectEl) {
            if (Hls.isSupported()) {
                if (!hls) {
                    hls = new Hls({ liveDurationInfinity: true, manifestLoadingMaxRetry: 10 });
                    hls.attachMedia(radioAudio);
                }
                hls.loadSource(url);
                hls.on(Hls.Events.MANIFEST_PARSED, () => playAudioStream(selectEl));
            } else if (radioAudio.canPlayType('application/vnd.apple.mpegurl')) {
                radioAudio.src = url;
                radioAudio.addEventListener('loadedmetadata', () => playAudioStream(selectEl));
            }
        }

        function playAudioStream(selectEl) {
            radioAudio.play().then(() => {
                selectEl.classList.add('playing');
            }).catch(err => console.error("再生エラー:", err));
        }

        async function updateNews() {
            let allItems = [];
            for (const url of RSS_URLS) {
                try {
                    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url + '?t=' + Date.now()));
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    for (let item of xml.getElementsByTagName('item')) {
                        const descEl = item.getElementsByTagName('description')[0];
                        allItems.push({
                            title: item.getElementsByTagName('title')[0].textContent,
                            link: item.getElementsByTagName('link')[0].textContent,
                            description: descEl ? descEl.textContent : '',
                            pubDate: new Date(item.getElementsByTagName('pubDate')[0].textContent)
                        });
                    }
                } catch (e) {}
            }
            if (allItems.length === 0) return;
            allItems.sort((a, b) => b.pubDate - a.pubDate);
            currentNewsUniqueItems = Array.from(new Map(allItems.map(i => [i.title, i])).values());
            refreshMarqueeAndCards(true); 
        }

        function refreshMarqueeAndCards(force = false) {
            if (currentNewsUniqueItems.length === 0) return;
            
            // マーキー（横流れタイトル）の描画ロジック
            const marqueeCount = Math.min(currentNewsUniqueItems.length, 15); 
            let marqueeHtml = '<span class="marquee-text">';
            for(let i = 0; i < marqueeCount; i++) {
                marqueeHtml += `<a href="${currentNewsUniqueItems[i].link}" target="_blank" style="text-decoration:none; color:#ffffff;">【${i+1}】${currentNewsUniqueItems[i].title}</a>`;
                if(i < marqueeCount - 1) marqueeHtml += ' &nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp; '; 
            }
            marqueeHtml += '</span>';

            if (force || marqueeHtml !== lastRenderedMarquee) {
                document.getElementById('marquee').innerHTML = marqueeHtml;
                lastRenderedMarquee = marqueeHtml;
            }

            // ニュースリスト（カード型）の描画ロジック
            const container = document.getElementById('news-container');
            if (force || currentNewsUniqueItems.length !== lastRenderedNewsLength) {
                let newsListHtml = currentNewsUniqueItems.slice(0, 57).map(item => `
                    <a href="${item.link}" target="_blank" class="news-item">
                        <div class="news-header-row">
                            <div class="news-title">${item.title}</div>
                            <div class="news-time">
                                ${item.pubDate.getMonth()+1}/${item.pubDate.getDate()} 
                                ${String(item.pubDate.getHours()).padStart(2, '0')}:${String(item.pubDate.getMinutes()).padStart(2, '0')}
                            </div>
                        </div>
                        <div class="news-desc">${item.description}</div>
                    </a>
                `).join('');
                container.innerHTML = newsListHtml;
                lastRenderedNewsLength = currentNewsUniqueItems.length;
            }
        }

        async function autoScroll() {
            if (isPaused) return;
            const container = document.getElementById('news-container');
            const items = container.querySelectorAll('.news-item');
            if (items.length === 0) return;

            // リストの最後まで到達した場合の処理
            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 50 || currentItemIndex + 3 >= items.length) {
                if (currentRadioMode !== 'off') { // ラジオ再生中（AM/FM）
                    await updateNews();
                    currentItemIndex = 0;
                    container.scrollTop = 0;
                } else { // ラジオOFF時
                    window.location.reload();
                }
                return;
            }

            currentItemIndex += 3;
            const targetItem = items[currentItemIndex];
            if (targetItem) {
                container.scrollTo({ top: targetItem.offsetTop - container.offsetTop, behavior: 'smooth' });
            }
        }

        // 初期化処理
        async function init() {
            await updateNews();
            setInterval(autoScroll, 30000); // 30秒毎にスクロール
        }
        init();
    </script>
</body>
</html>
