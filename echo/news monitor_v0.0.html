<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NHKニュースモニター</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="data:,">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { 
            --bg-color: #0b0f14;        
            --accent-color: #696969;   
            --card-bg: #161c24;         
            --text-gray-title: #90caf9; 
            --text-gray-desc: #b0bec5;  
            --text-mint-title: #90caf9; 
            --text-mint-desc: #b0bec5;  
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        body {
            display: grid;
            grid-template-rows: auto 1fr; 
            padding: 10px;
        }
        
        header { 
            border-bottom: 3px solid var(--accent-color); 
            padding-bottom: 8px; 
            margin-bottom: 10px;
        }
        
        .header-top { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 15px; 
        }
        
        .header-left { display: flex; align-items: center; gap: 15px; }
        h1 { font-size: 1.2rem; margin: 0; color: #ffffff; white-space: nowrap; }
        
        .radio-control { flex-shrink: 0; }
        .radio-btn {
            background-color: #263238;
            color: #b0bec5;
            border: 1px solid #455a64;
            padding: 6px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .radio-btn.playing {
            background-color: #00e676;
            color: #000000;
            border-color: #00e676;
        }

        #news-container { 
            overflow-y: auto;          
            scroll-behavior: smooth; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            height: 100%; 
        }
        
        #news-container::-webkit-scrollbar { display: none; }
        
        .news-item { 
            display: flex; 
            flex-direction: column; 
            text-decoration: none; 
            background-color: var(--card-bg); 
            padding: 12px; 
            border-radius: 4px; 
            border: 1px solid #2f4f4f;     
            border-left: 4px solid #2f4f4f; 
            gap: 8px;
        }
        
        .news-header-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .news-title { font-size: 1.3rem; font-weight: 400; color: var(--text-gray-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .news-time { font-size: 1.1rem; color: #607d8b; white-space: nowrap; }
        .news-desc { font-size: 1.1rem; color: var(--text-gray-desc); line-height: 1.5; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="header-left">
                <h1>NHKニュース一覧</h1>
            </div>
            <div class="radio-control">
                <button id="radio-toggle-btn" class="radio-btn" onclick="toggleRadio()">📻 ラジオ OFF</button>
            </div>
        </div>
    </header>

    <main id="news-container"></main>

    <script>
        const RSS_URLS = [
            'https://news.web.nhk/n-data/conf/na/rss/cat0.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat1.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat2.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat3.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat4.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat5.xml',
            'https://news.web.nhk/n-data/conf/na/rss/cat6.xml', 'https://news.web.nhk/n-data/conf/na/rss/cat7.xml'
        ];

        const RADIO_STREAM_URL = "https://simul.drdi.st.nhk/live/8/joined/master.m3u8";
        const radioAudio = new Audio();
        let hls = null;
        let isRadioPlaying = false;
        let currentNewsUniqueItems = [];
        let currentItemIndex = 0; 
        let lastRenderedNewsLength = 0;

        function toggleRadio() {
            const btn = document.getElementById('radio-toggle-btn');
            if (!isRadioPlaying) {
                if (Hls.isSupported()) {
                    if (!hls) {
                        hls = new Hls({ liveDurationInfinity: true });
                        hls.loadSource(RADIO_STREAM_URL);
                        hls.attachMedia(radioAudio);
                    }
                    hls.on(Hls.Events.MANIFEST_PARSED, () => radioAudio.play().then(() => {
                        isRadioPlaying = true;
                        btn.innerText = "📻 ラジオ ON";
                        btn.classList.add('playing');
                    }));
                }
            } else {
                radioAudio.pause();
                if (hls) hls.stopLoad();
                isRadioPlaying = false;
                btn.innerText = "📻 ラジオ OFF";
                btn.classList.remove('playing');
            }
        }

        async function updateNews() {
            let allItems = [];
            for (const url of RSS_URLS) {
                try {
                    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url + '?t=' + Date.now()));
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    for (let item of xml.getElementsByTagName('item')) {
                        const descEl = item.getElementsByTagName('description')[0];
                        allItems.push({
                            title: item.getElementsByTagName('title')[0].textContent,
                            link: item.getElementsByTagName('link')[0].textContent,
                            description: descEl ? descEl.textContent : '',
                            pubDate: new Date(item.getElementsByTagName('pubDate')[0].textContent)
                        });
                    }
                } catch (e) {}
            }
            allItems.sort((a, b) => b.pubDate - a.pubDate);
            currentNewsUniqueItems = Array.from(new Map(allItems.map(i => [i.title, i])).values());
            refreshCards();
        }

        function refreshCards() {
            const container = document.getElementById('news-container');
            container.innerHTML = currentNewsUniqueItems.slice(0, 50).map(item => `
                <a href="${item.link}" target="_blank" class="news-item">
                    <div class="news-header-row">
                        <div class="news-title">${item.title}</div>
                        <div class="news-time">
                            ${item.pubDate.getMonth()+1}/${item.pubDate.getDate()} 
                            ${String(item.pubDate.getHours()).padStart(2, '0')}:${String(item.pubDate.getMinutes()).padStart(2, '0')}
                        </div>
                    </div>
                    <div class="news-desc">${item.description}</div>
                </a>
            `).join('');
        }

        function autoScroll() {
            const container = document.getElementById('news-container');
            const items = container.querySelectorAll('.news-item');
            if (items.length === 0) return;

            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 50 || currentItemIndex + 3 >= items.length) {
                if (isRadioPlaying) {
                    updateNews();
                    currentItemIndex = 0;
                    container.scrollTop = 0;
                } else {
                    window.location.reload();
                }
                return;
            }

            currentItemIndex += 3;
            if (items[currentItemIndex]) {
                container.scrollTo({ top: items[currentItemIndex].offsetTop - container.offsetTop, behavior: 'smooth' });
            }
        }

        async function init() {
            await updateNews();
            setInterval(autoScroll, 30000);
        }
        init();
    </script>
</body>
</html>
