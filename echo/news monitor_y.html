<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yahoo!ニュースモニターlite</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="data:,">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { 
            --bg-color: #0b0f14;        
            --accent-color: #696969;   
            --card-bg: #161c24;         
            
            --text-gray-title: #90caf9; 
            --text-gray-desc: #b0bec5;  
            
            --text-mint-title: #90caf9; 
            --text-mint-desc: #b0bec5;  
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        body {
            display: grid;
            grid-template-rows: auto 1fr; 
            padding: 10px;
            position: relative;
        }
        
        header { 
            border-bottom: 3px solid var(--accent-color); 
            padding-bottom: 8px; 
            margin-bottom: 10px;
            background-color: var(--bg-color);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .header-top { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 15px; 
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            overflow: hidden;
        }
        
        .header-link { text-decoration: none; display: flex; align-items: center; flex-shrink: 0; }
        h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; color: #ffffff; }
        
        .marquee-container { 
            flex-grow: 1; 
            height: 1.8rem;      
            overflow: hidden; 
            white-space: nowrap; 
            position: relative;  
        }
        
        .marquee-text { 
            position: absolute;
            left: 0;
            top: 0;
            display: inline-block; 
            padding-left: 100%;                  
            animation: scroll-x 120s linear infinite; 
            font-size: 1.4rem; 
            color: #ffffff; 
        }
        @keyframes scroll-x { 
            0% { transform: translate(0, 0); } 
            100% { transform: translate(-100%, 0); } 
        }

        .radio-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .radio-btn {
            background-color: #263238;
            color: #b0bec5;
            border: 1px solid #455a64;
            padding: 6px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .radio-btn.playing {
            background-color: #00e676;
            color: #000000;
            border-color: #00e676;
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
        }

        #news-container { 
            overflow-y: auto;          
            scroll-behavior: smooth; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            width: 100%;
            max-width: 100%;
            height: 100%; 
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch; 
        }
        
        #news-container::-webkit-scrollbar {
            display: none;
        }

        .news-item { 
            display: flex; 
            flex-direction: column; 
            text-decoration: none; 
            background-color: var(--card-bg); 
            padding: 12px; 
            border-radius: 4px; 
            border: 1px solid #2f4f4f;     
            border-left: 4px solid #2f4f4f; 
            gap: 8px;
            flex-shrink: 0; 
            box-sizing: border-box;         
            width: 100%; 
        }
        
        .news-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        
        .news-title { 
            font-size: 1.3rem; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            font-weight: 400; 
        }
        
        .news-time { 
            font-size: 1.3rem; 
            color: #ebd842; 
            white-space: nowrap;
            flex-shrink: 0;
        }

        .news-desc {
            font-size: 1.1rem;
            line-height: 1.5;
            white-space: normal;       
            word-wrap: break-word;     
            text-overflow: clip;       
            overflow: visible;         
        }

        .news-item:nth-child(odd) .news-title { color: var(--text-gray-title); }
        .news-item:nth-child(odd) .news-desc { color: var(--text-gray-desc); }

        .news-item:nth-child(even) .news-title { color: var(--text-mint-title); }
        .news-item:nth-child(even) .news-desc { color: var(--text-mint-desc); }

.radio-control {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}
.radio-select {
    background-color: #263238;
    color: #ffffff;
    border: 1px solid #455a64;
    padding: 6px 8px;
    font-size: 0.95rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    outline: none;
}
.radio-btn {
    background-color: #263238;
    color: #b0bec5;
    border: 1px solid #455a64;
    padding: 6px 12px;
    font-size: 0.95rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
}
.radio-btn.playing {
    background-color: #00e676;
    color: #000000;
    border-color: #00e676;
    box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
}
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="header-left">
                <a href="https://news.web.nhk/newsweb/pl/news-nwa-latest-nationwide" target="_blank" rel="noopener noreferrer" class="header-link">
                    <h1>Yahoo!ニュース</h1>
                </a>
                <div class="marquee-container" id="marquee"></div>
            </div>
<div class="radio-control">
    <!-- 2局切替用のドロップダウンメニュー -->
    <select id="radio-station-select" class="radio-select" onchange="changeStation()">
        <option value="https://simul.drdi.st.nhk/live/8/joined/master.m3u8">📻 NHK-(AM)</option>
        <option value="https://simul.drdi.st.nhk/live/9/joined/master.m3u8">📻 NHK-(FM)</option>
        <option value="https://simul.drdi.st.nhk/live/3/joined/master.m3u8">📻 NHK-(AM)</option>
        <option value="https://simul.drdi.st.nhk/live/5/joined/master.m3u8">📻 NHK-(FM)</option>
    </select>
    <button id="radio-toggle-btn" class="radio-btn" onclick="toggleRadio()">OFF</button>
</div>
        </div>
    </header>

    <main id="news-container"></main>

<script>
    const RSS_URLS = [
    const RSS_URLS = [
        'https://news.yahoo.co.jp/rss/topics/it.xml', 'https://news.yahoo.co.jp/rss/topics/science.xml',
        'https://news.yahoo.co.jp/rss/topics/sports.xml', 'https://news.yahoo.co.jp/rss/media/ann/all.xml',
        'https://news.yahoo.co.jp/rss/media/iwanichi/all.xml', 'https://news.yahoo.co.jp/rss/media/nmit/all.xml',
        'https://news.yahoo.co.jp/rss/media/tvi/all.xml', 'https://news.yahoo.co.jp/rss/media/abema/all.xml',
        'https://news.yahoo.co.jp/rss/media/ibciwatev/all.xml', 'https://news.yahoo.co.jp/rss/media/iat/all.xml'
    ];

    // --- ここに必要な変数宣言を追加 ---
    let isPaused = false;
    let currentItemIndex = 0;
    let lastRenderedMarquee = "";
    let lastRenderedNewsLength = 0;
    let currentNewsUniqueItems = [];

    const radioAudio = new Audio();
    let hls = null;
    let isRadioPlaying = false;

// ラジオのON/OFF切り替え
function toggleRadio() {
    const btn = document.getElementById('radio-toggle-btn');
    const stationSelect = document.getElementById('radio-station-select');
    const selectedUrl = stationSelect.value;
    
    if (!isRadioPlaying) {
        startStream(selectedUrl, btn);
    } else {
        stopStream(btn);
    }
}

// 放送局切替イベント（再生中に局を変えたら自動で切り替える）
function changeStation() {
    const btn = document.getElementById('radio-toggle-btn');
    const stationSelect = document.getElementById('radio-station-select');
    const selectedUrl = stationSelect.value;

    if (isRadioPlaying) {
        stopStream(btn);
        startStream(selectedUrl, btn);
    }
}

// ストリーミング再生開始ロジック
function startStream(streamUrl, btn) {
    if (Hls.isSupported()) {
        if (!hls) {
            hls = new Hls({ liveDurationInfinity: true, manifestLoadingMaxRetry: 10 });
        }
        hls.loadSource(streamUrl);
        hls.attachMedia(radioAudio);
        hls.on(Hls.Events.MANIFEST_PARSED, () => playAudioStream(btn));
    } else if (radioAudio.canPlayType('application/vnd.apple.mpegurl')) {
        radioAudio.src = streamUrl;
        radioAudio.addEventListener('loadedmetadata', () => playAudioStream(btn));
    }
}

// 停止ロジック
function stopStream(btn) {
    radioAudio.pause();
    if (hls) hls.stopLoad();
    isRadioPlaying = false;
    btn.innerText = "OFF";
    btn.classList.remove('playing');
}

// 音声再生ロジック
function playAudioStream(btn) {
    radioAudio.play().then(() => {
        isRadioPlaying = true;
        btn.innerText = "ON";
        btn.classList.add('playing');
    }).catch(err => console.error("再生エラー:", err));
}

        async function updateNews() {
            let allItems = [];
            for (const url of RSS_URLS) {
                try {
                    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url + '?t=' + Date.now()));
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    for (let item of xml.getElementsByTagName('item')) {
                        const descEl = item.getElementsByTagName('description')[0];
                        allItems.push({
                            title: item.getElementsByTagName('title')[0].textContent,
                            link: item.getElementsByTagName('link')[0].textContent,
                            description: descEl ? descEl.textContent : '',
                            pubDate: new Date(item.getElementsByTagName('pubDate')[0].textContent)
                        });
                    }
                } catch (e) {}
            }
            if (allItems.length === 0) return;
            allItems.sort((a, b) => b.pubDate - a.pubDate);
            currentNewsUniqueItems = Array.from(new Map(allItems.map(i => [i.title, i])).values());
            refreshMarqueeAndCards(true); 
        }

        function refreshMarqueeAndCards(force = false) {
            if (currentNewsUniqueItems.length === 0) return;
            
            // マーキー（横流れタイトル）の復活処理
            const marqueeCount = Math.min(currentNewsUniqueItems.length, 15); 
            let marqueeHtml = '<span class="marquee-text">';
            for(let i = 0; i < marqueeCount; i++) {
                marqueeHtml += `<a href="${currentNewsUniqueItems[i].link}" target="_blank" style="text-decoration:none; color:#ffffff;">【${i+1}】${currentNewsUniqueItems[i].title}</a>`;
                if(i < marqueeCount - 1) marqueeHtml += ' &nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp; '; 
            }
            marqueeHtml += '</span>';

            if (force || marqueeHtml !== lastRenderedMarquee) {
                document.getElementById('marquee').innerHTML = marqueeHtml;
                lastRenderedMarquee = marqueeHtml;
            }

            // ニュースリストカードの描画処理（日付表示・時間0埋め対応版）
            const container = document.getElementById('news-container');
            if (force || currentNewsUniqueItems.length !== lastRenderedNewsLength) {
                let newsListHtml = currentNewsUniqueItems.slice(0, 80).map(item => `
                    <a href="${item.link}" target="_blank" class="news-item">
                        <div class="news-header-row">
                            <div class="news-title">${item.title}</div>
                            <div class="news-time">
                                ${item.pubDate.getMonth()+1}/${item.pubDate.getDate()} 
                                ${String(item.pubDate.getHours()).padStart(2, '0')}:${String(item.pubDate.getMinutes()).padStart(2, '0')}
                            </div>
                        </div>
                        <div class="news-desc">${item.description}</div>
                    </a>
                `).join('');
                container.innerHTML = newsListHtml;
                lastRenderedNewsLength = currentNewsUniqueItems.length;
            }
        }

        async function autoScroll() {
            if (isPaused) return;
            const container = document.getElementById('news-container');
            const items = container.querySelectorAll('.news-item');
            if (items.length === 0) return;

            // リストの最後まで到達した場合の処理
            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 50 || currentItemIndex + 3 >= items.length) {
                if (isRadioPlaying) {
                    await updateNews();
                    currentItemIndex = 0;
                    container.scrollTop = 0;
                } else {
                    window.location.reload();
                }
                return;
            }

            currentItemIndex += 3;
            const targetItem = items[currentItemIndex];
            if (targetItem) {
                container.scrollTo({ top: targetItem.offsetTop - container.offsetTop, behavior: 'smooth' });
            }
        }

        // 初期化処理
        async function init() {
            await updateNews();
            setInterval(autoScroll, 30000); // 30秒毎にスクロール
        }
        init();
    </script>
</body>
</html>
