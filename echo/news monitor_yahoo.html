<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>yahooニュースモニター</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="data:,">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { 
            --bg-color: #0b0f14;        
            --accent-color: #696969;   
            --card-bg: #002D33;         
            
            --text-gray-title: #90caf9; 
            --text-gray-desc: #b0bec5;  
            
            --text-mint-title: #90caf9; 
            --text-mint-desc: #b0bec5;  
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        body {
            display: grid;
            grid-template-rows: auto 1fr; 
            padding: 10px;
            position: relative;
        }
        
        header { 
            border-bottom: 3px solid var(--accent-color); 
            padding-bottom: 8px; 
            margin-bottom: 10px;
            background-color: var(--bg-color);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .header-top { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 15px; 
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            overflow: hidden;
        }
        
        .header-link { text-decoration: none; display: flex; align-items: center; flex-shrink: 0; }
        h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; color: #ffffff; }
        
/* 1. 親容器の高さの調整（文字が上下にはみ出るのを防ぐため） */
.marquee-container { 
    flex-grow: 1; 
    height: 1.8rem;      /* ← 元の 1.5rem から 1.8rem などに少し広げる */
    overflow: hidden; 
    white-space: nowrap; 
    position: relative;  
}

/* 2. マーキー文字自体のサイズ変更 */
.marquee-text { 
    position: absolute;
    left: 0;
    top: 0;
    display: inline-block; 
    padding-left: 100%;                  
    animation: scroll-x 180s linear infinite; 
    font-size: 1.4rem;  /* ← 元の 1.1rem から 1.4rem（または1.5remなど）に大きくする */
    color: #ffffff; 
}
        @keyframes scroll-x { 
            0% { transform: translate(0, 0); } 
            100% { transform: translate(-100%, 0); } 
        }

        .radio-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        /* プルダウンメニュー（select）のスタイル設定 */
        .radio-select {
            background-color: #263238;
            color: #b0bec5;
            border: 1px solid #455a64;
            padding: 6px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }
        
        /* 再生中（AM/FM選択時）のスタイル */
        .radio-select.playing {
            background-color: #00e676;
            color: #000000;
            border-color: #00e676;
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
        }


        #news-container { 
            overflow-y: auto;          
            scroll-behavior: smooth; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            width: 100%;
            max-width: 100%;
            height: 100%; 
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch; 
        }
        
        #news-container::-webkit-scrollbar {
            display: none;
        }

        .news-item { 
            display: flex; 
            flex-direction: column; 
            text-decoration: none; 
            background-color: var(--card-bg); 
            padding: 12px; 
            border-radius: 4px; 
            border: 1px solid #063944;     
            border-left: 4px solid #063944; 
            gap: 8px;
            flex-shrink: 0; 
            box-sizing: border-box;         
            width: 100%; 
        }
        
        .news-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        
        .news-title { 
            font-size: 1.3rem; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            font-weight: 400; 
        }
        
        .news-time { 
            font-size: 1.3rem; 
            color: #ebd842; 
            white-space: nowrap;
            flex-shrink: 0;
        }

        .news-desc {
            font-size: 1.1rem;
            line-height: 1.5;
            white-space: normal;       
            word-wrap: break-word;     
            text-overflow: clip;       
            overflow: visible;         
        }


        .news-item:nth-child(odd) .news-title { color: var(--text-gray-title); }
        .news-item:nth-child(odd) .news-desc { color: var(--text-gray-desc); }

        .news-item:nth-child(even) .news-title { color: var(--text-mint-title); }
        .news-item:nth-child(even) .news-desc { color: var(--text-mint-desc); }


    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="header-left">
                <a href="https://news.yahoo.co.jp/" target="_blank" rel="noopener noreferrer" class="header-link">
                    <h1>Yahooニュース</h1>
                </a>
                <div class="marquee-container" id="marquee"></div>
            </div>
            <div class="radio-control">
                <!-- プルダウンメニュー -->
                <select id="radio-select" class="radio-select" onchange="changeRadio(this.value)">
                    <option value="off">📻 ラジオ OFF</option>
                    <option value="amt">📻 NHK-AM東京</option>
                    <option value="fmt">📻 NHK-FM東京</option>
                    <option value="ams">📻 NHK-AM仙台</option>
                    <option value="fms">📻 NHK-FM仙台</option>
                </select>
            </div>
        </div>
    </header>

    <div id="iwate-alert-container"></div>

    <main id="news-container"></main>

<script>
    const RSS_URLS = [
        'https://news.yahoo.co.jp/rss/topics/it.xml', 'https://news.yahoo.co.jp/rss/topics/science.xml',
        'https://news.yahoo.co.jp/rss/topics/sports.xml', 'https://news.yahoo.co.jp/rss/media/ann/all.xml',
        'https://news.yahoo.co.jp/rss/media/iwanichi/all.xml', 'https://news.yahoo.co.jp/rss/media/nmit/all.xml',
        'https://news.yahoo.co.jp/rss/media/tvi/all.xml', 'https://news.yahoo.co.jp/rss/media/abema/all.xml',
        'https://news.yahoo.co.jp/rss/media/ibciwatev/all.xml', 'https://news.yahoo.co.jp/rss/media/iat/all.xml'
    ];

        // 各局のURLマッピング
        const RADIO_STREAMS = {
            amt: 'https://simul2.drdi.st.nhk/live/3/joined/master.m3u8',
            fmt: 'https://simul2.drdi.st.nhk/live/5/joined/master.m3u8',
            ams: 'https://simul2.drdi.st.nhk/live/8/joined/master.m3u8',
            fms: 'https://simul2.drdi.st.nhk/live/9/joined/master.m3u8'
        };

        const radioAudio = new Audio();
        let hls = null;
        let currentRadioMode = 'off';

        let isPaused = false;
        let currentItemIndex = 0; 
        
        let lastEewId = "";
        let lastTsunamiId = "";
        let isTsunamiActive = false;
        
        let iwateAlertLevel = 0; 
        let iwateActiveAlertsText = ""; 
        let iwateKikikuText = ""; 

        let lastRenderedMarquee = "";
        let lastRenderedIwateKikiku = "";
        let lastRenderedNewsLength = 0;
        let currentNewsUniqueItems = [];

        function changeRadio(selectedMode) {
            const selectEl = document.getElementById('radio-select');
            currentRadioMode = selectedMode;

            if (selectedMode === 'off') {
                radioAudio.pause();
                if (hls) hls.stopLoad();
                selectEl.classList.remove('playing');
            } else {
                loadAndPlayStream(RADIO_STREAMS[selectedMode], selectEl);
            }
        }

        function loadAndPlayStream(url, selectEl) {
            if (Hls.isSupported()) {
                if (!hls) {
                    hls = new Hls({ liveDurationInfinity: true, manifestLoadingMaxRetry: 10 });
                    hls.attachMedia(radioAudio);
                }
                hls.loadSource(url);
                hls.on(Hls.Events.MANIFEST_PARSED, () => playAudioStream(selectEl));
            } else if (radioAudio.canPlayType('application/vnd.apple.mpegurl')) {
                radioAudio.src = url;
                radioAudio.addEventListener('loadedmetadata', () => playAudioStream(selectEl));
            }
        }

        function playAudioStream(selectEl) {
            radioAudio.play().then(() => {
                selectEl.classList.add('playing');
            }).catch(err => console.error("再生エラー:", err));
        }

        // ご自身のGASウェブアプリURL
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxbkDqbxISfiTr82SaqabxoN6TsOGIPn7w6rTY-ZQXP27nfbICEe2BH6deGjGOrEKHQXQ/exec';

        async function fetchRssXml(url) {
            // 1. GAS経由での取得を優先
            try {
                const targetUrl = GAS_WEB_APP_URL + '?url=' + encodeURIComponent(url);
                const res = await fetch(targetUrl);
                if (res.ok) {
                    const xmlText = await res.text();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                    if (xmlDoc.getElementsByTagName('parsererror').length === 0 && xmlDoc.getElementsByTagName('item').length > 0) {
                        return xmlDoc;
                    }
                }
            } catch (e) {
                console.warn("GAS経由での取得エラー、予備プロキシを試行:", url, e);
            }

            // 2. 予備プロキシ (corsproxy.io)
            try {
                const cacheBustUrl = url + '?t=' + Date.now();
                const proxyUrl2 = 'https://corsproxy.io/?' + encodeURIComponent(cacheBustUrl);
                const res2 = await fetch(proxyUrl2);
                if (res2.ok) {
                    const text = await res2.text();
                    const xmlDoc2 = new DOMParser().parseFromString(text, 'text/xml');
                    if (xmlDoc2.getElementsByTagName('parsererror').length === 0) {
                        return xmlDoc2;
                    }
                }
            } catch (e) {
                console.warn("予備プロキシも失敗:", e);
            }

            throw new Error('RSS取得失敗');
        }

async function updateNews() {
            // 6つのRSSを同時に並列で取得開始
            const fetchPromises = RSS_URLS.map(async (url) => {
                try {
                    const xml = await fetchRssXml(url);
                    const items = xml.getElementsByTagName('item');
                    const parsedItems = [];
                    for (let item of items) {
                        const titleEl = item.getElementsByTagName('title')[0];
                        const linkEl = item.getElementsByTagName('link')[0];
                        const descEl = item.getElementsByTagName('description')[0];
                        const pubDateEl = item.getElementsByTagName('pubDate')[0];

                        if (titleEl && linkEl) {
                            parsedItems.push({
                                title: titleEl.textContent,
                                link: linkEl.textContent,
                                description: descEl ? descEl.textContent : '',
                                pubDate: pubDateEl ? new Date(pubDateEl.textContent) : new Date()
                            });
                        }
                    }
                    return parsedItems;
                } catch (e) {
                    console.warn("RSS取得スキップ:", url);
                    return [];
                }
            });

            // すべての通信完了を待機（並列処理）
            const results = await Promise.all(fetchPromises);
            
            // 取得した全配列をフラットに結合
            let allItems = results.flat();

            // データが全く取れなかった場合は何もしない（画面を消さない）
            if (allItems.length === 0) {
                console.error("すべてのRSSの取得に失敗しました。");
                return;
            }
            
            // 日付順にソート & 重複除去
            allItems.sort((a, b) => b.pubDate - a.pubDate);
            currentNewsUniqueItems = Array.from(new Map(allItems.map(i => [i.title, i])).values());
            refreshMarqueeAndCards(true); 
        }

        function refreshMarqueeAndCards(force = false) {
            if (currentNewsUniqueItems.length === 0) return;
            
            // マーキー（横流れタイトル）の描画ロジック
            const marqueeCount = Math.min(currentNewsUniqueItems.length, 15); 
            let marqueeHtml = '<span class="marquee-text">';
            for(let i = 0; i < marqueeCount; i++) {
                marqueeHtml += `<a href="${currentNewsUniqueItems[i].link}" target="_blank" style="text-decoration:none; color:#ffffff;">【${i+1}】${currentNewsUniqueItems[i].title}</a>`;
                if(i < marqueeCount - 1) marqueeHtml += ' &nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp; '; 
            }
            marqueeHtml += '</span>';

            if (force || marqueeHtml !== lastRenderedMarquee) {
                const marqueeEl = document.getElementById('marquee');
                if (marqueeEl) marqueeEl.innerHTML = marqueeHtml;
                lastRenderedMarquee = marqueeHtml;
            }

            // ニュースリスト（カード型）の描画ロジック
            const container = document.getElementById('news-container');
            if (container && (force || currentNewsUniqueItems.length !== lastRenderedNewsLength)) {
                let newsListHtml = currentNewsUniqueItems.slice(0, 57).map(item => `
                    <a href="${item.link}" target="_blank" class="news-item">
                        <div class="news-header-row">
                            <div class="news-title">${item.title}</div>
                            <div class="news-time">
                                ${item.pubDate.getMonth()+1}/${item.pubDate.getDate()} 
                                ${String(item.pubDate.getHours()).padStart(2, '0')}:${String(item.pubDate.getMinutes()).padStart(2, '0')}
                            </div>
                        </div>
                        <div class="news-desc">${item.description}</div>
                    </a>
                `).join('');
                container.innerHTML = newsListHtml;
                lastRenderedNewsLength = currentNewsUniqueItems.length;
            }
        }

// なめらかなスクロールを実現するアニメーション関数
function smoothScrollTo(element, target, duration = 1000) {
    const start = element.scrollTop;
    const change = target - start;
    const startTime = performance.now();

    function animateScroll(currentTime) {
        const elapsedTime = currentTime - startTime;
        const progress = Math.min(elapsedTime / duration, 1);

        // イージング関数（easeInOutCubic: 滑らかに動き出して滑らかに止まる）
        const easeInOutCubic = progress < 0.5
            ? 4 * progress * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        element.scrollTop = start + change * easeInOutCubic;

        if (progress < 1) {
            requestAnimationFrame(animateScroll);
        }
    }

    requestAnimationFrame(animateScroll);
}

// 30秒毎に呼ばれるメイン処理
async function autoScroll() {
    if (isPaused) return;
    const container = document.getElementById('news-container');
    const items = container.querySelectorAll('.news-item');
    if (items.length === 0) return;

    // リストの最後まで到達した場合の処理
    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 50 || currentItemIndex + 3 >= items.length) {
        if (currentRadioMode !== 'off') { // ラジオ再生中（AM/FM）
            await updateNews();
            currentItemIndex = 0;
            smoothScrollTo(container, 0, 800); // 0.8秒かけて一番上へ戻る
        } else { // ラジオOFF時
            window.location.reload();
        }
        return;
    }

    currentItemIndex += 3;
    const targetItem = items[currentItemIndex];
    if (targetItem) {
        const targetTop = targetItem.offsetTop - container.offsetTop;
        // 1.2秒（1200ms）かけて滑らかに次のカード群へスクロール
        smoothScrollTo(container, targetTop, 1200); 
    }
}

        // 初期化処理
        async function init() {
            await updateNews();
            setInterval(autoScroll, 30000); // 30秒毎にスクロール
        }
        init();
    </script>
</body>
</html>
