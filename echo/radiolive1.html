<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Blue Radio - Echo Show 8 Large Font Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --midnight-blue: #0b1120;
            --deep-navy: #162032;
            --border-blue: #3b4d6b;
            --soft-blue: #cbd5e1;
            --highlight-blue: #38bdf8;
            --white-blue: #ffffff;
            --date-color: #f1f5f9;
            --time-color: #fde047;
            --stop-red: #fca5a5;
            --stop-red-border: rgba(252, 165, 165, 0.7);
            --stop-red-bg: rgba(248, 113, 113, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', -apple-system, sans-serif;
            background-color: var(--midnight-blue);
            color: var(--white-blue);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        :fullscreen, ::backdrop {
            background-color: var(--midnight-blue);
        }
        :-webkit-full-screen {
            background-color: var(--midnight-blue);
        }

        .player-card {
            background: var(--deep-navy);
            width: 97vw;
            height: 94vh;
            padding: 24px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid var(--border-blue);
            display: grid;
            grid-template-columns: 1.05fr 1.15fr;
            gap: 32px;
            align-items: center;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding-right: 28px;
            border-right: 2px solid rgba(59, 77, 107, 0.7);
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.15rem;
            margin: 0;
            color: var(--highlight-blue);
        }

        .clock-weather-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: auto 0;
            gap: 18px;
        }

        .live-clock {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .clock-date {
            color: var(--date-color);
            font-size: 2.65rem;
            font-weight: 700;
            letter-spacing: 0.04rem;
            line-height: 1.15;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .clock-time {
            color: var(--time-color);
            font-size: 5.4rem;
            line-height: 1.0;
            text-shadow: 0 0 20px rgba(253, 224, 71, 0.25);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .weather-box {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(11, 17, 32, 0.7);
            border: 1.5px solid var(--border-blue);
            border-radius: 18px;
            padding: 15px 20px;
        }

        .weather-icon {
            font-size: 2.8rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .weather-main {
            display: flex;
            align-items: baseline;
            gap: 14px;
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--white-blue);
        }

        .weather-temp {
            color: var(--highlight-blue);
            font-size: 1.85rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .weather-sub {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--soft-blue);
            letter-spacing: 0.02rem;
        }

        .status-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--soft-blue);
            letter-spacing: 0.06rem;
        }

        .dot {
            width: 14px;
            height: 14px;
            background-color: var(--soft-blue);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .playing .dot {
            background-color: var(--highlight-blue);
            box-shadow: 0 0 12px var(--highlight-blue);
            animation: pulse 2s infinite;
        }

        .playing #statusText {
            color: var(--white-blue);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .timer-display {
            font-size: 1.3rem;
            color: var(--time-color);
            min-height: 1.6rem;
            font-weight: 700;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 4px 0;
        }

        .select-group {
            text-align: left;
        }

        label {
            display: block;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--soft-blue);
            margin-bottom: 10px;
            margin-left: 4px;
            letter-spacing: 0.06rem;
        }

        .select-container {
            position: relative;
        }

        select {
            width: 100%;
            padding: 18px 46px 18px 20px;
            background-color: var(--midnight-blue);
            border: 2px solid var(--border-blue);
            border-radius: 18px;
            color: var(--white-blue);
            font-size: 1.45rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            appearance: none;
            transition: border-color 0.2s ease;
        }

        select:focus {
            border-color: var(--highlight-blue);
        }

        select optgroup {
            background-color: #1e293b;
            color: #38bdf8;
            font-weight: 700;
            font-style: normal;
        }

        select option {
            background-color: #0b1120;
            color: #ffffff;
            font-weight: 600;
        }

        .select-container::after {
            content: '▼';
            font-size: 1.2rem;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--highlight-blue);
            pointer-events: none;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(11, 17, 32, 0.75);
            padding: 16px 18px;
            border-radius: 20px;
            border: 1.5px solid var(--border-blue);
        }

        .play-toggle-btn {
            flex-shrink: 0;
            min-width: 155px;
            height: 66px;
            padding: 0 22px;
            border-radius: 16px;
            border: 2px solid var(--highlight-blue);
            background-color: rgba(56, 189, 248, 0.16);
            color: var(--highlight-blue);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .play-toggle-btn:active {
            transform: scale(0.97);
        }

        .play-toggle-btn.is-playing {
            border-color: var(--stop-red-border);
            background-color: var(--stop-red-bg);
            color: var(--stop-red);
        }

        .play-toggle-btn:disabled {
            border-color: var(--border-blue);
            background-color: rgba(30, 41, 59, 0.5);
            color: var(--soft-blue);
            opacity: 0.5;
            cursor: not-allowed;
        }

        audio {
            width: 100%;
            height: 52px;
            filter: invert(100%) hue-rotate(190deg) brightness(1.25);
            opacity: 0.85;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: 600;
            color: var(--soft-blue);
            opacity: 0.85;
            padding: 0 4px;
        }

        @media (max-width: 760px) {
            html, body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .player-card {
                grid-template-columns: 1fr;
                height: auto;
                padding: 24px;
                gap: 24px;
                margin: 16px 0;
            }
            .left-panel {
                border-right: none;
                border-bottom: 2px solid var(--border-blue);
                padding-right: 0;
                padding-bottom: 20px;
                text-align: center;
                align-items: center;
            }
            .clock-date {
                font-size: 2rem;
            }
            .clock-time {
                font-size: 3.6rem;
            }
            .weather-box {
                justify-content: center;
                text-align: left;
            }
            .control-row {
                flex-direction: column;
            }
            .play-toggle-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="player-card">
    <!-- 左パネル：時計・お天気・ステータス -->
    <div class="left-panel">
        <h1>📻 Deep Blue Radio</h1>
        
        <div class="clock-weather-group">
            <div id="liveClock" class="live-clock">
                <span id="clockDate" class="clock-date">----/--/--</span>
                <span id="clockTime" class="clock-time">--:--:--</span>
            </div>

            <div id="weatherBox" class="weather-box">
                <div id="weatherIcon" class="weather-icon">🌤️</div>
                <div class="weather-info">
                    <div class="weather-main">
                        <span id="weatherDesc">天気取得中...</span>
                        <span id="weatherTemp" class="weather-temp">--.-°C</span>
                    </div>
                    <div id="weatherSub" class="weather-sub">盛岡市好摩</div>
                </div>

        </div>

        <div class="status-box">
            <div id="statusContainer" class="status-indicator">
                <div class="dot"></div>
                <span id="statusText">スタンバイ</span>
            </div>
            <div id="timerDisplay" class="timer-display"></div>
        </div>
    </div>

    <!-- 右パネル：選局とコントロール -->
    <div class="right-panel">
        <div class="select-group">
            <label for="channelSelector">放送局 (Station)</label>
            <div class="select-container">
                <select id="channelSelector">

                        <option value="https://simul2.drdi.st.nhk/live/9/joined/master.m3u8">NHK FM（仙台）</option>
                    </optgroup>
                    <optgroup label="━━ SmoothJazz・リラックス ━━">
                        <option value="https://bcast.vigormultimedia.com:48888/sjcompl192aac">smoothjazz.com.pl</option>
                        <option value="https://jking.cdnstream1.com/b22139_128mp3">101 Smooth Jazz</option>
                        <option value="https://ais-edge89-dal02.cdnstream.com/b48071_128mp3">101 Smooth Jazz Mellow Mix</option>
                        <option value="https://ais-edge89-dal02.cdnstream.com/2124_128.mp3">smooth-jazz-247</option>
                        <option value="https://das-edge62-live365-dal03.cdnstream.com/a49349">Smooth Jazz Mix New York</option>
                        <option value="https://cast1.torontocast.com:4490/;">SMOOTH JAZZ DELUXE</option>
                        <option value="https://centova2.svdns.com.br:20038/stream">Gold Instrumental</option>
                        <option value="https://centova2.svdns.com.br:20056/stream">Gold web radio</option>
                        <option value="https://smoothjazz.cdnstream1.com/2585_128.mp3">SmoothJazz.com Global Radio</option>
                        <option value="https://shonanbeachfm.out.airtime.pro:8000/shonanbeachfm_a">Shonan BeachFM</option>
                        <option value="https://pianosolo.streamguys1.com/live">Solo Piano Radio</option>
                        <option value="https://az1.mediacp.eu/listen/natureradiosleep/radio.mp3">NATURE RADIO SLEEP(自然音)</option> 
                    </optgroup>
                    <optgroup label="━━ J-Pop ━━">
                        <option value="https://quincy.torontocast.com:2070/stream.mp3">J-Pop Sakura 懐かしい</option>
                        <option value="https://jenny.torontocast.com:2000/stream/J1GOLD">J1 GOLD 昭和</option>
                        <option value="https://0nlineradio.stream13.radiohost.de/0r-j-pop?ref=tunein&upd-meta&upd-scheme=https&_art=dD0xNzgxODgzMjE3JmQ9OTY5OTVhMmRiZGVhOTdiNTY2ZjU">0nlineradio J-POP</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="select-group">
            <label for="timerSelector">スリープタイマー (Sleep Timer)</label>
            <div class="select-container">
                <select id="timerSelector">
                    <option value="0">OFF (タイマーなし)</option>
                    <option value="15">15 分</option>
                    <option value="30">30 分</option>
                    <option value="60">60 分</option>
                    <option value="90">90 分</option>
                </select>
            </div>
        </div>

        <div class="control-row">
            <button id="playToggleBtn" class="play-toggle-btn" disabled>▶ 再生</button>
            <audio id="player" controls></audio>
        </div>

        <div class="footer-row">
            <span id="keepAwakeStatus">画面維持: 起動中...</span>
            <span>Echo Show 8 見やすい特大表示</span>
        </div>
    </div>
</div>

<!-- スリープ防止用の極小無音オーディオ -->
<audio id="silentKeeper" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

<script>
    const audio = document.getElementById('player');
    const silentKeeper = document.getElementById('silentKeeper');
    const selector = document.getElementById('channelSelector');
    const timerSelector = document.getElementById('timerSelector');
    const timerDisplay = document.getElementById('timerDisplay');
    const statusText = document.getElementById('statusText');
    const statusContainer = document.getElementById('statusContainer');
    const clockDate = document.getElementById('clockDate');
    const clockTime = document.getElementById('clockTime');
    const playToggleBtn = document.getElementById('playToggleBtn');
    const keepAwakeStatus = document.getElementById('keepAwakeStatus');

    // お天気表示用要素と設定（盛岡市好摩駅周辺）
    const WEATHER_CONFIG = {
        name: "盛岡市好摩",
        lat: 39.8736,
        lon: 141.1748
    };
    const weatherIcon = document.getElementById('weatherIcon');
    const weatherDesc = document.getElementById('weatherDesc');
    const weatherTemp = document.getElementById('weatherTemp');
    const weatherSub = document.getElementById('weatherSub');
    
    let hls = null;
    let sleepTimer = null;
    let remainingTime = 0;
    let currentStreamType = "";
    let wakeLock = null;
    let keepAwakeEnabled = true;

    // 画面スリープ防止（Wake Lock + 無音ループ再生）を有効化
    async function enableKeepAwake() {
        keepAwakeEnabled = true;
        let audioStarted = false;
        let wakeLockStarted = false;

        // 1. 無音オーディオのループ開始を試行
        try {
            silentKeeper.volume = 0.01;
            await silentKeeper.play();
            audioStarted = true;
        } catch (e) {
            audioStarted = false;
        }

        // 2. Screen Wake Lock API のリクエストを試行
        if ('wakeLock' in navigator) {
            try {
                if (!wakeLock) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                }
                wakeLockStarted = true;
            } catch (e) {
                wakeLockStarted = false;
            }
        }

        // ステータス表示の更新
        if (audioStarted) {
            keepAwakeStatus.textContent = "画面維持: ON";
        } else if (wakeLockStarted) {
            keepAwakeStatus.textContent = "画面維持: ON (画面タッチで強化)";
        } else {
            keepAwakeStatus.textContent = "画面維持: 待機 (画面タッチでON)";
        }
    }

    // 画面スリープ防止を解除（スリープタイマー完了時用）
    function disableKeepAwake() {
        keepAwakeEnabled = false;
        silentKeeper.pause();
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
        keepAwakeStatus.textContent = "画面維持: OFF";
    }

    // ページ読み込み直後に自動実行を試みる
    window.addEventListener('DOMContentLoaded', () => {
        enableKeepAwake();
    });

    // 初期ロード時にブラウザ制限で無音再生がブロックされた場合、画面のどこかを1回タッチした瞬間に有効化
    function unlockOnFirstTouch() {
        if (keepAwakeEnabled && silentKeeper.paused) {
            enableKeepAwake();
        }
        if (!silentKeeper.paused) {
            document.removeEventListener('touchstart', unlockOnFirstTouch);
            document.removeEventListener('click', unlockOnFirstTouch);
        }
    }
    document.addEventListener('touchstart', unlockOnFirstTouch, { passive: true });
    document.addEventListener('click', unlockOnFirstTouch);

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && keepAwakeEnabled) {
            enableKeepAwake();
        }
    });

    // 全画面モードへ切り替える処理
    function enterFullscreen() {
        const docEl = document.documentElement;
        const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
        
        if (!isFullscreen) {
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            }
        }
    }

    // リアルタイム時計機能（曜日付き）
    const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
    function updateClock() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const day = weekDays[now.getDay()];
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        
        clockDate.textContent = `${yyyy}/${mm}/${dd} (${day})`;
        clockTime.textContent = `${hh}:${min}:${ss}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // WMO天気コードを日本語・絵文字に変換
    function parseWeatherCode(code, isDay) {
        if (code === 0) return { icon: isDay ? "☀️" : "🌙", text: "快晴" };
        if (code === 1) return { icon: isDay ? "🌤️" : "🌙", text: "晴れ" };
        if (code === 2) return { icon: "⛅", text: "晴れ時々くもり" };
        if (code === 3) return { icon: "☁️", text: "くもり" };
        if (code === 45 || code === 48) return { icon: "🌫️", text: "霧" };
        if (code >= 51 && code <= 57) return { icon: "🌦️", text: "霧雨" };
        if (code >= 61 && code <= 67) return { icon: "🌧️", text: "雨" };
        if (code >= 71 && code <= 77) return { icon: "❄️", text: "雪" };
        if (code >= 80 && code <= 82) return { icon: "☔", text: "にわか雨" };
        if (code >= 85 && code === 86) return { icon: "🌨️", text: "にわか雪" };
        if (code >= 95) return { icon: "⛈️", text: "雷雨" };
        return { icon: "🌡️", text: "不明" };
    }

    // お天気情報取得処理（Open-Meteo API）
    async function fetchWeather() {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_CONFIG.lat}&longitude=${WEATHER_CONFIG.lon}&current=temperature_2m,is_day,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=1`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("Weather fetch failed");
            const data = await res.json();

            const current = data.current;
            const daily = data.daily;
            const w = parseWeatherCode(current.weather_code, current.is_day === 1);

            weatherIcon.textContent = w.icon;
            weatherDesc.textContent = w.text;
            weatherTemp.textContent = `${current.temperature_2m.toFixed(1)}°C`;

            const maxT = Math.round(daily.temperature_2m_max[0]);
            const minT = Math.round(daily.temperature_2m_min[0]);
            weatherSub.textContent = `${WEATHER_CONFIG.name} 最高 ${maxT}° / 最低 ${minT}°`;
        } catch (e) {
            weatherDesc.textContent = "取得エラー";
            weatherSub.textContent = `${WEATHER_CONFIG.name}（再試行待ち）`;
        }
    }
    fetchWeather();
    setInterval(fetchWeather, 30 * 60 * 1000);

    // ボタンの表示状態を更新するヘルパー
    function updateButtonState(isPlaying) {
        if (!selector.value) {
            playToggleBtn.disabled = true;
            playToggleBtn.textContent = "▶ 再生";
            playToggleBtn.classList.remove('is-playing');
            return;
        }
        playToggleBtn.disabled = false;
        if (isPlaying) {
            playToggleBtn.textContent = "■ 停止";
            playToggleBtn.classList.add('is-playing');
        } else {
            playToggleBtn.textContent = "▶ 再生";
            playToggleBtn.classList.remove('is-playing');
        }
    }

    // ストリーム読み込み・再生処理
    function loadAndPlay(url) {
        if (hls) { hls.destroy(); hls = null; }
        audio.pause();
        audio.src = "";
        statusContainer.classList.remove('playing');

        if (!url) {
            statusText.textContent = "スタンバイ";
            currentStreamType = "";
            updateButtonState(false);
            return;
        }

        statusText.textContent = "接続中...";
        playToggleBtn.disabled = false;

        if (url.includes('.m3u8')) {
            currentStreamType = "HLS";
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    audio.play().then(() => onPlaySuccess("HLS")).catch(onPlayError);
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) onPlayError();
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.play().then(() => onPlaySuccess("HLS")).catch(onPlayError);
            }
        } else {
            currentStreamType = "MP3";
            audio.src = url;
            audio.play().then(() => onPlaySuccess("MP3")).catch(onPlayError);
        }
    }

    // 放送局切り替え処理
    selector.addEventListener('change', function() {
        if (this.value) {
            enterFullscreen();
            enableKeepAwake();
        }
        loadAndPlay(this.value);
    });

    // 再生 / 停止ボタンのクリック処理
    playToggleBtn.addEventListener('click', function() {
        const url = selector.value;
        if (!url) return;

        if (audio.paused) {
            enterFullscreen();
            enableKeepAwake();
            loadAndPlay(url);
        } else {
            audio.pause();
            statusText.textContent = "停止中";
            statusContainer.classList.remove('playing');
            updateButtonState(false);
            enableKeepAwake();
        }
    });

    // ブラウザ標準プレーヤー側の操作とも同期
    audio.addEventListener('play', () => {
        if (currentStreamType) {
            enableKeepAwake();
            onPlaySuccess(currentStreamType);
        }
    });

    audio.addEventListener('pause', () => {
        if (selector.value && statusText.textContent !== "エラー: 再生できません") {
            statusText.textContent = "停止中";
            statusContainer.classList.remove('playing');
            updateButtonState(false);
        }
    });

    // タイマー設定処理
    timerSelector.addEventListener('change', function() {
        const minutes = parseInt(this.value);
        clearInterval(sleepTimer);
        
        if (minutes === 0) {
            timerDisplay.textContent = "";
            return;
        }

        remainingTime = minutes * 60;
        updateTimerDisplay();

        sleepTimer = setInterval(() => {
            remainingTime--;
            updateTimerDisplay();

            if (remainingTime <= 0) {
                clearInterval(sleepTimer);
                audio.pause();
                disableKeepAwake();
                timerDisplay.textContent = "タイマー完了: 停止しました";
                statusText.textContent = "停止中";
                statusContainer.classList.remove('playing');
                updateButtonState(false);
                timerSelector.value = "0";
            }
        }, 1000);
    });

    function updateTimerDisplay() {
        const m = Math.floor(remainingTime / 60);
        const s = remainingTime % 60;
        timerDisplay.textContent = `タイマー残り: ${m}分${s.toString().padStart(2, '0')}秒`;
    }

    function onPlaySuccess(type) {
        statusText.textContent = `再生中 (${type})`;
        statusContainer.classList.add('playing');
        updateButtonState(true);
    }

    function onPlayError() {
        statusText.textContent = "エラー: 再生できません";
        statusContainer.classList.remove('playing');
        updateButtonState(false);
    }

    audio.addEventListener('error', onPlayError);
</script>

</body>
</html>
