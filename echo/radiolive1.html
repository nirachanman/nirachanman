<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>radiolive1</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --midnight-blue: #0b1120;
            --deep-navy: #162032;
            --border-blue: #3b4d6b;
            --soft-blue: #cbd5e1;
            --highlight-blue: #38bdf8;
            --white-blue: #ffffff;
            --date-color: #f1f5f9;
            --time-color: #fde047;
            --stop-red: #fca5a5;
            --stop-red-border: rgba(252, 165, 165, 0.7);
            --stop-red-bg: rgba(248, 113, 113, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', -apple-system, sans-serif;
            background-color: var(--midnight-blue);
            color: var(--white-blue);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-card {
            background: var(--deep-navy);
            width: 97vw;
            height: 94vh;
            height: 94dvh;
            padding: 18px 28px;
            border-radius: 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid var(--border-blue);
            display: grid;
            grid-template-columns: 1.05fr 1.15fr;
            gap: 28px;
            align-items: center;
        }

        /* 左カラム：タイトル＋画面維持・全画面ボタン・時計・天気・ステータス */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding-right: 24px;
            border-right: 2px solid rgba(59, 77, 107, 0.7);
        }

        .left-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            margin: 0;
            color: var(--highlight-blue);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .keep-awake-badge {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--soft-blue);
            background: rgba(11, 17, 32, 0.75);
            border: 1px solid var(--border-blue);
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .keep-awake-badge.is-on {
            color: #86efac;
            border-color: rgba(134, 239, 172, 0.5);
        }

        .fullscreen-btn {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--white-blue);
            background: rgba(56, 189, 248, 0.14);
            border: 1.5px solid var(--highlight-blue);
            padding: 5px 12px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .fullscreen-btn:active {
            transform: scale(0.96);
        }

        .fullscreen-btn.is-fullscreen {
            color: var(--time-color);
            border-color: rgba(253, 224, 71, 0.7);
            background: rgba(253, 224, 71, 0.12);
        }

        .clock-weather-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: auto 0;
            gap: 14px;
        }

        .live-clock {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .clock-date {
            color: var(--date-color);
            font-size: 2.55rem;
            font-weight: 700;
            letter-spacing: 0.04rem;
            line-height: 1.15;
            margin-bottom: 6px;
            font-variant-numeric: tabular-nums;
        }

        .clock-time {
            color: var(--time-color);
            font-size: 5.2rem;
            line-height: 1.0;
            text-shadow: 0 0 20px rgba(253, 224, 71, 0.25);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .weather-box {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(11, 17, 32, 0.7);
            border: 1.5px solid var(--border-blue);
            border-radius: 16px;
            padding: 12px 18px;
        }

        .weather-icon {
            font-size: 2.6rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .weather-main {
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--white-blue);
        }

        .weather-temp {
            color: var(--highlight-blue);
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .weather-sub {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--soft-blue);
            letter-spacing: 0.02rem;
        }

        .status-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--soft-blue);
            letter-spacing: 0.05rem;
        }

        .dot {
            width: 14px;
            height: 14px;
            background-color: var(--soft-blue);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .playing .dot {
            background-color: var(--highlight-blue);
            box-shadow: 0 0 12px var(--highlight-blue);
            animation: pulse 2s infinite;
        }

        .playing #statusText {
            color: var(--white-blue);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .timer-display {
            font-size: 1.2rem;
            color: var(--time-color);
            font-weight: 700;
        }

        /* 右カラム：選局 → スリープタイマー → 再生コントロールバー */
        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            height: 100%;
            gap: 12px;
        }

        .select-group {
            text-align: left;
        }

        label {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--soft-blue);
            margin-bottom: 8px;
            margin-left: 4px;
            letter-spacing: 0.05rem;
        }

        .select-container {
            position: relative;
        }

        select {
            width: 100%;
            padding: 15px 44px 15px 18px;
            background-color: var(--midnight-blue);
            border: 2px solid var(--border-blue);
            border-radius: 16px;
            color: var(--white-blue);
            font-size: 1.4rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            appearance: none;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: var(--highlight-blue);
        }

        /* 再生中の放送局セレクタ強調スタイル */
        .select-container.is-playing select {
            border-color: var(--time-color);
            background-color: rgba(253, 224, 71, 0.1);
            color: var(--time-color);
            box-shadow: 0 0 18px rgba(253, 224, 71, 0.22);
        }

        .select-container.is-playing::after {
            color: var(--time-color);
        }

        /* 現在再生中の放送局バナー */
        .now-playing-banner {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px 16px;
            border-radius: 14px;
            background: rgba(253, 224, 71, 0.14);
            border: 1.5px solid rgba(253, 224, 71, 0.65);
            color: var(--time-color);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.03rem;
        }

        .now-playing-banner.is-visible {
            display: flex;
        }

        .now-playing-label {
            flex-shrink: 0;
            background: var(--time-color);
            color: var(--midnight-blue);
            font-size: 0.95rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 8px;
        }

        .now-playing-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        select optgroup {
            background-color: #1e293b;
            color: #38bdf8;
            font-weight: 700;
            font-style: normal;
        }

        select option {
            background-color: #0b1120;
            color: #ffffff;
            font-weight: 600;
        }

        .select-container::after {
            content: '▼';
            font-size: 1.15rem;
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--highlight-blue);
            pointer-events: none;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(11, 17, 32, 0.75);
            padding: 14px 16px;
            border-radius: 18px;
            border: 1.5px solid var(--border-blue);
        }

        .play-toggle-btn {
            flex-shrink: 0;
            min-width: 150px;
            height: 62px;
            padding: 0 20px;
            border-radius: 14px;
            border: 2px solid var(--highlight-blue);
            background-color: rgba(56, 189, 248, 0.16);
            color: var(--highlight-blue);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .play-toggle-btn:active {
            transform: scale(0.97);
        }

        .play-toggle-btn.is-playing {
            border-color: var(--stop-red-border);
            background-color: var(--stop-red-bg);
            color: var(--stop-red);
        }

        .play-toggle-btn:disabled {
            border-color: var(--border-blue);
            background-color: rgba(30, 41, 59, 0.5);
            color: var(--soft-blue);
            opacity: 0.5;
            cursor: not-allowed;
        }

        audio {
            width: 100%;
            height: 48px;
            filter: invert(100%) hue-rotate(190deg) brightness(1.25);
            opacity: 0.85;
        }

        /* Echo Show 5 などの小型横画面（幅1060px以下 または 高さ620px以下）向けフィット調整 */
        @media (max-width: 1060px), (max-height: 620px) {
            .player-card {
                width: 97.5vw;
                height: 95dvh;
                padding: 12px 18px;
                border-radius: 18px;
                grid-template-columns: 1fr 1.15fr;
                gap: 16px;
            }

            .left-panel {
                padding-right: 16px;
            }

            h1 {
                font-size: 1.05rem;
                letter-spacing: 0.06rem;
            }

            .keep-awake-badge {
                font-size: 0.78rem;
                padding: 3px 8px;
            }

            .fullscreen-btn {
                font-size: 0.82rem;
                padding: 4px 9px;
            }

            .clock-weather-group {
                gap: 8px;
            }

            .clock-date {
                font-size: 1.65rem;
                margin-bottom: 2px;
            }

            .clock-time {
                font-size: 3.45rem;
            }

            .weather-box {
                gap: 10px;
                padding: 8px 12px;
                border-radius: 12px;
            }

            .weather-icon {
                font-size: 1.9rem;
            }

            .weather-main {
                gap: 8px;
                font-size: 1.15rem;
            }

            .weather-temp {
                font-size: 1.3rem;
            }

            .weather-sub {
                font-size: 0.92rem;
            }

            .status-indicator {
                font-size: 1rem;
                gap: 8px;
            }

            .dot {
                width: 11px;
                height: 11px;
            }

            .timer-display {
                font-size: 0.98rem;
            }

            .right-panel {
                gap: 8px;
            }

            label {
                font-size: 0.9rem;
                margin-bottom: 4px;
            }

            select {
                padding: 10px 36px 10px 14px;
                border-radius: 12px;
                font-size: 1.1rem;
            }

            .select-container::after {
                font-size: 0.95rem;
                right: 14px;
            }

            .now-playing-banner {
                margin-top: 6px;
                padding: 6px 12px;
                border-radius: 10px;
                font-size: 1rem;
                gap: 8px;
            }

            .now-playing-label {
                font-size: 0.78rem;
                padding: 2px 7px;
            }

            .control-row {
                gap: 10px;
                padding: 9px 12px;
                border-radius: 14px;
            }

            .play-toggle-btn {
                min-width: 112px;
                height: 46px;
                padding: 0 14px;
                border-radius: 10px;
                font-size: 1.05rem;
            }

            audio {
                height: 38px;
            }
        }

        /* 縦画面やスマホで開いた場合のフォールバック */
        @media (max-width: 760px) and (min-height: 621px) {
            html, body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .player-card {
                grid-template-columns: 1fr;
                height: auto;
                padding: 24px;
                gap: 24px;
                margin: 16px 0;
            }
            .left-panel {
                border-right: none;
                border-bottom: 2px solid var(--border-blue);
                padding-right: 0;
                padding-bottom: 20px;
                text-align: center;
                align-items: center;
            }
            .clock-date {
                font-size: 2rem;
            }
            .clock-time {
                font-size: 3.6rem;
            }
            .weather-box {
                justify-content: center;
                text-align: left;
            }
            .control-row {
                flex-direction: column;
            }
            .play-toggle-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="player-card">
    <!-- 左パネル：タイトル＋画面維持・全画面ボタン・時計・お天気・ステータス -->
    <div class="left-panel">
        <div class="left-header">
            <h1>📻 radiolive1</h1>
            <div class="header-controls">
                <span id="keepAwakeStatus" class="keep-awake-badge">画面維持: 起動中...</span>
                <button id="fullscreenBtn" type="button" class="fullscreen-btn">⛶ 全画面</button>

        </div>
        
        <div class="clock-weather-group">

        <div class="status-box">

    <!-- 右パネル：選局 → スリープタイマー → 再生コントロールバー -->
    <div class="right-panel">
        <div class="select-group">

            <div id="channelSelectContainer" class="select-container">

            </div>
            <div id="nowPlayingBanner" class="now-playing-banner">
                <span class="now-playing-label">再生中</span>

        <div class="select-group">
            <label for="timerSelector">スリープタイマー (Sleep Timer)</label>
            <div class="select-container">
                <select id="timerSelector">
                    <option value="0">OFF (タイマーなし)</option>
                    <option value="15">15 分</option>

        <div class="control-row">
            <button id="playToggleBtn" class="play-toggle-btn" disabled>▶ 再生</button>
            <audio id="player" controls></audio>

</div>

<!-- スリープ防止用の極小無音オーディオ -->
<audio id="silentKeeper" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

<script>
    const audio = document.getElementById('player');
    const silentKeeper = document.getElementById('silentKeeper');
    const selector = document.getElementById('channelSelector');
    const channelSelectContainer = document.getElementById('channelSelectContainer');
    const nowPlayingBanner = document.getElementById('nowPlayingBanner');
    const nowPlayingName = document.getElementById('nowPlayingName');
    const timerSelector = document.getElementById('timerSelector');
    const timerDisplay = document.getElementById('timerDisplay');
    const statusText = document.getElementById('statusText');
    const statusContainer = document.getElementById('statusContainer');
    const clockDate = document.getElementById('clockDate');
    const clockTime = document.getElementById('clockTime');
    const playToggleBtn = document.getElementById('playToggleBtn');
    const keepAwakeStatus = document.getElementById('keepAwakeStatus');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // お天気表示用要素と設定（盛岡市好摩駅周辺）
    const WEATHER_CONFIG = {
        name: "盛岡市好摩",
        lat: 39.8736,
        lon: 141.1748
    };
    const weatherIcon = document.getElementById('weatherIcon');
    const weatherDesc = document.getElementById('weatherDesc');
    const weatherTemp = document.getElementById('weatherTemp');
    const weatherSub = document.getElementById('weatherSub');
    
    let hls = null;
    let sleepTimer = null;
    let remainingTime = 0;
    let currentStreamType = "";
    let wakeLock = null;
    let keepAwakeEnabled = true;

    // 再生中の放送局強調表示を更新
    function updateNowPlayingHighlight(isPlaying) {
        const selectedOption = selector.options[selector.selectedIndex];
        const stationTitle = selectedOption ? selectedOption.textContent.trim() : "";

        if (isPlaying && selector.value && stationTitle) {
            channelSelectContainer.classList.add('is-playing');
            nowPlayingName.textContent = stationTitle;
            nowPlayingBanner.classList.add('is-visible');
        } else {
            channelSelectContainer.classList.remove('is-playing');
            nowPlayingName.textContent = "";
            nowPlayingBanner.classList.remove('is-visible');
        }
    }

    // 全画面表示の状態判定・切り替え処理
    function isFullscreenActive() {
        return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateFullscreenButton() {
        if (isFullscreenActive()) {
            fullscreenBtn.textContent = "✕ 解除";
            fullscreenBtn.classList.add('is-fullscreen');
        } else {
            fullscreenBtn.textContent = "⛶ 全画面";
            fullscreenBtn.classList.remove('is-fullscreen');
        }
    }

    async function toggleFullscreen() {
        const docEl = document.documentElement;
        try {
            if (!isFullscreenActive()) {
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen();
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    await document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        } catch (e) {
            // 端末・ブラウザ制限時は状態表示のみ同期
        } finally {
            updateFullscreenButton();
        }
    }

    fullscreenBtn.addEventListener('click', () => {
        enableKeepAwake();
        toggleFullscreen();
    });

    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

    // 画面スリープ防止（Wake Lock + 無音ループ再生）を有効化
    async function enableKeepAwake() {
        keepAwakeEnabled = true;
        let audioStarted = false;
        let wakeLockStarted = false;

        try {
            silentKeeper.volume = 0.01;
            await silentKeeper.play();
            audioStarted = true;
        } catch (e) {
            audioStarted = false;
        }

        if ('wakeLock' in navigator) {
            try {
                if (!wakeLock) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                }
                wakeLockStarted = true;
            } catch (e) {
                wakeLockStarted = false;
            }
        }

        if (audioStarted) {
            keepAwakeStatus.textContent = "画面維持: ON";
            keepAwakeStatus.classList.add('is-on');
        } else if (wakeLockStarted) {
            keepAwakeStatus.textContent = "画面維持: ON (タッチで強化)";
            keepAwakeStatus.classList.add('is-on');
        } else {
            keepAwakeStatus.textContent = "画面維持: 待機 (タッチでON)";
            keepAwakeStatus.classList.remove('is-on');
        }
    }

    // 画面スリープ防止を解除（スリープタイマー完了時用）
    function disableKeepAwake() {
        keepAwakeEnabled = false;
        silentKeeper.pause();
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
        keepAwakeStatus.textContent = "画面維持: OFF";
        keepAwakeStatus.classList.remove('is-on');
    }

    window.addEventListener('DOMContentLoaded', () => {
        enableKeepAwake();
        updateFullscreenButton();
    });

    function unlockOnFirstTouch() {
        if (keepAwakeEnabled && silentKeeper.paused) {
            enableKeepAwake();
        }
        if (!silentKeeper.paused) {
            document.removeEventListener('touchstart', unlockOnFirstTouch);
            document.removeEventListener('click', unlockOnFirstTouch);
        }
    }
    document.addEventListener('touchstart', unlockOnFirstTouch, { passive: true });
    document.addEventListener('click', unlockOnFirstTouch);

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && keepAwakeEnabled) {
            enableKeepAwake();
        }
    });

    const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
    function updateClock() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const day = weekDays[now.getDay()];
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        
        clockDate.textContent = `${yyyy}/${mm}/${dd} (${day})`;
        clockTime.textContent = `${hh}:${min}:${ss}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function parseWeatherCode(code, isDay) {
        if (code === 0) return { icon: isDay ? "☀️" : "🌙", text: "快晴" };
        if (code === 1) return { icon: isDay ? "🌤️" : "🌙", text: "晴れ" };
        if (code === 2) return { icon: "⛅", text: "晴れ時々くもり" };
        if (code === 3) return { icon: "☁️", text: "くもり" };
        if (code === 45 || code === 48) return { icon: "🌫️", text: "霧" };
        if (code >= 51 && code <= 57) return { icon: "🌦️", text: "霧雨" };
        if (code >= 61 && code <= 67) return { icon: "🌧️", text: "雨" };
        if (code >= 71 && code <= 77) return { icon: "❄️", text: "雪" };
        if (code >= 80 && code <= 82) return { icon: "☔", text: "にわか雨" };
        if (code >= 85 && code === 86) return { icon: "🌨️", text: "にわか雪" };
        if (code >= 95) return { icon: "⛈️", text: "雷雨" };
        return { icon: "🌡️", text: "不明" };
    }

    async function fetchWeather() {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_CONFIG.lat}&longitude=${WEATHER_CONFIG.lon}&current=temperature_2m,is_day,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=1`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("Weather fetch failed");
            const data = await res.json();

            const current = data.current;
            const daily = data.daily;
            const w = parseWeatherCode(current.weather_code, current.is_day === 1);

            weatherIcon.textContent = w.icon;
            weatherDesc.textContent = w.text;
            weatherTemp.textContent = `${current.temperature_2m.toFixed(1)}°C`;

            const maxT = Math.round(daily.temperature_2m_max[0]);
            const minT = Math.round(daily.temperature_2m_min[0]);
            weatherSub.textContent = `${WEATHER_CONFIG.name} 最高 ${maxT}° / 最低 ${minT}°`;
        } catch (e) {
            weatherDesc.textContent = "取得エラー";
            weatherSub.textContent = `${WEATHER_CONFIG.name}（再試行待ち）`;
        }
    }
    fetchWeather();
    setInterval(fetchWeather, 30 * 60 * 1000);

    function updateButtonState(isPlaying) {
        if (!selector.value) {
            playToggleBtn.disabled = true;
            playToggleBtn.textContent = "▶ 再生";
            playToggleBtn.classList.remove('is-playing');
            updateNowPlayingHighlight(false);
            return;
        }
        playToggleBtn.disabled = false;
        if (isPlaying) {
            playToggleBtn.textContent = "■ 停止";
            playToggleBtn.classList.add('is-playing');
            updateNowPlayingHighlight(true);
        } else {
            playToggleBtn.textContent = "▶ 再生";
            playToggleBtn.classList.remove('is-playing');
            updateNowPlayingHighlight(false);
        }
    }

    function loadAndPlay(url) {
        if (hls) { hls.destroy(); hls = null; }
        audio.pause();
        audio.src = "";
        statusContainer.classList.remove('playing');
        updateNowPlayingHighlight(false);

        if (!url) {
            statusText.textContent = "スタンバイ";
            currentStreamType = "";
            updateButtonState(false);
            return;
        }

        statusText.textContent = "接続中...";
        playToggleBtn.disabled = false;

        if (url.includes('.m3u8')) {
            currentStreamType = "HLS";
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    audio.play().then(() => onPlaySuccess("HLS")).catch(onPlayError);
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) onPlayError();
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.play().then(() => onPlaySuccess("HLS")).catch(onPlayError);
            }
        } else {
            currentStreamType = "MP3";
            audio.src = url;
            audio.play().then(() => onPlaySuccess("MP3")).catch(onPlayError);
        }
    }

    selector.addEventListener('change', function() {
        if (this.value) {
            enableKeepAwake();
        }
        loadAndPlay(this.value);
    });

    playToggleBtn.addEventListener('click', function() {
        const url = selector.value;
        if (!url) return;

        if (audio.paused) {
            enableKeepAwake();
            loadAndPlay(url);
        } else {
            audio.pause();
            statusText.textContent = "停止中";
            statusContainer.classList.remove('playing');
            updateButtonState(false);
            enableKeepAwake();
        }
    });

    audio.addEventListener('play', () => {
        if (currentStreamType) {
            enableKeepAwake();
            onPlaySuccess(currentStreamType);
        }
    });

    audio.addEventListener('pause', () => {
        if (selector.value && statusText.textContent !== "エラー: 再生できません") {
            statusText.textContent = "停止中";
            statusContainer.classList.remove('playing');
            updateButtonState(false);
        }
    });

    timerSelector.addEventListener('change', function() {
        const minutes = parseInt(this.value);
        clearInterval(sleepTimer);
        
        if (minutes === 0) {
            timerDisplay.textContent = "";
            return;
        }

        remainingTime = minutes * 60;
        updateTimerDisplay();

        sleepTimer = setInterval(() => {
            remainingTime--;
            updateTimerDisplay();

            if (remainingTime <= 0) {
                clearInterval(sleepTimer);
                audio.pause();
                disableKeepAwake();
                timerDisplay.textContent = "タイマー完了: 停止しました";
                statusText.textContent = "停止中";
                statusContainer.classList.remove('playing');
                updateButtonState(false);
                timerSelector.value = "0";
            }
        }, 1000);
    });

    function updateTimerDisplay() {
        const m = Math.floor(remainingTime / 60);
        const s = remainingTime % 60;
        timerDisplay.textContent = `タイマー残り: ${m}分${s.toString().padStart(2, '0')}秒`;
    }

    function onPlaySuccess(type) {
        statusText.textContent = `再生中 (${type})`;
        statusContainer.classList.add('playing');
        updateButtonState(true);
    }

    function onPlayError() {
        statusText.textContent = "エラー: 再生できません";
        statusContainer.classList.remove('playing');
        updateButtonState(false);
    }

    audio.addEventListener('error', onPlayError);
</script>
