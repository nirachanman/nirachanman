<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Stream Radio</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --bg-color: #0f172a;
  --card-bg: rgba(30, 41, 59, 0.7);
  --accent-color: #38bdf8;
  --text-main: #f1f5f9;
  --text-dim: #94a3b8;
  --timer-color: #fbbf24; /* タイマー用（オレンジ） */
}

body {
  font-family: 'Inter', "Segoe UI", system-ui, sans-serif;
  background-color: var(--bg-color);
  background-image: 
    radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
  margin: 0;
  padding: 20px;
  color: var(--text-main);
  min-height: 100vh;
}

h1 {
  text-align: center;
  font-size: 22px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
  color: var(--accent-color);
  text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
}

#player {
  position: sticky;
  top: 10px;
  z-index: 100;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 15px 20px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
  margin-bottom: 25px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

#nowPlaying {
  margin: 0 0 12px 0;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--accent-color);
}

audio {
  width: 100%;
  height: 35px;
  filter: invert(1) hue-rotate(180deg) brightness(1.5);
  margin-bottom: 15px;
}

/* タイマー設定エリア */
#timerControls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 12px;
}

select {
  background: #1e293b;
  color: var(--text-main);
  border: 1px solid var(--accent-color);
  border-radius: 4px;
  padding: 2px 5px;
  cursor: pointer;
}

#timerDisplay {
  color: var(--timer-color);
  font-weight: bold;
  min-width: 60px;
  text-align: center;
}

/* ステーションリスト */
#stationList {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  max-width: 900px;
  margin: 0 auto;
}

.station {
  background: var(--card-bg);
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 14px;
  color: var(--text-dim);
  min-height: 44px;
}

.station:hover {
  background: rgba(56, 189, 248, 0.1);
  border-color: var(--accent-color);
  color: var(--text-main);
}

.active {
  background: rgba(56, 189, 248, 0.2);
  border-color: var(--accent-color);
  color: var(--text-main);
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
  font-weight: bold;
}

@media (max-width: 480px) {
  #stationList { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<body>

<h1>📡 韮ちゃん Stream Radio</h1>

<div id="player">
  <div id="nowPlaying">STOPPED</div>
  <audio id="audio" controls preload="none"></audio>
  
  <div id="timerControls">
    <span>OFF TIMER:</span>
    <select id="timerSelect">
      <option value="0">OFF</option>
      <option value="15">15 min</option>
      <option value="30">30 min</option>
      <option value="60">60 min</option>
      <option value="90">90 min</option>
    </select>
    <div id="timerDisplay"></div>
  </div>
</div>

<div id="stationList"></div>

<script>
const stations = [
  { name: "NHK AM", url: "https://simul.drdi.st.nhk/live/8/joined/master.m3u8" },
  { name: "NHK FM", url: "https://simul.drdi.st.nhk/live/9/joined/master.m3u8" },
  { name: "101 Smooth Jazz", url: "https://jking.cdnstream1.com/b22139_128mp3" },
  { name: "J-Pop Sakura 懐かしい", url: "https://quincy.torontocast.com:2070/stream.mp3" },
  { name: "J1 GOLD 昭和", url: "https://jenny.torontocast.com:2000/stream/J1GOLD" },
  { name: "Gold Instrumental", url: "https://centova.svdns.com.br:19373/stream.mp3" },
  { name: "ラヂオもりおか", url: "https://mtist.as.smartstream.ne.jp/30017/livestream/chunklist.m3u8" },
  { name: "カシオペアFM", url: "https://mtist.as.smartstream.ne.jp/30050/livestream/chunklist.m3u8" },
  { name: "BeFM", url: "https://mtist.as.smartstream.ne.jp/30079/livestream/chunklist.m3u8" },
  { name: "鹿角きりたんぽFM", url: "https://mtist.as.smartstream.ne.jp/30089/livestream/chunklist.m3u8" }
];

const list = document.getElementById("stationList");
const audio = document.getElementById("audio");
const nowPlaying = document.getElementById("nowPlaying");
const timerSelect = document.getElementById("timerSelect");
const timerDisplay = document.getElementById("timerDisplay");

let hls = null;
let timerId = null;
let countdownId = null;
let remainingTime = 0;

// --- 初期化 ---
stations.forEach((st, i) => {
  const div = document.createElement("div");
  div.className = "station";
  div.textContent = st.name;
  div.onclick = () => playStation(i);
  list.appendChild(div);
});

// --- 再生ロジック ---
function playStation(index) {
  const st = stations[index];
  const url = st.url;
  const isHls = url.includes(".m3u8");

  nowPlaying.textContent = "▶ " + st.name;

  if (hls) { hls.destroy(); hls = null; }
  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  if (isHls) {
    if (audio.canPlayType("application/vnd.apple.mpegurl")) {
      audio.src = url;
      audio.play().catch(() => {});
    } else if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
    }
  } else {
    audio.src = url;
    audio.play().catch(() => {});
  }

  document.querySelectorAll(".station").forEach((el, i) => {
    el.classList.toggle("active", i === index);
  });
}

// --- タイマー処理 ---
timerSelect.onchange = function() {
  const minutes = parseInt(this.value);
  
  // 既存タイマーをクリア
  clearTimeout(timerId);
  clearInterval(countdownId);
  timerDisplay.textContent = "";

  if (minutes > 0) {
    remainingTime = minutes * 60;
    updateDisplay();
    
    // カウントダウン開始
    countdownId = setInterval(() => {
      remainingTime--;
      updateDisplay();
      if (remainingTime <= 0) {
        audio.pause();
        clearInterval(countdownId);
        timerDisplay.textContent = "Time Up";
        timerSelect.value = "0";
      }
    }, 1000);
  }
};

function updateDisplay() {
  const m = Math.floor(remainingTime / 60);
  const s = remainingTime % 60;
  timerDisplay.textContent = `${m}:${s.toString().padStart(2, '0')}`;
}
</script>

</body>
</html>
