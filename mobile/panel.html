<body>
  <div class="header">
    <img src="podcast.png" alt="podcast" class="header-icon">
    NHKラジオニュースを連続再生
  </div>

<div class="player-container">

  <div class="controls">
    <button id="next">戻る 🕰️</button>
    <div id="title" class="title">ニュースを選択してください</div>
    <button id="prev">⌚ 進む</button>
  </div>

  <div class="player-card">
    <audio id="audio" controls></audio>
  </div>

<div class="news-block">

  <div class="summary-scroll">
    <button id="refreshList">🔄 更新</button>
    <button id="liveButton">📡 らじる☆らじる</button>
    <a href="https://www.nhk.or.jp/radio/ondemand/"
       target="_blank"
       class="ondemand-button">▶️ 聴き逃し</a>
  </div>

  <div id="dateFilter" class="date-filter"></div>

  <div id="list" class="list"></div>

</div>

<script>
let items = [];
let index = -1;
let firstLoad = true;
let disabled = false;
let liveWindow = null;

/* -------------------------
   日付キー生成
------------------------- */
function toDateKey(pubDateStr) {
  const d = new Date(pubDateStr);
  if (isNaN(d)) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* -------------------------
   RSS取得
------------------------- */
async function fetchFeed() {
  const feedUrl = 'https://www.nhk.or.jp/s-media/news/podcast/list/v1/all.xml';
  try {
    const res = await fetch(feedUrl);
    const xml = await res.text();
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const entries = [...doc.querySelectorAll('item')];

    items = entries.map(e => {
      const title = e.querySelector('title').textContent;
      const url = e.querySelector('enclosure').getAttribute('url');
      const pub = e.querySelector('pubDate').textContent;
      return {
        title,
        url,
        pubDate: pub,
        dateKey: toDateKey(pub)
      };
    });

    document.getElementById('title').textContent = 'ニュースを選択してください';

    buildDateFilter();
    const firstBtn = document.querySelector('.date-btn');
    if (firstBtn) firstBtn.click();

  } catch (e) {
    alert('NHKラジオニュースの取得に失敗しました');
  }
}

/* -------------------------
   日付フィルタ生成
------------------------- */
function buildDateFilter() {
  const df = document.getElementById('dateFilter');
  df.innerHTML = '';

  const keys = [...new Set(items.map(it => it.dateKey))].sort((a,b)=>b.localeCompare(a));

  keys.forEach((k, i) => {
    const d = new Date(k);
    const label = `${d.getMonth()+1}月${d.getDate()}日(${['日','月','火','水','木','金','土'][d.getDay()]})`;

    const btn = document.createElement('button');
    btn.className = 'date-btn';
    btn.dataset.date = k;
    btn.textContent = label;
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');

    btn.onclick = () => {
      document.querySelectorAll('.date-btn').forEach(b => b.setAttribute('aria-selected','false'));
      btn.setAttribute('aria-selected','true');
      renderListForDate(k);
    };

    df.appendChild(btn);
  });
}

/* -------------------------
   日付別ニュース一覧
------------------------- */
function renderListForDate(dateKey) {
  const list = document.getElementById('list');
  list.innerHTML = '';

  const filtered = items.filter(it => it.dateKey === dateKey);

  filtered.forEach(item => {
    const div = document.createElement('div');

    const icon = document.createElement('span');
    icon.style.display = 'inline-flex';
    icon.style.alignItems = 'center';
    icon.style.justifyContent = 'center';
    icon.style.width = '32px';
    icon.style.height = '32px';

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', '32');
    svg.setAttribute('height', '32');

    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', 'M8 5v14l11-7z');
    path.setAttribute('fill', '#600080');

    svg.appendChild(path);
    icon.appendChild(svg);

    const titleSpan = document.createElement('span');
    titleSpan.textContent = item.title;

    div.appendChild(icon);
    div.appendChild(titleSpan);

    div.className = (items.indexOf(item) === index) ? 'active' : '';

    div.onclick = () => {
      if (disabled) return;
      firstLoad = false;
      index = items.indexOf(item);
      playCurrent();
    };

    list.appendChild(div);
  });
}

/* -------------------------
   再生処理
------------------------- */
function playCurrent() {
  const audio = document.getElementById('audio');
  const title = document.getElementById('title');

  audio.src = items[index].url;
  title.textContent = items[index].title;

  document.querySelector('.player-card').classList.add('active');

  if (!firstLoad) audio.play();

  updateListHighlight();
}

/* -------------------------
   再生中ハイライト
------------------------- */
function updateListHighlight() {
  document.querySelectorAll('.list div').forEach(div => div.classList.remove('active'));

  if (index >= 0 && items[index]) {
    const node = [...document.querySelectorAll('.list div')]
      .find(div => div.textContent.includes(items[index].title));
    if (node) node.classList.add('active');
  }
}

/* -------------------------
   前後ボタン
------------------------- */
document.getElementById('prev').onclick = () => {
  if (disabled) return;
  if (index > 0) {
    index--;
    playCurrent();
  } else alert('最初のニュースです');
};

document.getElementById('next').onclick = () => {
  if (disabled) return;
  if (index < items.length - 1) {
    index++;
    playCurrent();
  } else alert('最後のニュースです');
};

/* -------------------------
   再生終了時
------------------------- */
document.getElementById('audio').onended = () => {
  if (disabled) return;
  if (index > 0) {
    index--;
    playCurrent();
  } else alert('最新ニュースまで再生しました');
};

/* -------------------------
   更新
------------------------- */
document.getElementById('refreshList').onclick = fetchFeed;

/* -------------------------
   らじる☆らじる
------------------------- */
document.getElementById('liveButton').onclick = () => {
  const audio = document.getElementById('audio');
  audio.pause();

  disabled = true;
  document.getElementById('title').textContent = '停止中';

  index = -1;
  updateListHighlight();
  document.querySelector('.player-card').classList.remove('active');

  liveWindow = window.open('https://www.nhk.or.jp/radio/player/?ch=1', '_blank');

  const timer = setInterval(() => {
    if (liveWindow && liveWindow.closed) {
      disabled = false;
      document.getElementById('title').textContent = 'ニュースを選択してください';
      clearInterval(timer);
    }
  }, 1000);
};

/* ---------------------------------------------------
   ★ 追加：再生中ニュースを維持したまま自動更新
--------------------------------------------------- */
async function autoRefreshFeed() {
  const currentIndex = index;   // 再生中の index を保存
  await fetchFeed();            // フィード更新

  if (currentIndex >= 0 && items[currentIndex]) {
    index = currentIndex;       // index を復元
    updateListHighlight();      // ハイライト復元
  }
}

/* ★ 5分ごとに自動更新 */
setInterval(() => {
  autoRefreshFeed();
}, 300000);

fetchFeed();
</script>

</body>
