<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio LIVE Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
        }
        .top-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }
        header {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #1e3c72;
            letter-spacing: 1px;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 1rem;
            background-color: white;
            cursor: pointer;
        }
        audio {
            width: 100%;
            height: 50px;
        }
        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            min-height: 1.2em;
        }
        .note {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>
<body>

  <div class="top-section">
    <header id="header">Radio 「LIVE」</header>
    
    <select id="channelSelector">
      <option value="">放送局を選択してください</option>
      <optgroup label="Music Stations">
        <option value="https://jking.cdnstream1.com/b22139_128mp3">101 Smooth Jazz</option>
        <option value="https://quincy.torontocast.com:2070/stream.mp3">J-Pop Sakura 懐かしい</option>
        <option value="https://centova.svdns.com.br:19373/stream.mp3">Gold Instrumental</option>
      </optgroup>
      <optgroup label="NHK / Domestic">
        <option value="https://simul.drdi.st.nhk/live/8/joined/master.m3u8">NHKラジオ AM（仙台）</option>
        <option value="https://simul.drdi.st.nhk/live/3/joined/master.m3u8">NHKラジオ AM（東京）</option>
        <option value="https://simul.drdi.st.nhk/live/9/joined/master.m3u8">NHK FM（東京）</option>
      </optgroup>
      <optgroup label="Community FM">
        <option value="https://mtist.as.smartstream.ne.jp/30017/livestream/chunklist.m3u8">ラヂオもりおか</option>
        <option value="https://mtist.as.smartstream.ne.jp/30050/livestream/chunklist.m3u8">カシオペアFM</option>
        <option value="https://mtist.as.smartstream.ne.jp/30079/livestream/playlist.m3u8">BeFM</option>
      </optgroup>
    </select>
    
    <audio id="player" controls></audio>
    <div id="status" class="status">Waiting for selection...</div>
    <div class="note">※一部の局は再生開始まで数秒かかります</div>
  </div>

  <script>
    const audio = document.getElementById('player');
    const selector = document.getElementById('channelSelector');
    const status = document.getElementById('status');
    let hls = null;

    selector.addEventListener('change', function() {
      const url = this.value;
      if (!url) return;

      status.textContent = "Connecting...";
      
      // 以前のHLSインスタンスをクリア
      if (hls) {
        hls.destroy();
        hls = null;
      }
      audio.pause();
      audio.src = "";

      // URLが .m3u8 を含むかどうかで切り替え
      if (url.includes('.m3u8')) {
        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(audio);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            audio.play().catch(e => console.error("Play error:", e));
            status.textContent = "Playing: HLS Stream";
          });
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) status.textContent = "Error: Cannot load HLS";
          });
        } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
          audio.src = url;
          audio.play();
        }
      } else {
        // 通常のMP3ストリーミングの場合
        audio.src = url;
        audio.play()
          .then(() => {
            status.textContent = "Playing: MP3 Stream";
          })
          .catch(e => {
            status.textContent = "Error: Access Blocked (CORS)";
            console.error("Audio error:", e);
          });
      }
    });
  </script>
</body>
</html>
