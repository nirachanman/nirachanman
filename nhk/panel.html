<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHKラジオニュース</title>

  <style>
    /* -------------------------
       基本レイアウト
    ------------------------- */
    body {
      margin: 0;
      font-family: sans-serif;
      background: #80ABA9;
      color: #000080;
      padding: 6px;
      font-size: 14px;
      height: 100vh;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* -------------------------
       ヘッダー
    ------------------------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #B2EBF2;
      color: #004D40;
      padding: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    /* -------------------------
       コントロールボタン
    ------------------------- */
    .controls {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }

    .title {
      flex: 1;
      text-align: center;
      padding: 4px 0;
      font-size: 15px;
      font-weight: bold;
    }

    button {
      background: #00AA55;
      color: #000080;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      min-width: 64px;
    }

    button:hover {
      background: #00BCD4;
    }

    /* -------------------------
       音声プレイヤー
    ------------------------- */
    audio {
      width: 100%;
      height: 40px;
      margin-bottom: 6px;
    }

    /* -------------------------
       ニュース一覧 summary
    ------------------------- */

    /* 標準の黒い ▼ を消す */
    summary {
      list-style: none;
    }
    summary::-webkit-details-marker {
      display: none;
    }

    summary {
      cursor: pointer;
      padding: 10px;
      background: #B2EBF2;
      color: #004D40;
      border: 2px solid #4DD0E1;
      border-radius: 8px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    /* 📂 / 📁 アイコン */
    .summary-icon {
      font-size: 18px;
      margin-right: 6px;
    }

    /* 閉じている時：📂 */
    details:not([open]) .summary-icon::before {
      content: "📂";
    }

    /* 開いている時：📁 */
    details[open] .summary-icon::before {
      content: "📁";
    }

    #refreshList, #liveButton {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    #refreshList {
      background: #4DD0E1;
      color: #004D40;
    }
    #refreshList:hover {
      background: #00BCD4;
    }

    #liveButton {
      background: #FFB74D;
      color: #4E342E;
    }
    #liveButton:hover {
      background: #FF9800;
    }

    .list {
      max-height: none;
      overflow-y: auto;
      margin-top: 6px;
      background: #B0C4DE;
      -webkit-overflow-scrolling: touch;
    }

    .list div {
      padding: 8px 6px;
      line-height: 1.4;
      font-size: 14px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .list .active {
      font-weight: bold;
      color: #D2691E;
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="podcast.png" alt="NHKロゴ" class="header-icon">
    NHKラジオニュース
  </div>

  <div class="controls">
    <button id="prev">◀ 前</button>
    <div id="title" class="title"></div>
    <button id="next">次 ▶</button>
  </div>

  <audio id="audio" controls></audio>

  <details open>
    <summary>
      <span class="summary-icon"></span>
      <span>ニュース一覧</span>
      <button id="refreshList">🔄 更新</button>
      <button id="liveButton">📡 NHK第1</button>
    </summary>

    <div id="list" class="list"></div>
  </details>

  <script>
    let items = [];
    let index = 0;

    async function fetchFeed() {
      const feedUrl = 'https://www.nhk.or.jp/s-media/news/podcast/list/v1/all.xml';
      try {
        const res = await fetch(feedUrl);
        const xml = await res.text();
        const doc = new DOMParser().parseFromString(xml, 'text/xml');
        const entries = [...doc.querySelectorAll('item')];
        items = entries.map(e => ({
          title: e.querySelector('title').textContent,
          url: e.querySelector('enclosure').getAttribute('url')
        }));
        playCurrent();
      } catch (e) {
        alert('NHKラジオニュースの取得に失敗しました');
      }
    }

    function playCurrent() {
      const audio = document.getElementById('audio');
      const title = document.getElementById('title');
      audio.src = items[index].url;
      title.textContent = items[index].title;
      audio.play();
      updateList();
    }

    function updateList() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      items.forEach((item, i) => {
        const div = document.createElement('div');
        div.textContent = (i === index ? '▶ ' : '') + item.title;
        div.className = i === index ? 'active' : '';
        div.onclick = () => {
          index = i;
          playCurrent();
        };
        list.appendChild(div);
      });
    }

    document.getElementById('prev').onclick = () => {
      if (index > 0) {
        index--;
        playCurrent();
      } else {
        alert('最初のニュースです');
      }
    };

    document.getElementById('next').onclick = () => {
      if (index < items.length - 1) {
        index++;
        playCurrent();
      } else {
        alert('最後のニュースです');
      }
    };

    document.getElementById('audio').onended = () => {
      if (index < items.length - 1) {
        index++;
        playCurrent();
      } else {
        alert('すべてのニュースの再生が完了しました');
      }
    };

    document.getElementById('refreshList').onclick = async () => {
      await fetchFeed();
      playCurrent();
    };

    document.getElementById('liveButton').onclick = () => {
      window.open('https://www.nhk.or.jp/radio/player/?ch=1', '_blank');
    };

    fetchFeed();
  </script>
</body>
</html>
