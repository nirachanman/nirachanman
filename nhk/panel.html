<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHKラジオニュース</title>

  <style>
    /* スマホ最適化済み CSS（前回のバージョンと同じ） */
    body {
      margin: 0;
      font-family: sans-serif;
      background: #80ABA9;
      color: #000080;
      padding: 6px;
      font-size: 14px;
      height: 100vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #B2EBF2;
      color: #004D40;
      padding: 8px;
      font-weight: bold;
      font-size: 16px;
    }
    .header-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }
    .title {
      flex: 1;
      text-align: center;
      padding: 4px 0;
      font-size: 15px;
      font-weight: bold;
    }
    button {
      background: #00AA55;
      color: #000080;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      min-width: 64px;
    }
    button:hover {
      background: #00BCD4;
    }
    audio {
      width: 100%;
      height: 40px;
      margin-bottom: 6px;
    }
    summary {
      cursor: pointer;
      padding: 10px;
      background: #B2EBF2;
      color: #004D40;
      border: 2px solid #4DD0E1;
      border-radius: 8px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }
    #refreshList, #liveButton {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 8px;
    }
    #refreshList {
      background: #4DD0E1;
      color: #004D40;
    }
    #refreshList:hover {
      background: #00BCD4;
    }
    #liveButton {
      background: #FFB74D;
      color: #4E342E;
    }
    #liveButton:hover {
      background: #FF9800;
    }
    .list {
      max-height: none;
      overflow-y: auto;
      margin-top: 6px;
      background: #B0C4DE;
      -webkit-overflow-scrolling: touch;
    }
    .list div {
      padding: 8px 6px;
      line-height: 1.4;
      font-size: 14px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    .list .active {
      font-weight: bold;
      color: #D2691E;
    }
  </style>
</head>
