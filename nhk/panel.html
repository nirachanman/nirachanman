<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NHKラジオニュース</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, sans-serif;
    background: #fafafa;
    color: #222;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
  }

  header img {
    width: 42px;
    height: 42px;
  }

  header h1 {
    font-size: 1.25rem;
    margin: 0;
    font-weight: 600;
  }

  .container {
    padding: 16px;
  }

  .info {
    font-size: 1rem;
    margin-bottom: 12px;
  }

  .time {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 20px;
    color: #d9534f;
  }

  /* ボタン */
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    font-size: 1.1rem;
    text-align: center;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }

  .btn-primary {
    background: #0275d8;
    color: #fff;
  }

  .btn-secondary {
    background: #f7f7f7;
    border: 1px solid #ccc;
  }

  /* スマホ向けのタップしやすい領域 */
  @media (max-width: 480px) {
    header h1 {
      font-size: 1.1rem;
    }
    .btn {
      font-size: 1.05rem;
      padding: 16px;
    }
  }
</style>
</head>

<body>

<header>
  <!-- ★ あなたがアップロードした podcast.png の Base64 を埋め込み ★ -->
  <img src="data:image/png;base64,
【ここにあなたの Base64 全文を貼り付け】
  " alt="Podcast Icon" />
  <h1>NHKラジオニュース</h1>
</header>

<div class="container">
  <div class="info">最新のニュース開始時刻</div>
  <div id="newsTime" class="time">--:--</div>

  <button class="btn btn-primary" id="btnReload">更新</button>
  <button class="btn btn-secondary" id="btnOpenNHK">NHKサイトを開く</button>
</div>

<script>
  // ニュース開始時刻の表示ロジック（あなたの既存仕様に合わせて簡潔化）
  function updateNewsTime() {
    chrome.runtime.sendMessage({ type: "getNewsTime" }, (res) => {
      if (!res || !res.time) {
        document.getElementById("newsTime").textContent = "--:--";
        return;
      }
      document.getElementById("newsTime").textContent = res.time;
    });
  }

  document.getElementById("btnReload").addEventListener("click", updateNewsTime);

  document.getElementById("btnOpenNHK").addEventListener("click", () => {
    chrome.tabs.create({ url: "https://www3.nhk.or.jp/news/" });
  });

  updateNewsTime();
</script>

</body>
</html>
