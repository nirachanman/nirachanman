<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>NHKラジオ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top-section">
    <header id="header">ラジオ「LIVE」</header>
    <select id="channelSelector">
      <option value="">Radio station:選択</option>
      <option value="https://simul.drdi.st.nhk/live/8/joined/master.m3u8">NHKラジオ AM（仙台）</option>
      <option value="https://simul.drdi.st.nhk/live/3/joined/master.m3u8">NHKラジオ AM（東京）</option>
      <option value="https://simul.drdi.st.nhk/live/9/joined/master.m3u8">NHK FM（東京）</option>
      <option value="https://mtist.as.smartstream.ne.jp/30017/livestream/chunklist.m3u8">ラヂオもりおか</option>
      <option value="https://mtist.as.smartstream.ne.jp/30050/livestream/chunklist.m3u8">カシオペアFM/岩手県二戸市</option>
      <option value="https://mtist.as.smartstream.ne.jp/30079/livestream/playlist.m3u8">BeFM/青森県八戸市</option>
      <option value="http://mtist.as.smartstream.ne.jp/30089/livestream/playlist.m3u8">鹿角きりたんぽFM/秋田県鹿角市</option>
      <option value="https://simul.drdi.st.nhk/live/3/joined/master.m3u8">NHKラジオAM 東京</option>
    </select>
    <audio id="player" controls></audio>
  </div>

  <hr />

  <div class="bottom-section">
    <div class="header">
      <img src="podcast.png" alt="NHKロゴ" class="header-icon" />
      NHKラジオニュース
    </div>

    <div class="controls">
      <button id="prev">◀ 前</button>
      <div id="title" class="title"></div>
      <button id="next">次 ▶</button>
    </div>

    <audio id="audio" controls></audio>

    <details open>
      <summary class="news-summary">
        <span>▶ ニュース一覧</span>
        <label class="auto-next-toggle">
          <input type="checkbox" id="autoNextCheckbox" />
          次を自動再生
        </label>
      </summary>
      <div id="list" class="list"></div>
    </details>
  </div>

  <script src="hls.min.js"></script>
  <script src="sidebar.js"></script>
  <script src="panel.js"></script>
</body>
</html>
