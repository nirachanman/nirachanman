<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>NHKラジオニュース</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="player">
    <div id="header">
      <span>NHKラジオニュース</span>
      <div>
        <button id="minimize">−</button>
        <button id="close">×</button>
      </div>
    </div>
    <div id="body">
      <div id="controls">
        <button id="prev">◀</button>
        <span id="title">読み込み中...</span>
        <button id="next">▶</button>
      </div>
      <audio id="audio" controls></audio>
      <details id="listFold" open>
        <summary>▶ ニュース一覧</summary>
        <div id="list"></div>
      </details>
      <div id="settings">
        <label><input type="checkbox" id="autoPlay"> 自動連続再生</label>
      </div>
    </div>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
