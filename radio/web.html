<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NHKラジオ（Web版）</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/libs/hls.min.js"></script>
  <script type="module" src=".js/app-web.js"></script>

</head>
<body>
  <header>
    <h1>NHKラジオ（Web版）</h1>
    <button id="settings-btn" title="設定">⚙</button>
  </header>

  <nav>
    <button id="tab-live" class="active">ライブ</button>
    <button id="tab-news">ニュース</button>
  </nav>

  <main>
    <!-- ライブパネル -->
    <section id="live-panel">
      <div class="section-header">
        <span>ライブ放送</span>
        <label><input type="checkbox" id="live-autoplay-player" /> 自動再生</label>
      </div>

      <div id="live-now">未再生</div>

      <div class="controls">
        <button id="live-play">▶️</button>
        <button id="live-stop">⏹️</button>
      </div>

      <ul id="live-list"></ul>
    </section>

    <!-- ニュースパネル -->
    <section id="news-panel" class="hidden">
      <div class="section-header">
        <span>定時ニュース</span>
        <label><input type="checkbox" id="news-autoplay-player" /> 自動再生</label>
      </div>

      <div class="controls">
        <button id="news-play">▶️</button>
        <button id="news-stop">⏹️</button>
        <button id="news-prev">⏮️</button>
        <button id="news-next">⏭️</button>
      </div>

      <ul id="news-list"></ul>
    </section>
  </main>
</body>
</html>
