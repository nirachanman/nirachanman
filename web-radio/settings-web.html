<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NHKラジオ設定（Web版）</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ヘッダー（web.html と統一） -->
  <header>
    <h1>NHKラジオ設定</h1>
  </header>

  <!-- カード：自動再生設定 -->
  <section class="card">
    <h2 class="card-title">自動再生</h2>

    <label class="setting-item">
      <input type="checkbox" id="live-autoplay-setting" />
      ライブ自動再生
    </label>
  </section>

  <!-- カード：ステーション追加 -->
  <section class="card">
    <h2 class="card-title">ステーション追加</h2>

    <div class="row">
      <input type="text" id="station-name" placeholder="表示名（例: NHK盛岡）" />
      <input type="text" id="station-url" placeholder="ストリームURL（.m3u8 または .mp3）" />
      <input type="text" id="station-region" placeholder="地域（例: 岩手）" />
    </div>

    <button id="add-station" class="primary-btn">追加</button>
  </section>

  <!-- カード：登録済みステーション -->
  <section class="card">
    <h2 class="card-title">登録済みステーション</h2>
    <div id="station-list"></div>
  </section>

  <script type="module" src="js/settings-web.js"></script>
</body>
</html>
