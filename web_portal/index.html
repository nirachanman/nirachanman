<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ Webブックマーク</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.4); border-radius: 20px; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200 flex flex-col">

  <!-- ヘッダーエリア -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <!-- ロゴ＆タイトル -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
          <i class="fa-solid fa-bookmark text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight text-gray-900 dark:text-white">WebBookmark</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400 hidden sm:block">自分専用お気に入りリンク集</p>
        </div>
      </div>

      <!-- アクションボタン -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- 追加ボタン -->
        <button onclick="openModal()" class="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm px-3.5 py-2 rounded-xl transition shadow-sm hover:shadow-md active:scale-95">
          <i class="fa-solid fa-plus text-xs"></i>
          <span class="hidden sm:inline">ブックマーク追加</span>
        </button>

        <!-- インポート・エクスポート -->
        <div class="relative group">
          <button class="p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition" title="バックアップと復元">
            <i class="fa-solid fa-ellipsis-vertical text-base"></i>
          </button>
          <div class="absolute right-0 top-full mt-1 w-48 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 py-1 hidden group-hover:block z-50">
            <button onclick="exportData()" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2">
              <i class="fa-solid fa-file-export text-xs"></i> JSON保存 (書き出し)
            </button>
            <label class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2 cursor-pointer">
              <i class="fa-solid fa-file-import text-xs"></i> JSON復元 (読み込み)
              <input type="file" id="importInput" accept=".json" onchange="importData(event)" class="hidden">
            </label>
          </div>
        </div>

        <!-- ダークモード切り替え -->
        <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full flex flex-col md:flex-row gap-6">

    <!-- サイドバー：カテゴリ＆検索 -->
    <aside class="w-full md:w-64 shrink-0 space-y-6">
      <!-- 検索バー -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="キーワードで検索..." 
          class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition placeholder-gray-400 dark:placeholder-gray-500">
      </div>

      <!-- カテゴリ一覧 -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 border border-gray-200 dark:border-gray-700/60 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">カテゴリ一覧</h2>
          <span id="totalCount" class="text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-full font-medium">0</span>
        </div>
        <nav id="categoryList" class="space-y-1">
          <!-- JSで動的に動くカテゴリ項目 -->
        </nav>
      </div>
    </aside>

    <!-- ブックマーク表示部分 -->
    <section class="flex-1 space-y-4">
      <div class="flex items-center justify-between">
        <h2 id="activeCategoryTitle" class="text-lg font-bold text-gray-900 dark:text-white">すべて</h2>
        <div class="text-sm text-gray-500 dark:text-gray-400" id="resultStats">0 件表示中</div>
      </div>

      <!-- グリッドカード一覧 -->
      <div id="bookmarksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JSでカードを動的に生成 -->
      </div>

      <!-- 空の状態（検索結果が0件のとき） -->
      <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center bg-white dark:bg-gray-800 rounded-2xl border border-dashed border-gray-300 dark:border-gray-700 p-8">
        <div class="w-16 h-16 rounded-full bg-brand-50 dark:bg-gray-700 text-brand-600 dark:text-brand-400 flex items-center justify-center mb-4 text-2xl">
          <i class="fa-solid fa-folder-open"></i>
        </div>
        <h3 class="text-base font-semibold text-gray-900 dark:text-white">該当するブックマークがありません</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 max-w-xs">別のキーワードで検索するか、新しいブックマークを追加してください。</p>
        <button onclick="openModal()" class="mt-4 inline-flex items-center gap-2 text-sm font-medium text-brand-600 dark:text-brand-400 hover:underline">
          <i class="fa-solid fa-plus text-xs"></i> 最初のブックマークを追加
        </button>
      </div>
    </section>
  </main>

  <!-- モーダル（追加/編集フォーム） -->
  <div id="modalBackdrop" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 hidden transition-opacity flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 w-full max-w-md overflow-hidden transform transition-all">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-700">
        <h3 id="modalTitle" class="font-bold text-gray-900 dark:text-white">ブックマークを追加</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="bookmarkForm" onsubmit="saveBookmark(event)" class="p-6 space-y-4">
        <input type="hidden" id="bookmarkId">
        
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">URL <span class="text-red-500">*</span></label>
          <input type="url" id="formUrl" required placeholder="https://example.com" onchange="autoFillTitle(this.value)"
            class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none dark:text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">タイトル <span class="text-red-500">*</span></label>
          <input type="text" id="formTitle" required placeholder="サイトのタイトル"
            class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none dark:text-white">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">カテゴリ</label>
            <select id="formCategory" 
              class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none dark:text-white">
              <option value="情報">情報</option>
              <option value="インターネット">インターネット</option>
              <option value="日常">日常</option>
              <option value="学習|プログラミング">学習|プログラミング</option>
              <option value="エンタメ">エンタメ</option>
              <option value="趣味">趣味</option>
              <option value="後で読む">後で読む</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">タグ</label>
            <input type="text" id="formTag" placeholder="例: ツール, 参考"
              class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none dark:text-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">メモ (任意)</label>
          <textarea id="formNote" rows="3" placeholder="簡単な説明や覚えておきたいメモ..."
            class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none dark:text-white resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl">キャンセル</button>
          <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-xl transition shadow">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 通知トースト -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white dark:bg-white dark:text-gray-900 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium pointer-events-none">
    <i id="toastIcon" class="fa-solid fa-circle-check text-green-400 dark:text-green-600"></i>
    <span id="toastMessage">保存しました</span>
  </div>

  <!-- JavaScript制御ロジック -->
  <script>
    // 初期用日本語サンプルデータ
    const defaultBookmarks = [
      { id: '1', title: 'GitHub', url: 'https://github.com', category: 'プログラミング', tag: 'コード', note: '世界最大の開発者向けプラットフォーム', createdAt: Date.now() - 500000 },
      { id: '2', title: 'Tailwind CSS', url: 'https://tailwindcss.com', category: 'デザイン', tag: 'CSS', note: 'ユーティリティファーストのCSSフレームワーク公式', createdAt: Date.now() - 400000 },
      { id: '3', title: 'Figma', url: 'https://figma.com', category: 'デザイン', tag: 'UI/UX', note: 'ブラウザで動くリアルタイムデザインツール', createdAt: Date.now() - 300000 },
      { id: '4', title: 'Notion', url: 'https://notion.so', category: '情報', tag: '生産性', note: 'メモ・ドキュメント・タスクをまとめる万能ワークスペース', createdAt: Date.now() - 200000 },
      { id: '5', title: 'YouTube', url: 'https://youtube.com', category: '趣味', tag: '動画', note: '動画コンテンツ・ライブ配信', createdAt: Date.now() - 100000 }
    ];

    let bookmarks = [];
    let selectedCategory = 'すべて';
    let searchQuery = '';

    window.onload = function() {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-base';
      }

      const stored = localStorage.getItem('my_web_bookmarks_ja');
      if (stored) {
        try {
          bookmarks = JSON.parse(stored);
        } catch(e) {
          bookmarks = defaultBookmarks;
        }
      } else {
        bookmarks = defaultBookmarks;
        saveToLocalStorage();
      }

      renderApp();
    };

    function saveToLocalStorage() {
      localStorage.setItem('my_web_bookmarks_ja', JSON.stringify(bookmarks));
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-moon text-base' : 'fa-solid fa-sun text-base';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function renderApp() {
      renderCategories();
      renderBookmarks();
    }

    // ★日本語カテゴリ設定箇所
    function renderCategories() {
      const categories = ['すべて', '情報', 'インターネット', '日常', '学習|プログラミング', 'エンタメ', '趣味', '後で読む'];
      const categoryList = document.getElementById('categoryList');
      document.getElementById('totalCount').innerText = bookmarks.length;

      categoryList.innerHTML = categories.map(cat => {
        const count = cat === 'すべて' ? bookmarks.length : bookmarks.filter(b => b.category === cat).length;
        const isActive = selectedCategory === cat;
        return `
          <button onclick="selectCategory('${cat}')" 
            class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition ${
              isActive 
                ? 'bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400' 
                : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700/50'
            }">
            <span>${cat}</span>
            <span class="text-xs ${isActive ? 'bg-brand-100 dark:bg-brand-800 text-brand-700 dark:text-brand-300' : 'bg-gray-100 dark:bg-gray-700 text-gray-500'} px-2 py-0.5 rounded-full">${count}</span>
          </button>
        `;
      }).join('');
    }

    function renderBookmarks() {
      const grid = document.getElementById('bookmarksGrid');
      const emptyState = document.getElementById('emptyState');
      const categoryTitle = document.getElementById('activeCategoryTitle');
      const stats = document.getElementById('resultStats');

      categoryTitle.innerText = selectedCategory;

      const filtered = bookmarks.filter(b => {
        const matchesCategory = selectedCategory === 'すべて' || b.category === selectedCategory;
        const query = searchQuery.toLowerCase();
        const matchesSearch = !query || 
          b.title.toLowerCase().includes(query) || 
          b.url.toLowerCase().includes(query) || 
          (b.note && b.note.toLowerCase().includes(query)) ||
          (b.tag && b.tag.toLowerCase().includes(query));
        return matchesCategory && matchesSearch;
      });

      stats.innerText = `${bookmarks.length} 件中 ${filtered.length} 件表示`;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      grid.innerHTML = filtered.map(b => {
        const domain = getDomain(b.url);
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
        
        return `
          <div class="group bg-white dark:bg-gray-800 rounded-2xl p-4 border border-gray-200 dark:border-gray-700/70 shadow-sm hover:shadow-md transition flex flex-col justify-between relative">
            <div>
              <div class="flex items-start justify-between gap-3 mb-2">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-gray-700 p-1.5 flex items-center justify-center shrink-0">
                    <img src="${faviconUrl}" alt="${b.title}" class="w-5 h-5 object-contain" onerror="this.src='https://placehold.co/32x32/6366f1/ffffff?text=B'">
                  </div>
                  <div>
                    <h3 class="font-semibold text-gray-900 dark:text-white text-sm line-clamp-1 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition">${escapeHtml(b.title)}</h3>
                    <p class="text-xs text-gray-400 line-clamp-1">${domain}</p>
                  </div>
                </div>
                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                  <button onclick="editBookmark('${b.id}')" class="p-1.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="編集">
                    <i class="fa-solid fa-pen text-xs"></i>
                  </button>
                  <button onclick="deleteBookmark('${b.id}')" class="p-1.5 text-gray-400 hover:text-red-500 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="削除">
                    <i class="fa-solid fa-trash text-xs"></i>
                  </button>
                </div>
              </div>
              ${b.note ? `<p class="text-xs text-gray-600 dark:text-gray-300 my-2 line-clamp-2">${escapeHtml(b.note)}</p>` : ''}
            </div>

            <div class="pt-3 mt-2 border-t border-gray-100 dark:border-gray-700/50 flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-medium bg-gray-100 dark:bg-gray-700/70 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-md">${b.category}</span>
                ${b.tag ? `<span class="text-[11px] text-gray-400 dark:text-gray-500">#${escapeHtml(b.tag)}</span>` : ''}
              </div>
              <a href="${b.url}" target="_blank" rel="noopener noreferrer" class="text-xs text-brand-600 dark:text-brand-400 hover:underline font-medium inline-flex items-center gap-1">
                開く <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderApp();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value;
      renderBookmarks();
    }

    function openModal(editId = null) {
      const modal = document.getElementById('modalBackdrop');
      const form = document.getElementById('bookmarkForm');
      const modalTitle = document.getElementById('modalTitle');
      form.reset();

      if (editId) {
        const item = bookmarks.find(b => b.id === editId);
        if (item) {
          document.getElementById('bookmarkId').value = item.id;
          document.getElementById('formTitle').value = item.title;
          document.getElementById('formUrl').value = item.url;
          document.getElementById('formCategory').value = item.category;
          document.getElementById('formTag').value = item.tag || '';
          document.getElementById('formNote').value = item.note || '';
          modalTitle.innerText = 'ブックマークを編集';
        }
      } else {
        document.getElementById('bookmarkId').value = '';
        modalTitle.innerText = 'ブックマークを追加';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    function autoFillTitle(url) {
      const titleInput = document.getElementById('formTitle');
      if (!titleInput.value && url) {
        const domain = getDomain(url);
        if (domain) {
          titleInput.value = domain.split('.')[0].toUpperCase();
        }
      }
    }

    function saveBookmark(e) {
      e.preventDefault();
      const id = document.getElementById('bookmarkId').value;
      const title = document.getElementById('formTitle').value;
      let url = document.getElementById('formUrl').value;
      const category = document.getElementById('formCategory').value;
      const tag = document.getElementById('formTag').value;
      const note = document.getElementById('formNote').value;

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      if (id) {
        const index = bookmarks.findIndex(b => b.id === id);
        if (index !== -1) {
          bookmarks[index] = { ...bookmarks[index], title, url, category, tag, note };
          showToast('ブックマークを更新しました');
        }
      } else {
        const newBookmark = {
          id: Date.now().toString(),
          title,
          url,
          category,
          tag,
          note,
          createdAt: Date.now()
        };
        bookmarks.unshift(newBookmark);
        showToast('ブックマークを追加しました');
      }

      saveToLocalStorage();
      closeModal();
      renderApp();
    }

    function editBookmark(id) { openModal(id); }

    function deleteBookmark(id) {
      bookmarks = bookmarks.filter(b => b.id !== id);
      saveToLocalStorage();
      renderApp();
      showToast('削除しました');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bookmarks, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `bookmarks_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('JSONファイルを出力しました');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            bookmarks = imported;
            saveToLocalStorage();
            renderApp();
            showToast('ブックマークを取り込みました！');
          } else {
            showToast('フォーマットが正しくありません');
          }
        } catch(err) {
          showToast('ファイルの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
    }

    function getDomain(urlStr) {
      try {
        const url = new URL(urlStr.startsWith('http') ? urlStr : 'https://' + urlStr);
        return url.hostname.replace('www.', '');
      } catch (e) {
        return urlStr;
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3000);
    }
  </script>
</body>
</html>
