<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ Webブックマーク (GitHub同期版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.4); border-radius: 20px; }
    .dragging { opacity: 0.4; border: 2px dashed #6366f1 !important; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200 flex flex-col">

  <!-- ヘッダーエリア -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
          <i class="fa-solid fa-bookmark text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight text-gray-900 dark:text-white">WebBookmark</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400 hidden sm:block">GitHub同期版</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <span id="syncStatus" class="text-xs text-gray-400 hidden sm:inline">同期待機中...</span>

        <button onclick="openModal()" class="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm px-3.5 py-2 rounded-xl transition shadow-sm">
          <i class="fa-solid fa-plus text-xs"></i>
          <span class="hidden sm:inline">追加</span>
        </button>

        <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full flex flex-col md:flex-row gap-6">

    <aside class="w-full md:w-64 shrink-0 space-y-6">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="検索..." 
          class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 border border-gray-200 dark:border-gray-700/60 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400">カテゴリ</h2>
          <span id="totalCount" class="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded-full font-medium">0</span>
        </div>
        <nav id="categoryList" class="space-y-1"></nav>
      </div>
    </aside>

    <section class="flex-1 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 id="activeCategoryTitle" class="text-lg font-bold text-gray-900 dark:text-white">すべて</h2>
          <p class="text-xs text-gray-400 mt-0.5">ドラッグ＆ドロップで並び替え可能</p>
        </div>
        <div class="text-sm text-gray-500" id="resultStats">0 件</div>
      </div>

      <div id="bookmarksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center bg-white dark:bg-gray-800 rounded-2xl border border-dashed border-gray-700 p-8">
        <div class="w-16 h-16 rounded-full bg-brand-50 dark:bg-gray-700 text-brand-600 flex items-center justify-center mb-4 text-2xl">
          <i class="fa-solid fa-folder-open"></i>
        </div>
        <h3 class="text-base font-semibold text-white">ブックマークがありません</h3>
        <button onclick="openModal()" class="mt-4 text-sm font-medium text-brand-400 hover:underline">追加する</button>
      </div>
    </section>
  </main>

  <!-- モーダル -->
  <div id="modalBackdrop" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-700 w-full max-w-md overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700">
        <h3 id="modalTitle" class="font-bold text-white">ブックマーク追加</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="bookmarkForm" onsubmit="saveBookmark(event)" class="p-6 space-y-4">
        <input type="hidden" id="bookmarkId">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">URL *</label>
          <input type="url" id="formUrl" required placeholder="https://example.com" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">タイトル *</label>
          <input type="text" id="formTitle" required placeholder="タイトル" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-sm text-white">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">カテゴリ</label>
            <select id="formCategory" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-sm text-white">
              <option value="仕事">仕事</option>
              <option value="プログラミング">プログラミング</option>
              <option value="デザイン">デザイン</option>
              <option value="趣味">趣味</option>
              <option value="後で読む">後で読む</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">タグ</label>
            <input type="text" id="formTag" placeholder="タグ" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-sm text-white">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">メモ</label>
          <textarea id="formNote" rows="2" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-sm text-white resize-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-300">キャンセル</button>
          <button type="submit" class="px-5 py-2 bg-brand-600 text-white font-medium text-sm rounded-xl">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl text-sm font-medium">
    <span id="toastMessage">保存しました</span>
  </div>

  <script>
    // ★★★★ GitHub設定 ★★★★
    const GITHUB_USER = 'nirachanman';
    const GITHUB_REPO = 'nirachanman';
    const GITHUB_TOKEN = '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';
    const FILE_PATH = 'web_portal/bookmarks.json';

    let bookmarks = [];
    let selectedCategory = 'すべて';
    let searchQuery = '';

    window.onload = async function() {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-base';
      }
      await loadFromGitHub();
      renderApp();
    };

    async function loadFromGitHub() {
      const status = document.getElementById('syncStatus');
      status.innerText = 'GitHubから同期中...';
      try {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
        // token 認証に変更
        const res = await fetch(url, {
          headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });
        if (res.ok) {
          const data = await res.json();
          const decoded = decodeURIComponent(escape(atob(data.content)));
          bookmarks = JSON.parse(decoded);
          window.fileSha = data.sha;
          status.innerText = '同期完了 (最新)';
        } else {
          status.innerText = 'ファイル未検出';
          bookmarks = [];
        }
      } catch (err) {
        console.error(err);
        status.innerText = '同期失敗(ローカル表示)';
        const stored = localStorage.getItem('my_web_bookmarks_ja');
        if (stored) bookmarks = JSON.parse(stored);
      }
    }

    async function syncToGitHub() {
      const status = document.getElementById('syncStatus');
      status.innerText = 'GitHubへ同期中...';
      try {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(bookmarks, null, 2))));
        
        let currentSha = window.fileSha;
        if (!currentSha) {
          // token 認証に変更
          const getRes = await fetch(url, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
          });
          if (getRes.ok) {
            const getData = await getRes.json();
            currentSha = getData.sha;
          }
        }

        const bodyData = {
          message: 'Update bookmarks via WebBookmark App',
          content: contentEncoded,
        };
        if (currentSha) bodyData.sha = currentSha;

        // token 認証に変更
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });

        if (res.ok) {
          const resData = await res.json();
          window.fileSha = resData.content.sha;
          status.innerText = '同期完了！';
          setTimeout(() => status.innerText = '最新状態', 2000);
        } else {
          const errText = await res.text();
          console.error('GitHub Sync Error:', errText);
          status.innerText = '同期エラー (401等確認)';
        }
      } catch (err) {
        console.error(err);
        status.innerText = '同期失敗';
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem('my_web_bookmarks_ja', JSON.stringify(bookmarks));
      syncToGitHub();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-moon text-base' : 'fa-solid fa-sun text-base';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function renderApp() {
      renderCategories();
      renderBookmarks();
    }

    function renderCategories() {
      const categories = ['すべて', '仕事', 'プログラミング', 'デザイン', '趣味', '後で読む'];
      const categoryList = document.getElementById('categoryList');
      document.getElementById('totalCount').innerText = bookmarks.length;

      categoryList.innerHTML = categories.map(cat => {
        const count = cat === 'すべて' ? bookmarks.length : bookmarks.filter(b => b.category === cat).length;
        const isActive = selectedCategory === cat;
        return `
          <button onclick="selectCategory('${cat}')" 
            class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition ${
              isActive ? 'bg-brand-50 dark:bg-brand-900/30 text-brand-400' : 'text-gray-400 hover:bg-gray-800'
            }">
            <span>${cat}</span>
            <span class="text-xs bg-gray-700 px-2 py-0.5 rounded-full">${count}</span>
          </button>
        `;
      }).join('');
    }

    function renderBookmarks() {
      const grid = document.getElementById('bookmarksGrid');
      const emptyState = document.getElementById('emptyState');
      const categoryTitle = document.getElementById('activeCategoryTitle');
      const stats = document.getElementById('resultStats');

      categoryTitle.innerText = selectedCategory;

      const filtered = bookmarks.filter(b => {
        const matchesCategory = selectedCategory === 'すべて' || b.category === selectedCategory;
        const query = searchQuery.toLowerCase();
        return matchesCategory && (!query || b.title.toLowerCase().includes(query) || b.url.toLowerCase().includes(query));
      });

      stats.innerText = `${bookmarks.length} 件中 ${filtered.length} 件`;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      grid.innerHTML = filtered.map(b => {
        const domain = getDomain(b.url);
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
        
        return `
          <div draggable="true" ondragstart="onDragStart(event, '${b.id}')" ondragover="onDragOver(event)" ondrop="onDrop(event, '${b.id}')" ondragend="onDragEnd(event)"
               class="group bg-gray-800 rounded-2xl p-4 border border-gray-700 shadow-sm hover:border-brand-500/50 transition flex flex-col justify-between relative cursor-grab">
            <a href="${b.url}" target="_blank" rel="noopener noreferrer" class="no-underline block">
              <div>
                <div class="flex items-start justify-between gap-3 mb-2">
                  <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gray-700 p-1.5 flex items-center justify-center shrink-0">
                      <img src="${faviconUrl}" alt="" class="w-5 h-5 object-contain" onerror="this.src='https://placehold.co/32x32/6366f1/ffffff?text=B'">
                    </div>
                    <div>
                      <h3 class="font-semibold text-white text-sm line-clamp-1 group-hover:text-brand-400">${escapeHtml(b.title)}</h3>
                      <p class="text-xs text-gray-400 line-clamp-1">${domain}</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition z-10">
                    <button onclick="event.preventDefault(); event.stopPropagation(); editBookmark('${b.id}')" class="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-gray-700"><i class="fa-solid fa-pen text-xs"></i></button>
                    <button onclick="event.preventDefault(); event.stopPropagation(); deleteBookmark('${b.id}')" class="p-1.5 text-gray-400 hover:text-red-500 rounded-lg hover:bg-gray-700"><i class="fa-solid fa-trash text-xs"></i></button>
                  </div>
                </div>
                ${b.note ? `<p class="text-xs text-gray-300 my-2 line-clamp-2">${escapeHtml(b.note)}</p>` : ''}
              </div>
            </a>
            <div class="pt-3 mt-2 border-t border-gray-700/50 flex items-center justify-between">
              <span class="text-[11px] font-medium bg-gray-700 text-gray-300 px-2 py-0.5 rounded-md">${b.category}</span>
              <a href="${b.url}" target="_blank" rel="noopener noreferrer" class="text-xs text-brand-400 hover:underline">開く <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>
            </div>
          </div>
        `;
      }).join('');
    }

    let draggedId = null;
    function onDragStart(e, id) { draggedId = id; e.target.classList.add('dragging'); }
    function onDragOver(e) { e.preventDefault(); }
    function onDrop(e, targetId) {
      e.preventDefault();
      if (draggedId === targetId) return;
      const oldIndex = bookmarks.findIndex(b => b.id === draggedId);
      const newIndex = bookmarks.findIndex(b => b.id === targetId);
      if (oldIndex !== -1 && newIndex !== -1) {
        const [moved] = bookmarks.splice(oldIndex, 1);
        bookmarks.splice(newIndex, 0, moved);
        saveToLocalStorage();
        renderApp();
      }
    }
    function onDragEnd(e) { e.target.classList.remove('dragging'); }

    function selectCategory(cat) { selectedCategory = cat; renderApp(); }
    function handleSearch() { searchQuery = document.getElementById('searchInput').value; renderBookmarks(); }

    function openModal(editId = null) {
      const modal = document.getElementById('modalBackdrop');
      document.getElementById('bookmarkForm').reset();
      if (editId) {
        const item = bookmarks.find(b => b.id === editId);
        if (item) {
          document.getElementById('bookmarkId').value = item.id;
          document.getElementById('formTitle').value = item.title;
          document.getElementById('formUrl').value = item.url;
          document.getElementById('formCategory').value = item.category;
          document.getElementById('formTag').value = item.tag || '';
          document.getElementById('formNote').value = item.note || '';
        }
      } else {
        document.getElementById('bookmarkId').value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modalBackdrop').classList.add('hidden'); }

    function saveBookmark(e) {
      e.preventDefault();
      const id = document.getElementById('bookmarkId').value;
      const title = document.getElementById('formTitle').value;
      let url = document.getElementById('formUrl').value;
      const category = document.getElementById('formCategory').value;
      const tag = document.getElementById('formTag').value;
      const note = document.getElementById('formNote').value;

      if (!url.startsWith('http')) url = 'https://' + url;

      if (id) {
        const index = bookmarks.findIndex(b => b.id === id);
        if (index !== -1) bookmarks[index] = { ...bookmarks[index], title, url, category, tag, note };
      } else {
        bookmarks.unshift({ id: Date.now().toString(), title, url, category, tag, note, createdAt: Date.now() });
      }

      saveToLocalStorage();
      closeModal();
      renderApp();
      showToast('GitHubへ同期しました');
    }

    function editBookmark(id) { openModal(id); }
    function deleteBookmark(id) {
      bookmarks = bookmarks.filter(b => b.id !== id);
      saveToLocalStorage();
      renderApp();
      showToast('削除して同期しました');
    }

    function getDomain(urlStr) {
      try { return new URL(urlStr.startsWith('http') ? urlStr : 'https://' + urlStr).hostname.replace('www.', ''); }
      catch { return urlStr; }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
    }
  </script>
</body>
</html>
