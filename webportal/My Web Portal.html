<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>My Web Portal</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>

:root{
 --bg:#0f172a;
 --card:#1e293b;
 --focus:#2563eb;
 --text:white;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 background:var(--bg);
 color:var(--text);
 font-family:Segoe UI,sans-serif;
 padding:20px;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}

h1{
 font-size:2rem;
}

button{
 border:none;
 cursor:pointer;
}

.login-btn{
 background:#4285F4;
 color:white;
 padding:10px 20px;
 border-radius:8px;
}

.toolbar{
 display:flex;
 gap:10px;
 margin-bottom:20px;
}

.toolbar input{
 flex:1;
 padding:12px;
 border-radius:8px;
 border:none;
}

.add-btn{
 padding:12px 20px;
 border-radius:8px;
 background:#2563eb;
 color:white;
}

.section-title{
 font-size:1.4rem;
 margin:20px 0 10px;
}

.row{
 display:flex;
 gap:16px;
 overflow-x:auto;
 scroll-snap-type:x mandatory;
}

.row::-webkit-scrollbar{
 height:8px;
}

.card{
 min-width:320px;
 height:180px;
 background:var(--card);
 border-radius:16px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 position:relative;
 transition:.2s;
}

.card.active{
 transform:scale(1.08);
 background:var(--focus);
}

.card img{
 width:64px;
 height:64px;
 margin-bottom:10px;
}

.title{
 font-size:1.2rem;
}

.actions{
 position:absolute;
 top:10px;
 right:10px;
 display:flex;
 gap:5px;
}

.actions button{
 width:32px;
 height:32px;
 border-radius:50%;
}

.edit{
 background:orange;
}

.delete{
 background:#ef4444;
 color:white;
}

.favorite{
 background:#f59e0b;
}

@media(max-width:768px){

.card{
 min-width:260px;
 height:140px;
}

}

.tv-mode .card{
 min-width:360px;
 height:220px;
}

</style>
</head>
<body>

<header>

<h1>MY WEB PORTAL</h1>

<button class="login-btn">
Googleログイン
</button>

</header>

<div class="toolbar">

<input id="urlInput"
placeholder="URLを入力">

<button class="add-btn"
onclick="addBookmark()">

追加

</button>

</div>

<h2 class="section-title">
📌 NHK固定
</h2>

<div id="nhkRow" class="row"></div>

<h2 class="section-title">
⭐ お気に入り
</h2>

<div id="favRow" class="row"></div>

<h2 class="section-title">
🌐 ブックマーク
</h2>

<div id="mainRow" class="row"></div>

<script>

const nhkBookmarks=[
{
 title:"NHK NEWS",
 url:"https://www3.nhk.or.jp/news/"
},
{
 title:"NHKラジオ",
 url:"https://www.nhk.or.jp/radio/"
}
];

let bookmarks=
JSON.parse(
localStorage.getItem("bookmarks")
)||[];

function favicon(url){

 try{

   let host=
   new URL(url).hostname;

   return
`https://www.google.com/s2/favicons?domain=${host}&sz=128`;

 }catch{

   return "";
 }

}

function render(){

 renderNHK();

 const row=
 document.getElementById("mainRow");

 row.innerHTML="";

 bookmarks.forEach((b,index)=>{

   row.innerHTML+=`

   <div class="card"
        tabindex="0"
        onclick="openSite('${b.url}')">

      <div class="actions">

      <button
      class="favorite"
      onclick="toggleFav(event,${index})">
      ★
      </button>

      <button
      class="edit"
      onclick="editBookmark(event,${index})">
      ✎
      </button>

      <button
      class="delete"
      onclick="deleteBookmark(event,${index})">
      ×
      </button>

      </div>

      <img src="${favicon(b.url)}">

      <div class="title">
       ${b.title}
      </div>

   </div>
   `;

 });

 save();
 renderFavorites();

}

function renderNHK(){

 const row=
 document.getElementById("nhkRow");

 row.innerHTML="";

 nhkBookmarks.forEach(b=>{

 row.innerHTML+=`
 <div class="card"
 onclick="openSite('${b.url}')">

 <img src="${favicon(b.url)}">

 <div class="title">
 ${b.title}
 </div>

 </div>
 `;
 });

}

function renderFavorites(){

 const row=
 document.getElementById("favRow");

 row.innerHTML="";

 bookmarks.filter(b=>b.favorite)
 .forEach(b=>{

 row.innerHTML+=`
 <div class="card"
 onclick="openSite('${b.url}')">

   <img src="${favicon(b.url)}">

   <div class="title">
    ${b.title}
   </div>

 </div>
 `;
 });

}

function addBookmark(){

 const url=
 document.getElementById("urlInput").value;

 if(!url) return;

 let title=
 prompt("サイト名");

 if(!title) return;

 bookmarks.push({
   title,
   url,
   favorite:false
 });

 render();

}

function deleteBookmark(e,index){

 e.stopPropagation();

 bookmarks.splice(index,1);

 render();

}

function editBookmark(e,index){

 e.stopPropagation();

 let title=
 prompt("タイトル",
 bookmarks[index].title);

 if(title){

 bookmarks[index].title=
 title;

 render();

 }

}

function toggleFav(e,index){

 e.stopPropagation();

 bookmarks[index].favorite=
 !bookmarks[index].favorite;

 render();

}

function save(){

 localStorage.setItem(
 "bookmarks",
 JSON.stringify(bookmarks)
 );

}

function openSite(url){

 location.href=url;

}

new Sortable(mainRow,{
 animation:150
});

let focus=0;

document.addEventListener(
"keydown",
e=>{

 const cards=
 document.querySelectorAll(".card");

 if(!cards.length)return;

 if(e.key==="ArrowRight")
 focus++;

 if(e.key==="ArrowLeft")
 focus--;

 if(focus<0)focus=0;

 if(focus>=cards.length)
 focus=cards.length-1;

 cards.forEach(c=>
 c.classList.remove("active"));

 cards[focus]
 .classList.add("active");

 cards[focus].scrollIntoView({
 behavior:"smooth",
 inline:"center"
 });

 if(e.key==="Enter")
 cards[focus].click();

});

const isFireTV=
/AFT|Fire TV/i
.test(
 navigator.userAgent
);

if(isFireTV){

 document.body
 .classList
 .add("tv-mode");

}

if(
"serviceWorker"
in navigator
){

 navigator
 .serviceWorker
 .register(
 "service-worker.js"
 );

}

render();

</script>

</body>
</html>
