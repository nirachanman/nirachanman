<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Web Portal</title>

<style>

:root{
  --bg:#0f172a;
  --card:#1e293b;
  --focus:#2563eb;
  --text:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:sans-serif;
  padding:20px;
}

h1{
  margin-bottom:20px;
}

.form-area{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:30px;
}

input,
select{
  padding:12px;
  border:none;
  border-radius:10px;
}

input{
  flex:1;
  min-width:180px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.section{
  margin-bottom:40px;
}

.section h2{
  margin-bottom:12px;
}

.row{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding-bottom:10px;
  scroll-behavior:smooth;
}

.row::-webkit-scrollbar{
  height:8px;
}

.row::-webkit-scrollbar-thumb{
  background:#475569;
  border-radius:20px;
}

.card{
  min-width:260px;
  height:150px;
  background:var(--card);

  border-radius:16px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-decoration:none;
  color:white;

  transition:.2s;
}

.card:hover{
  background:var(--focus);
  transform:scale(1.05);
}

.card.focused{
  background:var(--focus);
  transform:scale(1.08);
  box-shadow:0 0 20px rgba(37,99,235,.7);
}

.card img{
  width:48px;
  height:48px;
  margin-bottom:10px;
}

@media(min-width:1200px){

  .card{
    min-width:340px;
    height:190px;
  }

}

</style>
</head>
<body>

<h1>MY WEB PORTAL</h1>

<div class="form-area">

  <input
    id="title"
    placeholder="サイト名">

  <input
    id="url"
    placeholder="https://example.com">

  <select id="category">

    <option>ニュース</option>
    <option>AI</option>
    <option>動画</option>
    <option>開発</option>
    <option>その他</option>

  </select>

  <button onclick="addBookmark()">
    追加
  </button>

</div>

<div id="portal"></div>

<script>

const defaults = [

  {
    title:"NHK NEWS",
    url:"https://www3.nhk.or.jp/news/",
    category:"ニュース"
  },

  {
    title:"Copilot",
    url:"https://copilot.microsoft.com/",
    category:"AI"
  },

  {
    title:"YouTube",
    url:"https://www.youtube.com/",
    category:"動画"
  }

];

let bookmarks =
JSON.parse(
localStorage.getItem("bookmarks")
) || defaults;

function save(){

  localStorage.setItem(
    "bookmarks",
    JSON.stringify(bookmarks)
  );

}

function favicon(url){

  try{

    const host =
      new URL(url).hostname;

    return `https://www.google.com/s2/favicons?domain=${host}&sz=128`;

  }catch{

    return "";

  }

}

function addBookmark(){

  const title =
    document
    .getElementById("title")
    .value
    .trim();

  const url =
    document
    .getElementById("url")
    .value
    .trim();

  const category =
    document
    .getElementById("category")
    .value;

  if(!title || !url){

    alert("サイト名とURLを入力してください");

    return;
  }

  bookmarks.push({
    title,
    url,
    category
  });

  save();

  render();

  document.getElementById("title").value="";
  document.getElementById("url").value="";

}

function render(){

  const portal =
    document.getElementById("portal");

  const groups = {};

  bookmarks.forEach(bookmark=>{

    if(!groups[bookmark.category]){

      groups[bookmark.category]=[];

    }

    groups[bookmark.category]
      .push(bookmark);

  });

  portal.innerHTML="";

  Object.keys(groups).forEach(category=>{

    const section =
      document.createElement("div");

    section.className="section";

    section.innerHTML=`
      <h2>${category}</h2>

      <div class="row">

      ${groups[category]
        .map(item=>`

        <a
          class="card"
          href="${item.url}"
          target="_blank"
          rel="noopener noreferrer">

          <img
           src="${favicon(item.url)}">

          <div>
            ${item.title}
          </div>

        </a>

      `).join("")}

      </div>
    `;

    portal.appendChild(section);

  });

  initFocus();

}

let current=0;

function initFocus(){

  const cards =
    document.querySelectorAll(".card");

  if(!cards.length) return;

  cards.forEach(card=>
    card.classList.remove(
      "focused"
    )
  );

  current=0;

  cards[0].classList.add(
    "focused"
  );

}

document.addEventListener(
"keydown",
e=>{

  const cards =
    document.querySelectorAll(".card");

  if(!cards.length) return;

  switch(e.key){

    case "ArrowRight":
      current++;
      break;

    case "ArrowLeft":
      current--;
      break;

    case "Enter":

      cards[current].click();

      return;

    default:
      return;

  }

  if(current < 0){

    current = 0;

  }

  if(current >= cards.length){

    current =
      cards.length - 1;

  }

  cards.forEach(card=>
    card.classList.remove(
      "focused"
    )
  );

  cards[current]
    .classList.add(
      "focused"
    );

  cards[current]
    .scrollIntoView({
      behavior:"smooth",
      inline:"center"
    });

});

render();

</script>

</body>
</html>
